name: APU Cycle And Span Proof

on:
  push:
    branches:
      - phase2/apu-cycle-proof
      - phase2/apu-cycle-budget-proof-v2
      - phase2/apu-cycle-budget-edge-proof
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: sodium64-apu-cycle-proof-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTHICVANIA_SOURCE_RUN: 35145447113
  GOTHICVANIA_ARTIFACT_ID: 10466504920
  GOTHICVANIA_ROM_SHA256: 5519d51ff9c803c1653add5eca0585f37fe8bd96e2b1a758b1d5c7f3ee2ee519
  ARES_PIN: 17813a3ccda21ab9bd45f09bfc2f91196dbf50ff

jobs:
  profile-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Install libdragon
        run: npm install -g libdragon

      - name: Checkout Sodium64
        uses: actions/checkout@v4

      - name: Run host profiling tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Compile PROFILE diagnostic build
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          libdragon init
          libdragon make PROFILE=1 -j$(nproc) 2>&1 | tee profile-build.log

      - name: Upload exact proof build
        uses: actions/upload-artifact@v4
        with:
          name: sodium64-apu-cycle-proof-build
          retention-days: 14
          path: |
            sodium64.z64
            rom-converter.py
            build/sodium64.elf
            build/*.map
            profile-build.log

  cycle-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - profile-build

    steps:
      - name: Checkout Sodium64
        uses: actions/checkout@v4

      - name: Download exact proof build
        uses: actions/download-artifact@v4
        with:
          name: sodium64-apu-cycle-proof-build
          path: artifacts/profile

      - name: Install ares dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache \
            cmake \
            curl \
            git \
            libgtk-3-dev \
            libgl1-mesa-dri \
            libsdl2-dev \
            libvulkan1 \
            mesa-vulkan-drivers \
            ninja-build \
            qt6-base-dev \
            unzip \
            xauth \
            xvfb

      - name: Restore ares compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ares-n64-ccache-${{ runner.os }}-${{ runner.arch }}-${{ env.ARES_PIN }}-rsp-interpreter-v1

      - name: Build pinned N64-only ares in valid lab mode
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ares-src"
          git clone --filter=blob:none https://github.com/ares-emulator/ares.git "$root"
          git -C "$root" checkout "$ARES_PIN"
          cd "$root"

          # LAB LIMITATION: pinned ares RSP JIT breaks Sodium64's custom
          # microcode/semaphore path. Keep R4300 JIT and force RSP interpreter.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ares/n64/system/system.cpp')
          s = p.read_text()
          old = 'rsp.recompiler.enabled = value.boolean();'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'rsp.recompiler.enabled = false;', 1))
          PY

          ccache --zero-stats
          .github/scripts/build_sdl.sh
          cmake --preset ubuntu-ci -DARES_CORES=n64
          cmake --build build --parallel "$(nproc)"
          ccache --show-stats
          ares_bin=$(find "$root/build" -type f -name ares -perm -111 | head -n1)
          test -n "$ares_bin"
          test -x "$ares_bin"
          echo "ARES_BIN=$ares_bin" >> "$GITHUB_ENV"
          "$ares_bin" --version | tee "$GITHUB_WORKSPACE/ares-version.txt"

      - name: Download exact validated Gothicvania survivability artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p workload/source workloads/ares
          zip="$RUNNER_TEMP/gothicvania-source-build.zip"
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$GOTHICVANIA_ARTIFACT_ID/zip" \
            -o "$zip"
          unzip -q "$zip" -d workload/source

          test -s workload/source/gothicvania-benchmark.sfc
          echo "$GOTHICVANIA_ROM_SHA256  workload/source/gothicvania-benchmark.sfc" | sha256sum --check
          cp artifacts/profile/sodium64.z64 workloads/ares/sodium64.z64
          cp artifacts/profile/rom-converter.py workloads/ares/rom-converter.py
          cp workload/source/gothicvania-benchmark.sfc workloads/ares/profile-gothicvania.smc
          (
            cd workloads/ares
            python3 rom-converter.py </dev/null
          )
          test -s workloads/ares/out/profile-gothicvania.z64

      - name: Resolve exact runtime symbols
        shell: bash
        run: |
          set -euo pipefail
          elf="artifacts/profile/build/sodium64.elf"
          symbol() {
            nm -n "$elf" | awk -v name="$1" '$3 == name { print $1; exit }'
          }

          apu_ram=$(symbol apu_ram)
          apu_map=$(symbol apu_map)
          apu_count=$(symbol apu_count)
          apu_clock=$(symbol apu_clock)
          apu_reg_x=$(symbol apu_reg_x)
          apu_reg_y=$(symbol apu_reg_y)
          apu_accum=$(symbol apu_accum)
          apu_stack=$(symbol apu_stack)
          apu_flags=$(symbol apu_flags)
          apu_halt=$(symbol apu_halt)
          jit_tags=$(symbol jit_tags)
          jit_lookup=$(symbol jit_lookup)
          jit_pointer=$(symbol jit_pointer)
          apu_execute=$(symbol apu_execute)
          apu_read8=$(symbol apu_read8)
          compile_block=$(symbol compile_block)
          cpu_execute=$(symbol cpu_execute)

          for value in \
            "$apu_ram" "$apu_map" "$apu_count" "$apu_clock" "$apu_reg_x" "$apu_reg_y" \
            "$apu_accum" "$apu_stack" "$apu_flags" "$apu_halt" "$jit_tags" "$jit_lookup" "$jit_pointer" \
            "$apu_execute" "$apu_read8" "$compile_block" "$cpu_execute"; do
            test -n "$value"
          done

          {
            echo "APU_RAM_ADDR=$apu_ram"
            echo "APU_MAP_ADDR=$apu_map"
            echo "APU_COUNT_ADDR=$apu_count"
            echo "APU_CLOCK_ADDR=$apu_clock"
            echo "APU_REG_X_ADDR=$apu_reg_x"
            echo "APU_REG_Y_ADDR=$apu_reg_y"
            echo "APU_ACCUM_ADDR=$apu_accum"
            echo "APU_STACK_ADDR=$apu_stack"
            echo "APU_FLAGS_ADDR=$apu_flags"
            echo "APU_HALT_ADDR=$apu_halt"
            echo "JIT_TAGS_ADDR=$jit_tags"
            echo "JIT_LOOKUP_ADDR=$jit_lookup"
            echo "JIT_POINTER_ADDR=$jit_pointer"
            echo "APU_EXECUTE_ADDR=$apu_execute"
            echo "APU_READ8_ADDR=$apu_read8"
            echo "COMPILE_BLOCK_ADDR=$compile_block"
            echo "CPU_EXECUTE_ADDR=$cpu_execute"
          } | tee -a "$GITHUB_ENV"

      - name: Run dynamic SPC700 cycle/span proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          rom="workloads/ares/out/profile-gothicvania.z64"
          home="$RUNNER_TEMP/ares-home-apu-cycle-proof"
          settings="$RUNNER_TEMP/ares-settings-apu-cycle-proof.bml"
          emulator_log="diagnostics/ares-emulator.log"
          proof_log="diagnostics/apu-cycle-proof.log"
          proof_json="diagnostics/apu-cycle-proof.json"
          mkdir -p "$home"

          HOME="$home" SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 \
            xvfb-run -a stdbuf -oL -eL "$ARES_BIN" \
              --no-file-prompt \
              --system "Nintendo 64" \
              --settings-file "$settings" \
              --setting "Developer/DebugServerEnabled=true" \
              --setting "Developer/DebugServerUseIPv4=true" \
              --setting "Developer/DebugServerPort=9150" \
              --setting "Developer/HomebrewMode=true" \
              --setting "Developer/DeterministicEntropy=true" \
              --setting "Developer/ForceInterpreter=false" \
              --setting "Boot/AwaitGDBClient=true" \
              "$rom" \
              > "$emulator_log" 2>&1 &
          ares_pid=$!

          cleanup_run() {
            kill "$ares_pid" 2>/dev/null || true
            wait "$ares_pid" 2>/dev/null || true
          }
          trap cleanup_run EXIT

          if ! python3 scripts/apu_cycle_proof.py \
            --port 9150 \
            --connect-timeout 45 \
            --response-timeout 60 \
            --apu-ram "0x$APU_RAM_ADDR" \
            --apu-map "0x$APU_MAP_ADDR" \
            --apu-count "0x$APU_COUNT_ADDR" \
            --apu-clock "0x$APU_CLOCK_ADDR" \
            --apu-reg-x "0x$APU_REG_X_ADDR" \
            --apu-reg-y "0x$APU_REG_Y_ADDR" \
            --apu-accum "0x$APU_ACCUM_ADDR" \
            --apu-stack "0x$APU_STACK_ADDR" \
            --apu-flags "0x$APU_FLAGS_ADDR" \
            --apu-halt "0x$APU_HALT_ADDR" \
            --jit-tags "0x$JIT_TAGS_ADDR" \
            --jit-lookup "0x$JIT_LOOKUP_ADDR" \
            --jit-pointer "0x$JIT_POINTER_ADDR" \
            --apu-execute "0x$APU_EXECUTE_ADDR" \
            --apu-read8 "0x$APU_READ8_ADDR" \
            --compile-block "0x$COMPILE_BLOCK_ADDR" \
            --cpu-execute "0x$CPU_EXECUTE_ADDR" \
            --output "$proof_json" \
            > "$proof_log" 2>&1; then
            cat "$proof_log"
            tail -200 "$emulator_log" || true
            exit 1
          fi
          cat "$proof_log"
          cleanup_run
          trap - EXIT

      - name: Summarize proof without pre-judging hypothesis
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path('diagnostics/apu-cycle-proof.json')
          data = json.loads(p.read_text())
          print(json.dumps(data['summary'], indent=2, sort_keys=True))

          lines = [
              '### SPC700 cycle / block-span proof',
              '',
              '| case | source bytes | static debit | static units | total debit | total units | reference cycles | tag regions |',
              '|---|---:|---:|---:|---:|---:|---:|---|',
          ]
          for case in data['cases']:
              ref = case['reference_spc_cycles']
              lines.append(
                  f"| {case['name']} | {case['source_bytes']} | {case['cycle_debit']} | "
                  f"{case['source_clock_units']} | {case['total_cycle_debit']} | "
                  f"{case['total_clock_units']} | {ref if ref is not None else 'n/a'} | "
                  f"{case['header_start_region']}→{case['header_end_region']} |"
              )
          re = data['middle_region_reentry']
          if re.get('applicable', True):
              lines += [
                  '',
                  f"- Middle tag region mutated: {re['middle_region']}.",
                  f"- Recompiled before first cpu_execute return: **{re['recompiled_before_first_cpu_return']}**.",
                  f"- Stale block reused without recompile: **{re['stale_block_reused_without_recompile']}**.",
                  f"- Lookup changed across probe: **{re['lookup_changed']}**.",
                  f"- JIT pointer changed across probe: **{re['jit_pointer_changed']}**.",
              ]
          else:
              lines += [
                  '',
                  f"- Middle-region mutation probe: **not applicable** ({re['reason']}).",
              ]
          lines += [
              '',
              '> Diagnostic branch only. Passing this proof validates the audited timing families, not complete SPC700 timing or a performance improvement.',
          ]
          with open(Path(__import__('os').environ['GITHUB_STEP_SUMMARY']), 'a', encoding='utf-8') as f:
              f.write('\n'.join(lines) + '\n')
          PY

      - name: Upload proof diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sodium64-apu-cycle-proof
          retention-days: 14
          if-no-files-found: ignore
          path: |
            ares-version.txt
            diagnostics/
            artifacts/profile/profile-build.log
