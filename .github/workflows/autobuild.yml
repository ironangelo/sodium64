name: Build and Validate

on:
  push:
    branches:
      - '**'
      - '!continuity'
  workflow_dispatch:

concurrency:
  group: sodium64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Install libdragon
        run: npm install -g libdragon

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run host profiler decoder tests
        run: python3 scripts/test_profile_report.py

      - name: Compile
        shell: bash
        run: |
          set -o pipefail
          libdragon init
          libdragon make -j$(nproc) 2>&1 | tee build.log

      - name: Record build metrics
        run: |
          python3 scripts/build_metrics.py \
            --rom sodium64.z64 \
            --elf build/sodium64.elf \
            --build-dir build \
            --output build-metrics.txt

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: sodium64-build
          retention-days: 14
          path: |
            sodium64.z64
            rom-converter.py
            build/sodium64.elf
            build/*.map
            build.log
            build-metrics.txt

  profile-build:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Install libdragon
        run: npm install -g libdragon

      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile profiling build
        shell: bash
        run: |
          set -o pipefail
          libdragon init
          libdragon make PROFILE=1 -j$(nproc) 2>&1 | tee profile-build.log

      - name: Record profiling build metrics
        run: |
          python3 scripts/build_metrics.py \
            --rom sodium64.z64 \
            --elf build/sodium64.elf \
            --build-dir build \
            --output profile-build-metrics.txt

      - name: Upload profiling artifact
        uses: actions/upload-artifact@v4
        with:
          name: sodium64-profile-build
          retention-days: 14
          path: |
            sodium64.z64
            rom-converter.py
            build/sodium64.elf
            build/*.map
            profile-build.log
            profile-build-metrics.txt

  emulator-smoke:
    runs-on: ubuntu-latest
    needs:
      - build
      - profile-build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download normal build
        uses: actions/download-artifact@v4
        with:
          name: sodium64-build
          path: artifacts/normal

      - name: Download profiling build
        uses: actions/download-artifact@v4
        with:
          name: sodium64-profile-build
          path: artifacts/profile

      - name: Install Mupen64Plus build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            expect \
            git \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libpng-dev \
            libsdl2-dev \
            libvulkan-dev \
            pkg-config \
            zlib1g-dev

      - name: Build pinned Mupen64Plus debugger and LLE RSP
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/sodium64-mupen"
          mkdir -p "$root"
          cd "$root"

          git clone https://github.com/mupen64plus/mupen64plus-core.git
          git -C mupen64plus-core checkout b20b27ebf9e5b099a978e86dba609111dc98c837
          git clone https://github.com/mupen64plus/mupen64plus-ui-console.git
          git -C mupen64plus-ui-console checkout c8ac4862a019d7885b24927d9b4db5dd3e42a528
          git clone https://github.com/mupen64plus/mupen64plus-rsp-cxd4.git
          git -C mupen64plus-rsp-cxd4 checkout 00906a92641c540a64e4e7505012157315314810

          export PATH="$root/mupen64plus-core/.github/workflows/scripts:$PATH"

          cd "$root/mupen64plus-core"
          export CONFIG_OVERRIDE="DEBUGGER=1 DEBUGGER_NO_DISASM=1 NEW_DYNAREC=0 NO_ASM=1"
          ci_build.sh x64 gcc

          cd "$root/mupen64plus-ui-console"
          export CONFIG_OVERRIDE=""
          ci_build.sh x64 gcc

          cd "$root/mupen64plus-rsp-cxd4"
          export CONFIG_OVERRIDE='SSE="none"'
          export OPTFLAGS="-O3"
          ci_build.sh x64 gcc

          core_lib=$(find "$root/mupen64plus-core/pkg/usr/local/lib" -maxdepth 1 -type f -name 'libmupen64plus.so*' | head -n1)
          ui_bin="$root/mupen64plus-ui-console/pkg/usr/local/bin/mupen64plus"
          rsp_lib=$(find "$root/mupen64plus-rsp-cxd4/pkg/usr/local/lib/mupen64plus" -type f -name '*cxd4*.so' | head -n1)
          data_dir="$root/mupen64plus-core/pkg/usr/local/share/mupen64plus"

          test -f "$core_lib"
          test -x "$ui_bin"
          test -f "$rsp_lib"
          test -d "$data_dir"

          {
            echo "M64P_CORE=$core_lib"
            echo "M64P_UI=$ui_bin"
            echo "M64P_RSP=$rsp_lib"
            echo "M64P_DATA=$data_dir"
            echo "M64P_LIBDIR=$(dirname "$core_lib")"
          } >> "$GITHUB_ENV"

      - name: Generate original SNES smoke ROMs
        shell: bash
        run: |
          set -euo pipefail
          for variant in normal profile; do
            mkdir -p "smoke/$variant"
            cp "artifacts/$variant/sodium64.z64" "smoke/$variant/sodium64.z64"
            cp "artifacts/$variant/rom-converter.py" "smoke/$variant/rom-converter.py"
            python3 scripts/make_smoke_snes.py "smoke/$variant/smoke.smc"
            (
              cd "smoke/$variant"
              python3 rom-converter.py </dev/null
            )
            test -f "smoke/$variant/out/smoke.z64"
          done

      - name: Locate profiling snapshot region
        shell: bash
        run: |
          set -euo pipefail
          elf="artifacts/profile/build/sodium64.elf"
          magic=$(nm -n "$elf" | awk '$3 == "profile_magic" { print $1; exit }')
          end=$(nm -n "$elf" | awk '$3 == "profile_sample_buffer_end" { print $1; exit }')
          test -n "$magic"
          test -n "$end"
          size=$((0x$end - 0x$magic))
          test "$size" -gt 16384
          {
            echo "PROFILE_ADDR=$magic"
            echo "PROFILE_SIZE=$size"
          } >> "$GITHUB_ENV"
          echo "Profiler snapshot: 0x$magic + $size bytes"

      - name: Run normal build in headless N64 emulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m64p-config-normal"
          cat > "$RUNNER_TEMP/normal.expect" <<'EOF'
          set timeout 45
          log_file normal-emulator.log
          spawn env LD_LIBRARY_PATH=$env(M64P_LIBDIR) $env(M64P_UI) \
            --corelib $env(M64P_CORE) \
            --datadir $env(M64P_DATA) \
            --configdir $env(RUNNER_TEMP)/m64p-config-normal \
            --debug --emumode 0 --nospeedlimit \
            --gfx dummy --audio dummy --input dummy --rsp $env(M64P_RSP) \
            smoke/normal/out/smoke.z64
          expect "(dbg)"
          send "run\r"
          after 2000
          send "pause\r"
          expect "(dbg)"
          send "pc\r"
          expect "(dbg)"
          send "quit\r"
          expect eof
          EOF
          expect "$RUNNER_TEMP/normal.expect"

      - name: Run profiling build and dump samples
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m64p-config-profile"
          export PROFILE_SNAPSHOT="$GITHUB_WORKSPACE/profile-snapshot.bin"
          cat > "$RUNNER_TEMP/profile.expect" <<'EOF'
          set timeout 45
          log_file profile-emulator.log
          spawn env LD_LIBRARY_PATH=$env(M64P_LIBDIR) $env(M64P_UI) \
            --corelib $env(M64P_CORE) \
            --datadir $env(M64P_DATA) \
            --configdir $env(RUNNER_TEMP)/m64p-config-profile \
            --debug --emumode 0 --nospeedlimit \
            --gfx dummy --audio dummy --input dummy --rsp $env(M64P_RSP) \
            smoke/profile/out/smoke.z64
          expect "(dbg)"
          send "run\r"
          after 3000
          send "pause\r"
          expect "(dbg)"
          send "dumpmem $env(PROFILE_ADDR) $env(PROFILE_SIZE) $env(PROFILE_SNAPSHOT)\r"
          expect "(dbg)"
          send "quit\r"
          expect eof
          EOF
          expect "$RUNNER_TEMP/profile.expect"
          test -s profile-snapshot.bin
          test "$(stat -c %s profile-snapshot.bin)" -eq "$PROFILE_SIZE"

      - name: Decode statistical profile
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/profile_report.py \
            profile-snapshot.bin \
            artifacts/profile/build/sodium64.elf \
            --nm nm | tee profile-report.txt
          samples=$(awk '/total samples:/ { print $3 }' profile-report.txt)
          test -n "$samples"
          test "$samples" -gt 0

      - name: Upload emulator smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sodium64-emulator-smoke
          retention-days: 14
          if-no-files-found: ignore
          path: |
            normal-emulator.log
            profile-emulator.log
            profile-snapshot.bin
            profile-report.txt

  ares-smoke:
    if: github.ref == 'refs/heads/phase1/ares-profiler-harness'
    runs-on: ubuntu-24.04
    needs:
      - profile-build

    steps:
      - name: Checkout Sodium64
        uses: actions/checkout@v4

      - name: Download profiling build
        uses: actions/download-artifact@v4
        with:
          name: sodium64-profile-build
          path: artifacts/profile

      - name: Install ares build and virtual-display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache \
            cmake \
            git \
            libgtk-3-dev \
            libgl1-mesa-dri \
            libsdl2-dev \
            libvulkan1 \
            mesa-vulkan-drivers \
            ninja-build \
            qt6-base-dev \
            xauth \
            xvfb

      - name: Build pinned ares
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ares-src"
          git clone https://github.com/ares-emulator/ares.git "$root"
          git -C "$root" checkout 17813a3ccda21ab9bd45f09bfc2f91196dbf50ff
          cd "$root"
          .github/scripts/build_sdl.sh
          TARGET_PRESET=ubuntu-ci .github/scripts/build_ubuntu.sh
          ares_bin=$(find "$root/build" -type f -name ares -perm -111 | head -n1)
          test -n "$ares_bin"
          test -x "$ares_bin"
          echo "ARES_BIN=$ares_bin" >> "$GITHUB_ENV"
          "$ares_bin" --version | tee "$GITHUB_WORKSPACE/ares-version.txt"

      - name: Generate profiling N64 smoke ROM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke/ares
          cp artifacts/profile/sodium64.z64 smoke/ares/sodium64.z64
          cp artifacts/profile/rom-converter.py smoke/ares/rom-converter.py
          python3 scripts/make_smoke_snes.py smoke/ares/smoke.smc
          (
            cd smoke/ares
            python3 rom-converter.py </dev/null
          )
          test -f smoke/ares/out/smoke.z64

      - name: Locate profiling snapshot region
        shell: bash
        run: |
          set -euo pipefail
          elf="artifacts/profile/build/sodium64.elf"
          magic=$(nm -n "$elf" | awk '$3 == "profile_magic" { print $1; exit }')
          end=$(nm -n "$elf" | awk '$3 == "profile_sample_buffer_end" { print $1; exit }')
          test -n "$magic"
          test -n "$end"
          size=$((0x$end - 0x$magic))
          test "$size" -gt 16384
          {
            echo "ARES_PROFILE_ADDR=$magic"
            echo "ARES_PROFILE_SIZE=$size"
          } >> "$GITHUB_ENV"
          echo "ares profiler snapshot: 0x$magic + $size bytes"

      - name: Run ares and capture profiler through GDB RSP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ares-home"
          export HOME="$RUNNER_TEMP/ares-home"
          export SDL_AUDIODRIVER=dummy
          export LIBGL_ALWAYS_SOFTWARE=1

          xvfb-run -a "$ARES_BIN" \
            --no-file-prompt \
            --system "[Nintendo] Nintendo 64 (NTSC)" \
            --settings-file "$RUNNER_TEMP/ares-settings.bml" \
            --setting "Developer/DebugServerEnabled=true" \
            --setting "Developer/DebugServerUseIPv4=true" \
            --setting "Developer/DebugServerPort=9123" \
            --setting "Developer/HomebrewMode=true" \
            --setting "Developer/DeterministicEntropy=true" \
            --setting "Developer/ForceInterpreter=true" \
            --setting "Boot/AwaitGDBClient=true" \
            smoke/ares/out/smoke.z64 \
            > ares-emulator.log 2>&1 &
          ares_pid=$!
          echo "$ares_pid" > ares.pid

          cleanup() {
            kill "$ares_pid" 2>/dev/null || true
            wait "$ares_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          python3 scripts/gdb_rsp_dump.py \
            --port 9123 \
            --connect-timeout 45 \
            --run-seconds 3 \
            --address "0x$ARES_PROFILE_ADDR" \
            --size "$ARES_PROFILE_SIZE" \
            --output ares-profile-snapshot.bin \
            | tee ares-gdb.log

          test -s ares-profile-snapshot.bin
          test "$(stat -c %s ares-profile-snapshot.bin)" -eq "$ARES_PROFILE_SIZE"

      - name: Decode ares statistical profile
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/profile_report.py \
            ares-profile-snapshot.bin \
            artifacts/profile/build/sodium64.elf \
            --nm nm | tee ares-profile-report.txt
          samples=$(awk '/total samples:/ { print $3 }' ares-profile-report.txt)
          test -n "$samples"
          test "$samples" -gt 0

      - name: Upload ares smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sodium64-ares-smoke
          retention-days: 14
          if-no-files-found: ignore
          path: |
            ares-version.txt
            ares-emulator.log
            ares-gdb.log
            ares-profile-snapshot.bin
            ares-profile-report.txt

  update-release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Delete old release
        uses: dev-drprasad/delete-tag-and-release@v0.2.1
        with:
          delete_release: true
          tag_name: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get build artifact
        uses: actions/download-artifact@v4
        with:
          name: sodium64-build
          path: sodium64

      - name: Package artifacts
        run: |
          cp sodium64/sodium64.z64 .
          cp sodium64/rom-converter.py .
          zip -r sodium64.zip sodium64.z64 rom-converter.py

      - name: Create new release
        uses: ncipollo/release-action@v1
        with:
          name: Rolling Release
          body: These are automatically updated builds of the latest commit on master.
          artifacts: sodium64.zip
          tag: release
          token: ${{ secrets.GITHUB_TOKEN }}
