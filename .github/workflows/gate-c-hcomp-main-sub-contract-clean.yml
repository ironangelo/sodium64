name: Gate C H-COMP Main Sub Contract Clean

on:
  push:
    branches:
      - phase4/gate-c-hcomp-main-sub-contract-clean
    paths:
      - scripts/test_gate_c_hcomp_main_sub_contract_clean.py
      - .github/workflows/gate-c-hcomp-main-sub-contract-clean.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sodium64-gate-c-hcomp-main-sub-contract-clean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main-sub-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Install libdragon
        run: npm install -g libdragon

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prove clean Main Sub L0 contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/test_gate_c_hcomp_main_sub_contract_clean.py
          python3 scripts/test_gate_c_hcomp_main_sub_contract_clean.py | tee hcomp-main-sub-contract.txt
          grep -q '^HCOMP_MAIN_SUB_CLEAN_L0_VALIDATED$' hcomp-main-sub-contract.txt

      - name: Build unchanged validated bridge runtime
        shell: bash
        run: |
          set -euo pipefail
          libdragon init
          libdragon make -j"$(nproc)" 2>&1 | tee hcomp-main-sub-clean-build.log
          python3 scripts/check_rsp_branch_delay_slots.py             build/src/rsp_main.elf build/src/rsp_mode7.elf build/src/rsp_hcomp.elf             | tee hcomp-main-sub-delay-slots.txt
          grep -E '^[[:space:]]*4096[[:space:]]+4096[[:space:]]+0[[:space:]]+8192[[:space:]]+build/src/rsp_main[.]elf$' hcomp-main-sub-clean-build.log             | tee hcomp-main-sub-rsp-main-size.txt
          grep -E '^[[:space:]]*4096[[:space:]]+4096[[:space:]]+0[[:space:]]+8192[[:space:]]+build/src/rsp_mode7[.]elf$' hcomp-main-sub-clean-build.log             | tee hcomp-main-sub-rsp-mode7-size.txt
          grep -E '^[[:space:]]*1936[[:space:]]+[0-9]+[[:space:]]+0[[:space:]]+[0-9]+[[:space:]]+build/src/rsp_hcomp[.]elf$' hcomp-main-sub-clean-build.log             | tee hcomp-main-sub-rsp-hcomp-size.txt
          sha256sum sodium64.z64 build/sodium64.elf             build/src/rsp_main.elf build/src/rsp_mode7.elf build/src/rsp_hcomp.elf             | tee hcomp-main-sub-runtime.sha256
          grep -q '^71dd6477f50fe6a0ddd55c6508ea62141c15d00147192ef07db37f79ae4cf0e0  sodium64.z64$' hcomp-main-sub-runtime.sha256

      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-hcomp-main-sub-contract-clean
          retention-days: 30
          path: |
            hcomp-main-sub-contract.txt
            hcomp-main-sub-clean-build.log
            hcomp-main-sub-delay-slots.txt
            hcomp-main-sub-rsp-main-size.txt
            hcomp-main-sub-rsp-mode7-size.txt
            hcomp-main-sub-rsp-hcomp-size.txt
            hcomp-main-sub-runtime.sha256
            build/rsp_main.map
            build/rsp_mode7.map
            build/rsp_hcomp.map
