name: Gate C H-SAMPLE Precision Control

on:
  push:
    branches:
      - phase4/gate-c-h-sample-precision-control
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sodium64-gate-c-h-sample-precision-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout Sodium64
        uses: actions/checkout@v4

      - name: Validate unchanged H-SAMPLE guest
        run: |
          python3 scripts/test_gate_c_h_sample.py -v
          python3 scripts/test_gate_c_h_sample_analyze.py -v
          mkdir -p diagnostic
          python3 scripts/make_gate_c_h_sample.py diagnostic/gate-c-h-sample.smc
          echo "347e177ceef12a04b51b7e6958bb81b09d741acf4db8edb5aea2bea8fa82af8e  diagnostic/gate-c-h-sample.smc" \
            | sha256sum --check

  precision-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: diagnostic-build
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Install libdragon
        run: npm install -g libdragon

      - name: Checkout Sodium64
        uses: actions/checkout@v4

      - name: Build exact unchanged Sodium64 core
        shell: bash
        run: |
          set -euo pipefail
          libdragon init
          libdragon make -j"$(nproc)" 2>&1 | tee sodium64-build.log
          test -s sodium64.z64
          test -s build/sodium64.elf

      - name: Generate and wrap exact original diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workload wrap
          python3 scripts/make_gate_c_h_sample.py workload/gate-c-h-sample.smc
          echo "347e177ceef12a04b51b7e6958bb81b09d741acf4db8edb5aea2bea8fa82af8e  workload/gate-c-h-sample.smc" \
            | sha256sum --check
          cp sodium64.z64 wrap/sodium64.z64
          cp rom-converter.py wrap/rom-converter.py
          cp workload/gate-c-h-sample.smc wrap/gate-c-h-sample.smc
          (cd wrap && python3 rom-converter.py </dev/null)
          test -s wrap/out/gate-c-h-sample.z64
          dd if=wrap/out/gate-c-h-sample.z64 of=workload/embedded.smc \
            bs=1 skip=$((0x104000)) count=$((32 * 1024)) status=none
          echo "347e177ceef12a04b51b7e6958bb81b09d741acf4db8edb5aea2bea8fa82af8e  workload/embedded.smc" \
            | sha256sum --check
          rm workload/embedded.smc

      - name: Locate Sodium64 H-SAMPLE state
        shell: bash
        run: |
          set -euo pipefail
          elf=build/sodium64.elf
          symbol() { nm -n "$elf" | awk -v name="$1" '$3 == name { print $1; exit }'; }
          wram=$(symbol wram)
          sect_queues=$(symbol sect_queues)
          section_ptr=$(symbol section_ptr)
          queue_id=$(symbol queue_id)
          precision_set=$(symbol precision_set)
          cur_line=$(symbol cur_line)
          whx=$(symbol whx)
          cooldown=$(symbol cooldown)
          sect_status=$(symbol sect_status)
          for value in "$wram" "$sect_queues" "$section_ptr" "$queue_id" \
                       "$precision_set" "$cur_line" "$whx" "$cooldown" "$sect_status"; do
            test -n "$value"
          done
          {
            echo "SECT_QUEUES_ADDR=0x$sect_queues"
            echo "SECTION_PTR_ADDR=0x$section_ptr"
            echo "QUEUE_ID_ADDR=0x$queue_id"
            echo "PRECISION_ADDR=0x$precision_set"
            echo "CUR_LINE_ADDR=0x$cur_line"
            echo "WHX_ADDR=0x$whx"
            echo "COOLDOWN_ADDR=0x$cooldown"
            echo "SECT_STATUS_ADDR=0x$sect_status"
            echo "FRAME_COUNTER_ADDR=0x$(printf '%08x' "$((0x$wram))")"
            echo "PROBE_ADDR=0x$(printf '%08x' "$((0x$wram + 0x100))")"
          } | tee -a "$GITHUB_ENV"

      - name: Install pinned ares dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache cmake git libgtk-3-dev libgl1-mesa-dri libsdl2-dev \
            libvulkan1 mesa-vulkan-drivers ninja-build qt6-base-dev unzip xauth xvfb

      - name: Build pinned N64-only ares in valid lab mode
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ares-src"
          git clone --filter=blob:none https://github.com/ares-emulator/ares.git "$root"
          git -C "$root" checkout 17813a3ccda21ab9bd45f09bfc2f91196dbf50ff
          cd "$root"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ares/n64/system/system.cpp')
          s = p.read_text()
          old = 'rsp.recompiler.enabled = value.boolean();'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'rsp.recompiler.enabled = false;', 1))
          PY
          .github/scripts/build_sdl.sh
          cmake --preset ubuntu-ci -DARES_CORES=n64
          cmake --build build --parallel "$(nproc)"
          ares_bin=$(find "$root/build" -type f -name ares -perm -111 | head -n1)
          test -x "$ares_bin"
          echo "ARES_BIN=$ares_bin" >> "$GITHUB_ENV"
          "$ares_bin" --version | tee "$GITHUB_WORKSPACE/ares-version.txt"

      - name: Capture MEDIUM and MAX section queues
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p captures

          run_case() {
            label="$1"
            port="$2"
            force="$3"
            home="$RUNNER_TEMP/ares-home-$label"
            settings="$RUNNER_TEMP/ares-$label-settings.bml"
            mkdir -p "$home"

            HOME="$home" SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 \
              xvfb-run -a stdbuf -oL -eL "$ARES_BIN" \
                --no-file-prompt \
                --system "Nintendo 64" \
                --settings-file "$settings" \
                --setting "Developer/DebugServerEnabled=true" \
                --setting "Developer/DebugServerUseIPv4=true" \
                --setting "Developer/DebugServerPort=$port" \
                --setting "Developer/HomebrewMode=true" \
                --setting "Developer/DeterministicEntropy=true" \
                --setting "Developer/ForceInterpreter=false" \
                --setting "Boot/AwaitGDBClient=true" \
                wrap/out/gate-c-h-sample.z64 \
                > "captures/ares-$label.log" 2>&1 &
            pid=$!

            args=(
              --port "$port"
              --warmup-seconds 3
              --sect-queues-address "$SECT_QUEUES_ADDR"
              --section-ptr-address "$SECTION_PTR_ADDR"
              --queue-id-address "$QUEUE_ID_ADDR"
              --precision-address "$PRECISION_ADDR"
              --cur-line-address "$CUR_LINE_ADDR"
              --whx-address "$WHX_ADDR"
              --cooldown-address "$COOLDOWN_ADDR"
              --sect-status-address "$SECT_STATUS_ADDR"
              --frame-counter-address "$FRAME_COUNTER_ADDR"
              --probe-address "$PROBE_ADDR"
              --output "captures/$label.json"
            )
            if [ -n "$force" ]; then
              args+=(--force-precision "$force")
            fi

            python3 scripts/gate_c_h_sample_capture_n64.py "${args[@]}"
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }

          run_case medium 9144 ""
          run_case max 9145 "20"

      - name: Compare MEDIUM against MAX
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee captures/precision-control.txt
          import json
          from pathlib import Path

          medium = json.loads(Path('captures/medium.json').read_text())
          maximum = json.loads(Path('captures/max.json').read_text())

          def records_until_final(c):
              out = []
              for r in c['records']:
                  out.append(r)
                  if r['end_line'] >= 224:
                      break
              return out

          def summary(c):
              records = records_until_final(c)
              wh = [int(r['wh0']) for r in records]
              ends = [int(r['end_line']) for r in records]
              return {
                  'precision': int(c['precision_set']),
                  'initial_precision': int(c['initial_precision_set']),
                  'forced_precision': c['forced_precision_set'],
                  'record_count': len(records),
                  'unique_wh0_count': len(set(wh)),
                  'wh0': wh,
                  'end_lines': ends,
                  'final_seen': bool(ends and ends[-1] >= 224),
              }

          m = summary(medium)
          x = summary(maximum)
          assert m['precision'] == 8, m
          assert x['precision'] == 20, x
          assert m['final_seen'] and x['final_seen'], (m, x)

          expected_medium_ends = [1]
          base = 16
          while True:
              nxt = expected_medium_ends[-1] + (base >> 2)
              if nxt >= 224:
                  break
              expected_medium_ends.append(nxt)
              base += 1
          expected_medium_ends.append(224)

          medium_fingerprint = m['end_lines'] == expected_medium_ends
          result = {
              'medium': m,
              'max': x,
              'medium_exact_cooldown_fingerprint': medium_fingerprint,
              'unique_gain': x['unique_wh0_count'] - m['unique_wh0_count'],
          }

          if medium_fingerprint and x['unique_wh0_count'] > m['unique_wh0_count']:
              result['classification'] = 'PRECISION_CONTROL_SUPPORTS_H_SAMPLE_COALESCING'
          elif x['unique_wh0_count'] <= m['unique_wh0_count']:
              result['classification'] = 'PRECISION_CONTROL_DOES_NOT_SUPPORT_COOLDOWN_CAUSALITY'
          else:
              result['classification'] = 'PRECISION_CONTROL_INDETERMINATE'

          Path('captures/precision-control.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Upload H-SAMPLE precision-control evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-h-sample-precision-control
          retention-days: 30
          path: |
            captures/
            ares-version.txt
            sodium64-build.log
            workload/gate-c-h-sample.smc
