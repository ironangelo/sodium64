name: Gate B SRS Audition

on:
  push:
    branches:
      - phase3/gate-b-srs-audition
    paths:
      - '.github/workflows/gate-b-srs-audition.yml'
      - 'src/main.S'
      - 'src/profile.S'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sodium64-gate-b-srs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-build-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      SRS_REPO: https://github.com/undisbeliever/space-rescue-squad.git
      SRS_SHA: e08333a6cbdf5ac5f9e8deb052fe6a9fd9a54865
      BASS_SHA: 9db6088a378061afc7b82f50997a5b9a1d951175
      UNTECH_EDITOR_SHA: 4c72dc69619c0c246aa7e6325b18b6fb3c219821
      TAD_SHA: 17823e5a55893e8442917abadb4e84feb216e5ad

    steps:
      - name: Checkout Sodium64
        uses: actions/checkout@v4

      - name: Install pinned-source build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            libgl1-mesa-dev \
            libmsgsl-dev \
            libsdl2-dev \
            ninja-build \
            python3

      - name: Checkout exact Space Rescue Squad source and submodules
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/space-rescue-squad"
          git clone --filter=blob:none "$SRS_REPO" "$root"
          git -C "$root" checkout --detach "$SRS_SHA"
          git -C "$root" submodule update --init --recursive

          test "$(git -C "$root" rev-parse HEAD)" = "$SRS_SHA"
          test "$(git -C "$root/bass-untech" rev-parse HEAD)" = "$BASS_SHA"
          test "$(git -C "$root/untech-editor" rev-parse HEAD)" = "$UNTECH_EDITOR_SHA"
          test "$(git -C "$root/terrific-audio-driver" rev-parse HEAD)" = "$TAD_SHA"

          echo "SRS_ROOT=$root" >> "$GITHUB_ENV"

      - name: Build exact upstream CLI toolchain
        shell: bash
        run: |
          set -euo pipefail
          root="$SRS_ROOT"

          # bass-untech is built by the game Makefile when required.

          cmake -S "$root/untech-editor" -B "$root/untech-editor/build" \
            -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$root/untech-editor/build" --parallel "$(nproc)" --target \
            untech-compiler \
            untech-lz4c \
            untech-png2snes \
            untech-png2tileset \
            untech-write-sfc-checksum

          make -j"$(nproc)" -C "$root/terrific-audio-driver/wiz"
          cargo build --quiet --release \
            --manifest-path "$root/terrific-audio-driver/Cargo.toml" \
            --package tad-compiler

          test -x "$root/untech-editor/build/untech-compiler"
          test -x "$root/untech-editor/build/untech-png2tileset"
          test -x "$root/untech-editor/build/untech-write-sfc-checksum"
          test -x "$root/terrific-audio-driver/target/release/tad-compiler"

      - name: Build unmodified release game from pinned source
        shell: bash
        run: |
          set -euo pipefail
          root="$SRS_ROOT"

          # Upstream commits both .aseprite sources and the generated PNG inputs.
          # The release build only needs the committed PNGs; touching them after
          # checkout prevents Make from needlessly requiring the proprietary
          # Aseprite editor to regenerate byte-identical build inputs.
          find "$root/game/resources" -type f -name '*.png' -exec touch {} +

          # Direct ROM targets do not inherit upstream's `all: directories`
          # prerequisite, so create generated-output directories explicitly.
          make -C "$root/game" directories
          make -C "$root/game" bin/space-rescue-squad.sfc

          rom="$root/game/bin/space-rescue-squad.sfc"
          test -s "$rom"
          test "$(stat -c '%s' "$rom")" -gt 0

          # Build products must not mutate tracked upstream source/assets.
          git -C "$root" diff --check
          test -z "$(git -C "$root" diff --name-only)"

          sha256sum "$rom" | tee srs-rom.sha256
          {
            echo "upstream_repo=$SRS_REPO"
            echo "upstream_sha=$SRS_SHA"
            echo "bass_sha=$BASS_SHA"
            echo "untech_editor_sha=$UNTECH_EDITOR_SHA"
            echo "terrific_audio_driver_sha=$TAD_SHA"
            echo "rom_size=$(stat -c '%s' "$rom")"
            echo "rom_sha256=$(sha256sum "$rom" | awk '{print $1}')"
          } | tee srs-provenance.txt

      - name: Upload provenance only
        uses: actions/upload-artifact@v4
        with:
          name: gate-b-srs-source-build-proof
          retention-days: 14
          path: |
            srs-rom.sha256
            srs-provenance.txt


      - name: Create explicit deterministic gameplay benchmark
        shell: bash
        run: |
          set -euo pipefail
          root="$SRS_ROOT"

          python3 - <<'PY'
          from pathlib import Path

          root = Path(__import__('os').environ['SRS_ROOT'])

          main = root / 'game/src/_main.asm'
          text = main.read_text()
          old = """    rep     #$30
          a16()


              if {defined DEBUG_BUILD} {
          """
          new = """    rep     #$30
          a16()

              // SODIUM64 GATE-B BENCHMARK PATCH:
              // Keep normal audio/game-state initialization, then enter the first
              // authored gameplay level without title/menu input latency.
              jsr     GameState.LoadInitialGameState
              LevelNameScreen.ResetLevelNumber()

              lda.w   #Project.RoomList.a1a_entrance
              sta.w   GameState.roomId
              stz.w   GameState.entranceId

              lda.w   #Mode.GAME
              jmp     SwitchMode


              if {defined DEBUG_BUILD} {
          """
          if text.count(old) != 1:
              raise SystemExit(f'_main.asm benchmark anchor count={text.count(old)}')
          main.write_text(text.replace(old, new, 1))

          loop = root / 'game/src/gameloop.inc'
          text = loop.read_text()
          old = """        sep     #$30
              a8()
              i8()
                  lda.w   Controller.Joy1.pressed + 1
          """
          new = """        sep     #$30
              a8()
              i8()
                  // Deterministic benchmark input: hold Right + Run.  Input still
                  // flows through the normal player/entity/collision/game loop.
                  stz.w   Controller.Joy1.current
                  stz.w   Controller.Joy1.pressed
                  stz.w   Controller.Joy1.pressed + 1
                  lda.b   #JOYH.right | JOYH.y
                  sta.w   Controller.Joy1.current + 1

                  lda.w   Controller.Joy1.pressed + 1
          """
          if text.count(old) != 1:
              raise SystemExit(f'gameloop.inc benchmark anchor count={text.count(old)}')
          loop.write_text(text.replace(old, new, 1))
          PY

          git -C "$root" diff --check
          changed="$(git -C "$root" diff --name-only)"
          test "$(printf '%s\n' "$changed" | wc -l)" -eq 2
          printf '%s\n' "$changed" | grep -Fxq 'game/src/_main.asm'
          printf '%s\n' "$changed" | grep -Fxq 'game/src/gameloop.inc'

          git -C "$root" diff -- game/src/_main.asm game/src/gameloop.inc \
            | tee srs-benchmark.patch

          make -C "$root/game" bin/space-rescue-squad.sfc
          rom="$root/game/bin/space-rescue-squad.sfc"
          test -s "$rom"
          echo "7d307bfec23d566cb33d265590269e9e67196104c6c2db2ad274f1efbc8b132e  $rom" | sha256sum --check
          echo "4c472a0986dfe4f7678c3234e57aeae611c77df44e7a38341b0756ee160024e7  srs-benchmark.patch" | sha256sum --check

          {
            echo "upstream_sha=$SRS_SHA"
            echo "benchmark=first authored level, deterministic Right+Run"
            echo "modified_files=game/src/_main.asm,game/src/gameloop.inc"
            echo "benchmark_rom_size=$(stat -c '%s' "$rom")"
            echo "benchmark_rom_sha256=$(sha256sum "$rom" | awk '{print $1}')"
            echo "benchmark_patch_sha256=$(sha256sum srs-benchmark.patch | awk '{print $1}')"
            echo "preserved=audio initialization, game state, room loading, entities, collisions, camera, metatile processing, animations, scripts, WaitFrame"
            echo "disabled=nothing"
          } | tee srs-benchmark-provenance.txt

      - name: Resolve SRS guest progression symbols without changing ROM bytes
        shell: bash
        run: |
          set -euo pipefail
          root="$SRS_ROOT"
          main="$root/game/src/_main.asm"
          before_sha="$(sha256sum "$root/game/bin/space-rescue-squad.sfc" | awk '{print $1}')"

          python3 - <<'PY'
          from pathlib import Path
          import os

          p = Path(os.environ["SRS_ROOT"]) / "game/src/_main.asm"
          text = p.read_text()
          probe = r'''
          // SODIUM64 GATE-B COMPILE-TIME SYMBOL PROBE.
          // These print directives emit no guest instructions/data.
          print "SODIUM64_SRS_ROOM_ID_ADDR="
          print_hex(6, GameState.roomId)
          print "\n"
          print "SODIUM64_SRS_PLAYER_X_ADDR="
          print_hex(6, Entity.Player.xPos.px)
          print "\n"
          print "SODIUM64_SRS_PLAYER_Y_ADDR="
          print_hex(6, Entity.Player.yPos.px)
          print "\n"
          print "SODIUM64_SRS_CAMERA_X_ADDR="
          print_hex(6, Camera.xPos)
          print "\n"
          print "SODIUM64_SRS_CAMERA_Y_ADDR="
          print_hex(6, Camera.yPos)
          print "\n"
          print "SODIUM64_SRS_HEALTH_ADDR="
          print_hex(6, Project.GameState.Words.playerHealth)
          print "\n"
          print "SODIUM64_SRS_ROOM_A1A_ID="
          print_hex(2, Project.RoomList.a1a_entrance)
          print "\n"
          print "SODIUM64_SRS_ROOM_A1B_ID="
          print_hex(2, Project.RoomList.a1b_stairway)
          print "\n"
          print "SODIUM64_SRS_MAP_LEFT="
          print_hex(4, MetaTiles.map.LEFT)
          print "\n"
          print "SODIUM64_SRS_MAP_TOP="
          print_hex(4, MetaTiles.map.TOP)
          print "\n"
          '''
          p.write_text(text + probe)
          PY

          # Rebuild with compile-time prints only and prove the ROM bytes are
          # unchanged from the already-hashed deterministic benchmark.
          touch "$main"
          make -C "$root/game" bin/space-rescue-squad.sfc 2>&1 | tee srs-symbol-probe.log
          after_sha="$(sha256sum "$root/game/bin/space-rescue-squad.sfc" | awk '{print $1}')"
          test "$after_sha" = "$before_sha"
          test "$after_sha" = "7d307bfec23d566cb33d265590269e9e67196104c6c2db2ad274f1efbc8b132e"

          probe() {
            key="$1"
            value="$(sed -n "s/^SODIUM64_SRS_${key}=//p" srs-symbol-probe.log | tail -n1)"
            test -n "$value"
            printf '%s' "$value"
          }

          {
            echo "SRS_GUEST_ROOM_ID=$(probe ROOM_ID_ADDR)"
            echo "SRS_GUEST_PLAYER_X=$(probe PLAYER_X_ADDR)"
            echo "SRS_GUEST_PLAYER_Y=$(probe PLAYER_Y_ADDR)"
            echo "SRS_GUEST_CAMERA_X=$(probe CAMERA_X_ADDR)"
            echo "SRS_GUEST_CAMERA_Y=$(probe CAMERA_Y_ADDR)"
            echo "SRS_GUEST_HEALTH=$(probe HEALTH_ADDR)"
            echo "SRS_ROOM_A1A_ID=$(probe ROOM_A1A_ID)"
            echo "SRS_ROOM_A1B_ID=$(probe ROOM_A1B_ID)"
            echo "SRS_MAP_LEFT=$(probe MAP_LEFT)"
            echo "SRS_MAP_TOP=$(probe MAP_TOP)"
          } | tee -a "$GITHUB_ENV"

      - name: Setup Node.js for Sodium64 profile build
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Build Sodium64 PROFILE runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install -g libdragon
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          libdragon init
          libdragon make PROFILE=1 -j"$(nproc)" 2>&1 | tee profile-build.log
          test -s sodium64.z64
          test -s build/sodium64.elf

      - name: Install ares lab dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            ccache \
            curl \
            libgtk-3-dev \
            libgl1-mesa-dri \
            libvulkan1 \
            mesa-vulkan-drivers \
            qt6-base-dev \
            unzip \
            xauth \
            xvfb

      - name: Restore ares compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ares-n64-ccache-\${{ runner.os }}-\${{ runner.arch }}-17813a3ccda21ab9bd45f09bfc2f91196dbf50ff-rsp-interpreter-v1

      - name: Build pinned N64-only ares in valid lab mode
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ares-src"
          git clone --filter=blob:none https://github.com/ares-emulator/ares.git "$root"
          git -C "$root" checkout 17813a3ccda21ab9bd45f09bfc2f91196dbf50ff
          cd "$root"

          # Existing LAB LIMITATION: the pinned ares RSP recompiler collapses
          # Sodium64's VRAM semaphore path. Keep R4300 JIT; force only RSP interpreter.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ares/n64/system/system.cpp')
          s = p.read_text()
          old = 'rsp.recompiler.enabled = value.boolean();'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'rsp.recompiler.enabled = false;', 1))
          PY

          ccache --zero-stats
          .github/scripts/build_sdl.sh
          cmake --preset ubuntu-ci -DARES_CORES=n64
          cmake --build build --parallel "$(nproc)"
          ccache --show-stats
          ares_bin=$(find "$root/build" -type f -name ares -perm -111 | head -n1)
          test -n "$ares_bin"
          test -x "$ares_bin"
          echo "ARES_BIN=$ares_bin" >> "$GITHUB_ENV"
          "$ares_bin" --version | tee "$GITHUB_WORKSPACE/ares-version.txt"

      - name: Wrap benchmark locally without publishing ROM bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workloads/ares
          cp sodium64.z64 workloads/ares/sodium64.z64
          cp rom-converter.py workloads/ares/rom-converter.py
          cp "$SRS_ROOT/game/bin/space-rescue-squad.sfc" workloads/ares/profile-srs.smc
          (
            cd workloads/ares
            python3 rom-converter.py </dev/null
          )
          test -s workloads/ares/out/profile-srs.z64

      - name: Locate Sodium64 profiling and frame-budget state
        shell: bash
        run: |
          set -euo pipefail
          elf="build/sodium64.elf"
          symbol() {
            nm -n "$elf" | awk -v name="$1" '$3 == name { print $1; exit }'
          }

          magic=$(symbol profile_magic)
          end=$(symbol profile_sample_buffer_end)
          buffer=$(symbol profile_sample_buffer)
          write_ptr=$(symbol profile_write_ptr)
          sample_count=$(symbol profile_sample_count)
          last_epc=$(symbol profile_last_epc)
          apu_clock=$(symbol apu_clock)
          jit_lookup=$(symbol jit_lookup)
          jit_pointer=$(symbol jit_pointer)
          fps_native=$(symbol fps_native)
          fps_emulate=$(symbol fps_emulate)
          fps_display=$(symbol fps_display)
          frame_count=$(symbol frame_count)
          skipped_set=$(symbol skipped_set)
          precision_set=$(symbol precision_set)
          audio_set=$(symbol audio_set)
          wram=$(symbol wram)
          vi_history_count=$(symbol profile_vi_history_count)
          vi_history=$(symbol profile_vi_history)

          for value in \
            "$magic" "$end" "$buffer" "$write_ptr" "$sample_count" \
            "$last_epc" "$apu_clock" "$jit_lookup" "$jit_pointer" \
            "$fps_native" "$fps_emulate" "$fps_display" "$frame_count" \
            "$skipped_set" "$precision_set" "$audio_set" "$wram" \
            "$vi_history_count" "$vi_history"; do
            test -n "$value"
          done

          size=$((0x$end - 0x$magic))
          jit_lookup_size=$((0x$jit_pointer - 0x$jit_lookup))
          test "$size" -gt 16384
          test "$jit_lookup_size" -eq 262144

          guest_wram_to_host() {
            guest_hex="$1"
            guest=$((0x$guest_hex))
            bank=$(((guest >> 16) & 0xff))
            offset=$((guest & 0xffff))
            case "$bank" in
              126) ;;
              127) offset=$((offset + 0x10000)) ;;
              *) echo "guest address 0x$guest_hex is not WRAM 7E/7F" >&2; return 1 ;;
            esac
            printf '%08x' "$((0x$wram + offset))"
          }

          srs_room_id_host=$(guest_wram_to_host "$SRS_GUEST_ROOM_ID")
          srs_player_x_host=$(guest_wram_to_host "$SRS_GUEST_PLAYER_X")
          srs_player_y_host=$(guest_wram_to_host "$SRS_GUEST_PLAYER_Y")
          srs_camera_x_host=$(guest_wram_to_host "$SRS_GUEST_CAMERA_X")
          srs_camera_y_host=$(guest_wram_to_host "$SRS_GUEST_CAMERA_Y")
          srs_health_host=$(guest_wram_to_host "$SRS_GUEST_HEALTH")

          buffer_hex=$(printf '%08x' "$((0x$buffer))")
          rom_buffer=$(awk '$1 == "#define" && $2 == "ROM_BUFFER" { print $3; exit }' src/defines.h)
          test -n "$rom_buffer"
          jit_buffer=$((rom_buffer - 0x40000))
          jit_buffer_hex=$(printf '%08x' "$jit_buffer")

          {
            echo "ARES_PROFILE_ADDR=$magic"
            echo "ARES_PROFILE_SIZE=$size"
            echo "ARES_PROFILE_BUFFER_HEX=$buffer_hex"
            echo "ARES_PROFILE_WRITE_PTR_ADDR=$write_ptr"
            echo "ARES_PROFILE_SAMPLE_COUNT_ADDR=$sample_count"
            echo "ARES_PROFILE_LAST_EPC_ADDR=$last_epc"
            echo "ARES_APU_CLOCK_ADDR=$apu_clock"
            echo "ARES_JIT_LOOKUP_ADDR=$jit_lookup"
            echo "ARES_JIT_LOOKUP_SIZE=$jit_lookup_size"
            echo "ARES_JIT_POINTER_ADDR=$jit_pointer"
            echo "ARES_JIT_BUFFER_HEX=$jit_buffer_hex"
            echo "ARES_FPS_NATIVE_ADDR=$fps_native"
            echo "ARES_FPS_EMULATE_ADDR=$fps_emulate"
            echo "ARES_FPS_DISPLAY_ADDR=$fps_display"
            echo "ARES_FRAME_COUNT_ADDR=$frame_count"
            echo "ARES_SKIPPED_SET_ADDR=$skipped_set"
            echo "ARES_PRECISION_SET_ADDR=$precision_set"
            echo "ARES_AUDIO_SET_ADDR=$audio_set"
            echo "ARES_SRS_ROOM_ID_ADDR=$srs_room_id_host"
            echo "ARES_SRS_PLAYER_X_ADDR=$srs_player_x_host"
            echo "ARES_SRS_PLAYER_Y_ADDR=$srs_player_y_host"
            echo "ARES_SRS_CAMERA_X_ADDR=$srs_camera_x_host"
            echo "ARES_SRS_CAMERA_Y_ADDR=$srs_camera_y_host"
            echo "ARES_SRS_HEALTH_ADDR=$srs_health_host"
            echo "ARES_VI_HISTORY_COUNT_ADDR=$vi_history_count"
            echo "ARES_VI_HISTORY_ADDR=$vi_history"
            for offset in 0 8 16 24 32 40 48 56; do
              addr=$((0x$vi_history + offset))
              printf 'ARES_VI_HISTORY_%d_ADDR=%08x\n' "$((offset / 8))" "$addr"
            done
          } >> "$GITHUB_ENV"

      - name: Repeat internally aligned SRS 60-VI histories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p profiles
          rom="workloads/ares/out/profile-srs.z64"

          profile_history() {
            repeat="$1"
            label="recompiler-srs-history-r$repeat"
            home="$RUNNER_TEMP/ares-home-$label"
            settings="$RUNNER_TEMP/ares-settings-$label.bml"
            emulator_log="profiles/$label-emulator.log"
            gdb_log="profiles/$label-gdb.log"
            snapshot="profiles/$label.bin"
            report="profiles/$label.txt"
            json="profiles/$label.json"
            state="profiles/$label-state.json"

            rm -rf "$home"
            mkdir -p "$home"

            HOME="$home" SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 \
              xvfb-run -a stdbuf -oL -eL "$ARES_BIN" \
                --no-file-prompt \
                --system "Nintendo 64" \
                --settings-file "$settings" \
                --setting "Developer/DebugServerEnabled=true" \
                --setting "Developer/DebugServerUseIPv4=true" \
                --setting "Developer/DebugServerPort=9140" \
                --setting "Developer/HomebrewMode=true" \
                --setting "Developer/DeterministicEntropy=true" \
                --setting "Developer/ForceInterpreter=false" \
                --setting "Boot/AwaitGDBClient=true" \
                "$rom" \
                > "$emulator_log" 2>&1 &
            ares_pid=$!

            cleanup_run() {
              kill "$ares_pid" 2>/dev/null || true
              wait "$ares_pid" 2>/dev/null || true
            }
            trap cleanup_run EXIT

            if ! python3 scripts/gdb_rsp_dump.py \
              --port 9140 \
              --connect-timeout 45 \
              --response-timeout 60 \
              --warmup-seconds 1 \
              --zero "0x$ARES_JIT_LOOKUP_ADDR:$ARES_JIT_LOOKUP_SIZE" \
              --write "0x$ARES_APU_CLOCK_ADDR:15" \
              --write "0x$ARES_JIT_POINTER_ADDR:$ARES_JIT_BUFFER_HEX" \
              --write "0x$ARES_SKIPPED_SET_ADDR:00" \
              --write "0x$ARES_AUDIO_SET_ADDR:04" \
              --settle-seconds 1 \
              --after-settle-write "0x$ARES_PROFILE_SAMPLE_COUNT_ADDR:00000000" \
              --after-settle-write "0x$ARES_PROFILE_WRITE_PTR_ADDR:$ARES_PROFILE_BUFFER_HEX" \
              --after-settle-write "0x$ARES_PROFILE_LAST_EPC_ADDR:00000000" \
              --after-settle-write "0x$ARES_FPS_NATIVE_ADDR:00" \
              --after-settle-write "0x$ARES_FPS_EMULATE_ADDR:00" \
              --after-settle-write "0x$ARES_FPS_DISPLAY_ADDR:ff" \
              --after-settle-write "0x$ARES_VI_HISTORY_COUNT_ADDR:00" \
              --run-seconds 20 \
              --observe "fps_display:0x$ARES_FPS_DISPLAY_ADDR:1" \
              --observe "fps_native:0x$ARES_FPS_NATIVE_ADDR:1" \
              --observe "fps_emulate:0x$ARES_FPS_EMULATE_ADDR:1" \
              --observe "frame_count:0x$ARES_FRAME_COUNT_ADDR:1" \
              --observe "skipped_set:0x$ARES_SKIPPED_SET_ADDR:1" \
              --observe "apu_clock:0x$ARES_APU_CLOCK_ADDR:1" \
              --observe "audio_set:0x$ARES_AUDIO_SET_ADDR:1" \
              --observe "precision_set:0x$ARES_PRECISION_SET_ADDR:1" \
              --observe "srs_room_id:0x$ARES_SRS_ROOM_ID_ADDR:1" \
              --observe "srs_player_x:0x$ARES_SRS_PLAYER_X_ADDR:2" \
              --observe "srs_player_y:0x$ARES_SRS_PLAYER_Y_ADDR:2" \
              --observe "srs_camera_x:0x$ARES_SRS_CAMERA_X_ADDR:2" \
              --observe "srs_camera_y:0x$ARES_SRS_CAMERA_Y_ADDR:2" \
              --observe "srs_health:0x$ARES_SRS_HEALTH_ADDR:2" \
              --observe "vi_history_count:0x$ARES_VI_HISTORY_COUNT_ADDR:1" \
              --observe "vi_history_0:0x$ARES_VI_HISTORY_0_ADDR:8" \
              --observe "vi_history_1:0x$ARES_VI_HISTORY_1_ADDR:8" \
              --observe "vi_history_2:0x$ARES_VI_HISTORY_2_ADDR:8" \
              --observe "vi_history_3:0x$ARES_VI_HISTORY_3_ADDR:8" \
              --observe "vi_history_4:0x$ARES_VI_HISTORY_4_ADDR:8" \
              --observe "vi_history_5:0x$ARES_VI_HISTORY_5_ADDR:8" \
              --observe "vi_history_6:0x$ARES_VI_HISTORY_6_ADDR:8" \
              --observe "vi_history_7:0x$ARES_VI_HISTORY_7_ADDR:8" \
              --state-output "$state" \
              --address "0x$ARES_PROFILE_ADDR" \
              --size "$ARES_PROFILE_SIZE" \
              --output "$snapshot" \
              > "$gdb_log" 2>&1; then
              cat "$gdb_log"
              tail -200 "$emulator_log" || true
              exit 1
            fi

            cat "$gdb_log"
            cleanup_run
            trap - EXIT
            sleep 1

            python3 scripts/profile_report.py \
              "$snapshot" build/sodium64.elf \
              --nm nm --map build/sodium64.map \
              --json-output "$json" | tee "$report"

            samples=$(awk '/total samples:/ { print $3 }' "$report")
            test -n "$samples"
            test "$samples" -ge 800

            REPEAT="$repeat" STATE_FILE="$state" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          repeat = os.environ["REPEAT"]
          state = json.loads(Path(os.environ["STATE_FILE"]).read_text())
          obs = state["observations"]

          assert int(obs["skipped_set"]) == 0, obs
          assert int(obs["apu_clock"]) == 21, obs
          assert int(obs["audio_set"]) == 4, obs
          assert int(obs["precision_set"]) == 8, obs

          count = int(obs["vi_history_count"])
          assert 8 <= count <= 64, f"repeat {repeat}: expected >=8 windows, got {count}"

          raw = b"".join(
              int(obs[f"vi_history_{i}"]).to_bytes(8, "big")
              for i in range(8)
          )
          windows = list(raw[:count])

          def le16(key):
              raw_value = int(obs[key]).to_bytes(2, "big")
              return int.from_bytes(raw_value, "little")

          guest_state = {
              "room_id": int(obs["srs_room_id"]),
              "player_x": le16("srs_player_x"),
              "player_y": le16("srs_player_y"),
              "camera_x": le16("srs_camera_x"),
              "camera_y": le16("srs_camera_y"),
              "health": le16("srs_health"),
          }

          payload = {
              "repeat": int(repeat),
              "history_count": count,
              "complete_60vi_windows": windows,
              "min": min(windows),
              "max": max(windows),
              "mean": sum(windows) / len(windows),
              "guest_state_end": guest_state,
          }
          Path(f"profiles/srs-vi-history-r{repeat}.json").write_text(
              json.dumps(payload, indent=2) + "\n"
          )
          print(json.dumps(payload, indent=2))
          PY
          }

          for repeat in 1 2 3; do
            echo "=== internally aligned SRS history $repeat/3 ==="
            profile_history "$repeat"
          done

      - name: Compare internally aligned SRS histories
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          from pathlib import Path

          runs = [
              json.loads(Path(f"profiles/srs-vi-history-r{i}.json").read_text())
              for i in range(1, 4)
          ]
          seqs = [r["complete_60vi_windows"] for r in runs]
          common = min(map(len, seqs))
          prefixes = [s[:common] for s in seqs]
          exact_common_prefix = all(p == prefixes[0] for p in prefixes[1:])

          # The first diagnostic window may contain a one-frame queue transient.
          # Compare sustained common windows separately, without assuming 60.
          steady = [p[1:] for p in prefixes]
          steady_equal = all(p == steady[0] for p in steady[1:])

          a1a = int(os.environ["SRS_ROOM_A1A_ID"], 16)
          a1b = int(os.environ["SRS_ROOM_A1B_ID"], 16)
          map_left = int(os.environ["SRS_MAP_LEFT"], 16)
          initial_x = map_left + 56

          states = [r["guest_state_end"] for r in runs]
          progressed = [
              (st["room_id"] != a1a) or (st["player_x"] >= initial_x + 64)
              for st in states
          ]
          alive = [st["health"] > 0 for st in states]
          entered_a1b = [st["room_id"] == a1b for st in states]

          payload = {
              "counts": [len(s) for s in seqs],
              "sequences": seqs,
              "common_window_count": common,
              "common_prefix_equal": exact_common_prefix,
              "steady_common_prefix_equal": steady_equal,
              "steady_common_sequence": steady[0],
              "guest_state_end": states,
              "progressed_from_a1a": progressed,
              "alive_at_end": alive,
              "entered_a1b_at_end": entered_a1b,
              "initial_a1a_player_x": initial_x,
          }
          Path("profiles/srs-history-repeatability.json").write_text(
              json.dumps(payload, indent=2) + "\n"
          )

          lines = ["# SRS internally aligned repeatability", ""]
          for i, seq in enumerate(seqs, 1):
              st = states[i - 1]
              lines.append(f"- r{i} ({len(seq)} windows): " + ", ".join(f"{v}/60" for v in seq))
              lines.append(
                  f"  - end state: room={st['room_id']}, player=({st['player_x']},{st['player_y']}), "
                  f"camera=({st['camera_x']},{st['camera_y']}), health={st['health']}, "
                  f"progressed={progressed[i - 1]}"
              )
          lines += [
              "",
              f"- common windows compared: {common}",
              f"- exact common prefix equal: {exact_common_prefix}",
              f"- sustained common prefix (after first window) equal: {steady_equal}",
              "- sustained common sequence: " + ", ".join(f"{v}/60" for v in steady[0]),
              "",
          ]
          Path("profiles/srs-history-repeatability.md").write_text("\n".join(lines))
          print(json.dumps(payload, indent=2))

          assert all(progressed), f"guest progression not demonstrated in all repeats: {states}"
          assert all(alive), f"player not alive at end of all repeats: {states}"
          PY

          python3 scripts/profile_matrix.py \
            profiles/recompiler-srs-history-r1.json \
            profiles/recompiler-srs-history-r2.json \
            profiles/recompiler-srs-history-r3.json \
            --output profiles/srs-history-profile-repeatability.md

          {
            echo '### Gate-B SRS internally aligned repeatability'
            echo
            cat profiles/srs-history-repeatability.md
            echo
            cat profiles/srs-history-profile-repeatability.md
            echo
            echo '> Emulator-lab repeatability evidence only; not real-N64 performance authority.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload non-ROM audition diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-b-srs-ares-audition
          retention-days: 14
          if-no-files-found: ignore
          path: |
            ares-version.txt
            profile-build.log
            srs-rom.sha256
            srs-provenance.txt
            srs-benchmark.patch
            srs-benchmark-provenance.txt
            srs-symbol-probe.log
            profiles/
