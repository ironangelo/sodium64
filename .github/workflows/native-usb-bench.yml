name: Native USB Bench Contracts
on:
  pull_request:
    branches: [master]
  push:
    branches: [master, integrate/native-usb-bench]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sodium64-usb-bench-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bench-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Execute production parser and transport fixtures
        run: |
          python3 scripts/test_remote_control.py --json-output usb-parser-proof.json
          python3 scripts/test_remote_rdp_barrier.py --json-output usb-rdp-proof.json
          python3 tools/sc64-bench/test_bench.py
      - name: Build ordinary and isolated bench images
        shell: bash
        run: |
          set -euo pipefail
          source scripts/setup_n64_ci.sh
          make -j$(nproc)
          make REMOTE=1 -j$(nproc)
      - name: Execute linked register, boot and memory contracts
        run: |
          python3 scripts/test_remote_bridge.py build_usb_bench/sodium64-usb-bench.elf --json-output usb-bridge-proof.json
          python3 scripts/test_remote_mailbox.py build_usb_bench/sodium64-usb-bench.elf --json-output usb-mailbox-proof.json
          python3 scripts/test_remote_rdp_barrier.py --rsp-elf build_usb_bench/src/rsp_main.elf build_usb_bench/src/rsp_mode7.elf --json-output usb-rdp-proof.json
          python3 scripts/check_rsp_branch_delay_slots.py build_usb_bench/src/rsp_main.elf build_usb_bench/src/rsp_mode7.elf
          python3 scripts/test_rsp_decode_cursor.py build_usb_bench/src/rsp_main.elf build_usb_bench/src/rsp_mode7.elf --json-output usb-decoder-cursor-proof.json
          python3 scripts/test_dsp_gain_owner.py build_usb_bench/sodium64-usb-bench.elf
          python3 scripts/test_apu_lookup_reset.py build_usb_bench/sodium64-usb-bench.elf
          python3 scripts/test_dsp_brr_accuracy.py build_usb_bench/sodium64-usb-bench.elf
      - name: Preserve code and diagnostic receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sodium64-native-usb-bench
          retention-days: 14
          path: |
            usb-parser-proof.json
            usb-rdp-proof.json
            usb-bridge-proof.json
            usb-mailbox-proof.json
            usb-decoder-cursor-proof.json
            sodium64-usb-bench.z64
            build_usb_bench/sodium64-usb-bench.elf
            build_usb_bench/sodium64-usb-bench.map
