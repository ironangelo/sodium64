name: Gate C Stage 2 Color Diagnostic
on:
  push:
    branches: [phase4/gate-c-stage2-color-diag]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: sodium64-stage2-color-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: latest
      - run: npm install -g libdragon
      - uses: actions/checkout@v4
      - name: Host decoder negatives
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p test_stage2_color.py -v
          python3 -m unittest discover -s scripts -p test_stage2_probe.py -v
      - name: Build and qualify immutable renderer and non-diagnostic scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/artifacts/11134890202/zip > parent.zip
          echo "9f234916faa79842b91441cbf6b0ba773aa593e4bb73c4432fc062cc9356ffea  parent.zip" | sha256sum -c -
          unzip -q parent.zip -d parent
          libdragon init
          for variant in normal hw-profile color; do
            libdragon make clean
            flags=()
            if [ "$variant" = hw-profile ]; then flags=(HW_PROFILE=1); fi
            if [ "$variant" = color ]; then flags=(COLOR_DIAG=1); fi
            libdragon make "${flags[@]}" -j"$(nproc)" 2>&1 | tee "$variant-build.log"
            python3 scripts/check_runtime_arena.py build/sodium64.elf
            python3 scripts/check_rsp_branch_delay_slots.py build/src/rsp_main.elf build/src/rsp_mode7.elf build/src/rsp_hcomp.elf
            mkdir -p "qualified/$variant"
            cp -a build "qualified/$variant/"
            cp sodium64.z64 "qualified/$variant/"
          done
          python3 scripts/check_stage2_color_scope.py --qualified qualified --parent parent/qualified
          mkdir -p diagnostic hardware
          for mode in visual mixed; do
            python3 scripts/make_gate_c_stage1.py --mode "$mode" "diagnostic/$mode.smc"
            cmp "diagnostic/$mode.smc" "parent/diagnostic/$mode.smc"
            mkdir -p "wrap-$mode"
            cp qualified/color/sodium64.z64 rom-converter.py "wrap-$mode/"
            cp "diagnostic/$mode.smc" "wrap-$mode/guest.smc"
            (cd "wrap-$mode"; python3 rom-converter.py </dev/null)
            cp "wrap-$mode/out/guest.z64" "hardware/sodium64-stage2-color-$mode.z64"
            dd if="hardware/sodium64-stage2-color-$mode.z64" of=diagnostic/embedded.smc bs=1 skip=$((0x104000)) count=32768 status=none
            cmp "diagnostic/$mode.smc" diagnostic/embedded.smc
          done
          sha256sum hardware/*.z64 qualified/*/sodium64.z64 qualified/*/build/sodium64.elf diagnostic/*.smc > SHA256SUMS
      - name: Install pinned ares dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache cmake git libgtk-3-dev libgl1-mesa-dri libsdl2-dev \
            libvulkan1 mesa-vulkan-drivers ninja-build qt6-base-dev unzip xauth xvfb

      - uses: actions/cache/restore@v4
        id: ares-cache
        with:
          path: ${{ runner.temp }}/ares-src
          key: sodium64-ares-17813a3-n64-rsp-interpreter-v1
      - name: Build pinned N64-only ares in established valid lab mode
        id: ares-build
        if: steps.ares-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ares-src"
          git clone --filter=blob:none https://github.com/ares-emulator/ares.git "$root"
          git -C "$root" checkout 17813a3ccda21ab9bd45f09bfc2f91196dbf50ff
          cd "$root"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ares/n64/system/system.cpp')
          s = p.read_text()
          old = 'rsp.recompiler.enabled = value.boolean();'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'rsp.recompiler.enabled = false;', 1))
          PY
          .github/scripts/build_sdl.sh
          cmake --preset ubuntu-ci -DARES_CORES=n64
          cmake --build build --parallel "$(nproc)"
          ares_bin=$(find "$root/build" -type f -name ares -perm -111 | head -n1)
          test -x "$ares_bin"
          echo "ARES_BIN=$ares_bin" >> "$GITHUB_ENV"
          "$ares_bin" --version | tee "$GITHUB_WORKSPACE/ares-version.txt"

      - uses: actions/cache/save@v4
        if: steps.ares-build.outcome == 'success'
        with:
          path: ${{ runner.temp }}/ares-src
          key: sodium64-ares-17813a3-n64-rsp-interpreter-v1
      - name: Restore cached SDL3 runtime into this runner
        if: steps.ares-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # The ares cache owns SDL build outputs, not /usr/local installs.
          # Reinstall exactly those cached outputs; do not fetch a newer SDL.
          sudo cmake --install "$RUNNER_TEMP/ares-src/SDL/build" --prefix=/usr/local
          sudo ldconfig
      - name: Locate pinned ares after build or cache restore
        shell: bash
        run: |
          ares_bin=$(find "$RUNNER_TEMP/ares-src/build" -type f -name ares -perm -111 | head -n1)
          test -x "$ares_bin"
          echo "ARES_BIN=$ares_bin" >> "$GITHUB_ENV"
          "$ares_bin" --version | tee ares-version.txt
      - name: Uninterrupted PI trace and separate frozen-frame semantics
        run: |
          set -euo pipefail
          port=9290
          pid=""
          trap 'if [ -n "$pid" ]; then kill -KILL -- "-$pid" 2>/dev/null || true; fi' EXIT
          for mode in visual mixed; do
            for kind in continuous frozen-a frozen-b; do
              out="captures/$mode/$kind"
              mkdir -p "$out" "$RUNNER_TEMP/color-$mode-$kind"
              setsid env HOME="$RUNNER_TEMP/color-$mode-$kind" SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 \
                xvfb-run -a stdbuf -oL -eL "$ARES_BIN" --no-file-prompt --system "Nintendo 64" \
                --settings-file "$RUNNER_TEMP/color-$mode-$kind.bml" \
                --setting "Developer/DebugServerEnabled=true" --setting "Developer/DebugServerUseIPv4=true" \
                --setting "Developer/DebugServerPort=$port" --setting "Developer/HomebrewMode=true" \
                --setting "Developer/DeterministicEntropy=true" --setting "Developer/ForceInterpreter=false" \
                --setting "Boot/AwaitGDBClient=true" "hardware/sodium64-stage2-color-$mode.z64" > "$out/ares.log" 2>&1 &
              pid=$!
              flags=()
              if [ "$mode" = mixed ]; then flags+=(--mixed); fi
              if [ "$kind" = frozen-a ]; then flags+=(--frozen-phase a); fi
              if [ "$kind" = frozen-b ]; then flags+=(--frozen-phase b); fi
              python3 scripts/capture_stage2_color.py --port "$port" --elf qualified/color/build/sodium64.elf --output "$out" "${flags[@]}" > "$out/capture.log"
              kill -KILL -- "-$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
              pid=""
              port=$((port+1))
            done
          done
          python3 scripts/check_stage2_color_frozen.py --captures captures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-c-stage2-color-diagnostic
          retention-days: 30
          path: |
            hardware/
            diagnostic/*.smc
            qualified/**/*.elf
            qualified/**/*.map
            qualified/**/sodium64.z64
            SHA256SUMS
            captures/
            *-build.log
            ares-version.txt
