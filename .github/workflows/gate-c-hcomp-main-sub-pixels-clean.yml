name: Gate C H-COMP Main Sub Pixels Clean

on:
  push:
    branches:
      - phase4/gate-c-hcomp-main-sub-pixels-clean
    paths:
      - scripts/check_gate_c_hcomp_main_sub_pixels_ares.py
      - scripts/capture_gate_c_hcomp_main_sub_pixels_ares.py
      - scripts/make_gate_c_hcomp_main_sub_lifetime.py
      - scripts/check_gate_c_hcomp_main_sub_lifetime.py
      - scripts/test_gate_c_hcomp_main_sub_exec_clean.py
      - .github/workflows/gate-c-hcomp-main-sub-pixels-clean.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sodium64-gate-c-hcomp-main-sub-pixels-clean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ares-main-sub-pixels:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Install libdragon
        run: npm install -g libdragon

      - name: Checkout Sodium64
        uses: actions/checkout@v4

      - name: Self-test strict ares oracle and deterministic guest
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/check_gate_c_hcomp_main_sub_pixels_ares.py \
            scripts/capture_gate_c_hcomp_main_sub_pixels_ares.py \
            scripts/check_gate_c_hcomp_main_sub_lifetime.py \
            scripts/make_gate_c_hcomp_main_sub_lifetime.py \
            scripts/test_gate_c_hcomp_main_sub_exec_clean.py
          python3 scripts/check_gate_c_hcomp_main_sub_pixels_ares.py --self-test
          mkdir -p diagnostic
          python3 scripts/make_gate_c_hcomp_main_sub_lifetime.py diagnostic/guest-a.smc
          python3 scripts/make_gate_c_hcomp_main_sub_lifetime.py diagnostic/guest-b.smc
          cmp diagnostic/guest-a.smc diagnostic/guest-b.smc
          test "$(stat -c %s diagnostic/guest-a.smc)" -eq 32768
          sha256sum diagnostic/guest-a.smc | tee diagnostic/guest.sha256
          grep -q '^bfbbf280a830cf8659c9b670fa753af94e36a1ddd00f1aada162fb85438d0b05  diagnostic/guest-a.smc$' diagnostic/guest.sha256

      - name: Build exact executable Main Sub runtime
        shell: bash
        run: |
          set -euo pipefail
          libdragon init
          libdragon make -j"$(nproc)" 2>&1 | tee sodium64-build.log
          readelf -sW build/src/rsp_main.elf > rsp-main.syms
          readelf -sW build/src/rsp_mode7.elf > rsp-mode7.syms
          readelf -sW build/src/rsp_hcomp.elf > rsp-hcomp.syms
          python3 scripts/test_gate_c_hcomp_main_sub_exec_clean.py \
            --maps build/rsp_main.map build/rsp_mode7.map build/rsp_hcomp.map \
            --symbols rsp-main.syms rsp-mode7.syms rsp-hcomp.syms \
            | tee executable-contract.txt
          grep -q '^HCOMP_MAIN_SUB_EXEC_CLEAN_CONTRACT_VALIDATED$' executable-contract.txt
          python3 scripts/check_rsp_branch_delay_slots.py \
            build/src/rsp_main.elf build/src/rsp_mode7.elf build/src/rsp_hcomp.elf \
            | tee delay-slots.txt
          sha256sum sodium64.z64 build/sodium64.elf | tee runtime.sha256
          grep -q '^eb216fcc259dd174d9ae3fb7b1908aaed775753a5b2c43689c9ead238670cff9  sodium64.z64$' runtime.sha256

      - name: Wrap exact lifetime guest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wrap workload
          cp diagnostic/guest-a.smc workload/guest.smc
          cp sodium64.z64 wrap/sodium64.z64
          cp rom-converter.py wrap/rom-converter.py
          cp workload/guest.smc wrap/guest.smc
          (
            cd wrap
            python3 rom-converter.py </dev/null
          )
          test -s wrap/out/guest.z64
          dd if=wrap/out/guest.z64 of=workload/embedded.smc \
            bs=1 skip=$((0x104000)) count=$((32 * 1024)) status=none
          cmp workload/guest.smc workload/embedded.smc
          sha256sum workload/guest.smc wrap/out/guest.z64 | tee workload/hashes.sha256
          rm workload/embedded.smc

      - name: Locate fenced runtime state
        shell: bash
        run: |
          set -euo pipefail
          elf=build/sodium64.elf
          symbol() { nm -n "$elf" | awk -v name="$1" '$3 == name { print $1; exit }'; }
          wram=$(symbol wram)
          frame_wait=$(symbol frame_wait)
          test -n "$wram"
          test -n "$frame_wait"
          test "$frame_wait" = "8000ae1c"

          # Freeze the exact assembled loop geometry rather than reasoning from
          # pseudo-instruction source width. For the pinned runtime:
          #   +00/+04 = expanded lbu absolute load
          #   +08      = li at,2
          #   +0C      = beq
          #   +10      = li t0,1 (branch delay slot)
          #   +14      = lui t1,A404 (unique post-loop, pre-unhalt PC)
          #   +18/+1C = jr + SP_STATUS clear-halt delay-slot store
          readelf -x .text "$elf" > cpu-text.hex
          grep -qi '^  0x8000ae20 910886a9 24010002 1101fffc 24080001' cpu-text.hex
          grep -qi '^  0x8000ae30 3c09a404 01800008 ad280010 3c08800b' cpu-text.hex

          prelaunch=$(printf '%08x' "$((16#$frame_wait + 0x14))")
          test "$prelaunch" = "8000ae30"
          {
            echo "GUEST_COUNTER_ADDR=0x$wram"
            echo "PRELAUNCH_ADDR=0x$prelaunch"
          } | tee -a "$GITHUB_ENV"
          printf 'wram=0x%s frame_wait=0x%s prelaunch=0x%s\n' \
            "$wram" "$frame_wait" "$prelaunch"

      - name: Install pinned ares dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache cmake git libgtk-3-dev libgl1-mesa-dri libsdl2-dev \
            libvulkan1 mesa-vulkan-drivers ninja-build qt6-base-dev unzip xauth xvfb

      - name: Build pinned N64-only ares in established valid lab mode
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ares-src"
          git clone --filter=blob:none https://github.com/ares-emulator/ares.git "$root"
          git -C "$root" checkout 17813a3ccda21ab9bd45f09bfc2f91196dbf50ff
          cd "$root"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ares/n64/system/system.cpp')
          s = p.read_text()
          old = 'rsp.recompiler.enabled = value.boolean();'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'rsp.recompiler.enabled = false;', 1))
          PY
          .github/scripts/build_sdl.sh
          cmake --preset ubuntu-ci -DARES_CORES=n64
          cmake --build build --parallel "$(nproc)"
          ares_bin=$(find "$root/build" -type f -name ares -perm -111 | head -n1)
          test -x "$ares_bin"
          echo "ARES_BIN=$ares_bin" >> "$GITHUB_ENV"
          "$ares_bin" --version | tee "$GITHUB_WORKSPACE/ares-version.txt"

      - name: Run fenced seeded one-frame pixel ownership proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p captures
          home="$RUNNER_TEMP/ares-home-main-sub"
          settings="$RUNNER_TEMP/ares-main-sub-settings.bml"
          mkdir -p "$home"

          HOME="$home" SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 \
            xvfb-run -a stdbuf -oL -eL "$ARES_BIN" \
              --no-file-prompt \
              --system "Nintendo 64" \
              --settings-file "$settings" \
              --setting "Developer/DebugServerEnabled=true" \
              --setting "Developer/DebugServerUseIPv4=true" \
              --setting "Developer/DebugServerPort=9149" \
              --setting "Developer/HomebrewMode=true" \
              --setting "Developer/DeterministicEntropy=true" \
              --setting "Developer/ForceInterpreter=false" \
              --setting "Boot/AwaitGDBClient=true" \
              wrap/out/guest.z64 \
              > captures/ares-n64.log 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          python3 scripts/capture_gate_c_hcomp_main_sub_pixels_ares.py \
            --port 9149 \
            --guest-counter-address "$GUEST_COUNTER_ADDR" \
            --prelaunch-address "$PRELAUNCH_ADDR" \
            --output-dir captures | tee captures/capture.log

          python3 scripts/check_gate_c_hcomp_main_sub_pixels_ares.py captures \
            --output captures/result.json | tee captures/classifier.log
          grep -q '"classification": "HCOMP_MAIN_SUB_ARES_PIXELS_VALIDATED"' captures/result.json
          grep -q '"passed": true' captures/result.json
          grep -q '"same_fresh_frame_dual_target": true' captures/result.json

      - name: Upload ares pixel ownership evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-hcomp-main-sub-pixels-ares-clean
          retention-days: 30
          path: |
            captures/
            diagnostic/guest.sha256
            workload/hashes.sha256
            workload/guest.smc
            ares-version.txt
            sodium64-build.log
            executable-contract.txt
            delay-slots.txt
            runtime.sha256
            build/rsp_main.map
            build/rsp_mode7.map
            build/rsp_hcomp.map
