name: Gate C Stage 2 Native Pixel PCM Probe
on:
  push:
    branches: [phase4/gate-c-stage2-native-probe]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: sodium64-native-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: latest
      - run: npm install -g libdragon
      - uses: actions/checkout@v4
      - name: Build and verify unchanged normal renderer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p test_stage2_probe.py -v
          libdragon init
          libdragon make -j"$(nproc)" 2>&1 | tee normal-build.log
          python3 scripts/check_runtime_arena.py build/sodium64.elf
          python3 scripts/check_rsp_branch_delay_slots.py build/src/rsp_main.elf build/src/rsp_mode7.elf build/src/rsp_hcomp.elf
          gh api repos/${{ github.repository }}/actions/artifacts/11074577102/zip > parent-artifact.zip
          unzip -q parent-artifact.zip -d parent-artifact
          python3 - <<'PY'
          from pathlib import Path
          from scripts.check_rsp_branch_delay_slots import read_text
          for name in ['sodium64', 'src/rsp_main', 'src/rsp_mode7', 'src/rsp_hcomp']:
              assert read_text(Path('build')/(name+'.elf')) == read_text(Path('parent-artifact/qualified/normal/build')/(name+'.elf')), name
          print('UNCHANGED_NORMAL_RUNTIME_TEXT PASS')
          PY
          mkdir -p qualified/normal
          cp -a build qualified/normal/
          cp sodium64.z64 qualified/normal/
      - name: Build bounded native probe and wrap original guests
        run: |
          set -euo pipefail
          libdragon make clean
          libdragon make HW_PROFILE=1 -j"$(nproc)" 2>&1 | tee probe-build.log
          python3 scripts/check_runtime_arena.py build/sodium64.elf
          python3 scripts/check_rsp_branch_delay_slots.py build/src/rsp_main.elf build/src/rsp_mode7.elf build/src/rsp_hcomp.elf
          mkdir -p qualified/hw-profile diagnostic hardware
          cp -a build qualified/hw-profile/
          cp sodium64.z64 qualified/hw-profile/
          for mode in visual mixed; do
            cp "parent-artifact/diagnostic/$mode.smc" "diagnostic/$mode.smc"
            mkdir -p "wrap-$mode"
            cp sodium64.z64 rom-converter.py "wrap-$mode/"
            cp "diagnostic/$mode.smc" "wrap-$mode/guest.smc"
            (cd "wrap-$mode"; python3 rom-converter.py </dev/null)
            cp "wrap-$mode/out/guest.z64" "hardware/sodium64-stage2-$mode.z64"
            dd if="hardware/sodium64-stage2-$mode.z64" of=diagnostic/embedded.smc bs=1 skip=$((0x104000)) count=32768 status=none
            cmp "diagnostic/$mode.smc" diagnostic/embedded.smc
          done
          sha256sum hardware/*.z64 qualified/hw-profile/sodium64.z64 qualified/hw-profile/build/sodium64.elf diagnostic/*.smc > SHA256SUMS
      - name: Replay exact first-hand PI captures with corrected equal-channel oracle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/actions/artifacts/11097390096/zip > first-hand.zip
          echo "746a38571fceabeae65021ca5be2a6af8422d5b56a27711136049a2744c21e24  first-hand.zip" | sha256sum -c -
          unzip -q first-hand.zip -d first-hand
          python3 scripts/replay_stage2_probe.py --artifact first-hand --output replay
          mkdir -p captures
          cp -a first-hand/captures/. captures/
          for mode in visual mixed; do
            python3 scripts/decode_stage2_probe.py "captures/$mode/cart.sav" --output "captures/$mode/decoded"
            python3 scripts/hw_profile_report.py "captures/$mode/cart.sav" --snapshot-output "captures/$mode/profile.bin" --json-output "captures/$mode/hardware.json"
          done
          cp first-hand/ares-version.txt .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-c-stage2-native-probe
          retention-days: 30
          path: |
            hardware/
            diagnostic/*.smc
            qualified/**/*.elf
            qualified/**/*.map
            qualified/**/sodium64.z64
            SHA256SUMS
            captures/
            replay/
            normal-build.log
            probe-build.log
            ares-version.txt
