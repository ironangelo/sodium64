name: Ares Profile Validation

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: sodium64-ares-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Install libdragon
        run: npm install -g libdragon

      - name: Checkout Sodium64
        uses: actions/checkout@v4

      - name: Run host profiling tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Compile profiling build
        shell: bash
        run: |
          set -o pipefail
          libdragon init
          libdragon make PROFILE=1 -j$(nproc) 2>&1 | tee profile-build.log

      - name: Record profiling build metrics
        run: |
          python3 scripts/build_metrics.py \
            --rom sodium64.z64 \
            --elf build/sodium64.elf \
            --build-dir build \
            --output profile-build-metrics.txt

      - name: Upload profiling artifact
        uses: actions/upload-artifact@v4
        with:
          name: sodium64-ares-profile-build
          retention-days: 14
          path: |
            sodium64.z64
            rom-converter.py
            build/sodium64.elf
            build/*.map
            profile-build.log
            profile-build-metrics.txt

  ares-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - profile-build

    steps:
      - name: Checkout Sodium64
        uses: actions/checkout@v4

      - name: Download profiling build
        uses: actions/download-artifact@v4
        with:
          name: sodium64-ares-profile-build
          path: artifacts/profile

      - name: Install ares build and virtual-display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache \
            cmake \
            git \
            libgtk-3-dev \
            libgl1-mesa-dri \
            libsdl2-dev \
            libvulkan1 \
            mesa-vulkan-drivers \
            ninja-build \
            qt6-base-dev \
            xauth \
            xvfb

      - name: Restore ares compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ares-n64-ccache-${{ runner.os }}-${{ runner.arch }}-17813a3ccda21ab9bd45f09bfc2f91196dbf50ff

      - name: Build pinned N64-only ares
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ares-src"
          git clone --filter=blob:none https://github.com/ares-emulator/ares.git "$root"
          git -C "$root" checkout 17813a3ccda21ab9bd45f09bfc2f91196dbf50ff
          cd "$root"
          ccache --zero-stats
          .github/scripts/build_sdl.sh
          cmake --preset ubuntu-ci -DARES_CORES=n64
          cmake --build build --parallel "$(nproc)"
          ccache --show-stats
          ares_bin=$(find "$root/build" -type f -name ares -perm -111 | head -n1)
          test -n "$ares_bin"
          test -x "$ares_bin"
          echo "ARES_BIN=$ares_bin" >> "$GITHUB_ENV"
          "$ares_bin" --version | tee "$GITHUB_WORKSPACE/ares-version.txt"

      - name: Generate deterministic profiling workload ROMs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workloads/ares
          cp artifacts/profile/sodium64.z64 workloads/ares/sodium64.z64
          cp artifacts/profile/rom-converter.py workloads/ares/rom-converter.py
          python3 scripts/make_profile_workloads.py workloads/ares
          (
            cd workloads/ares
            python3 rom-converter.py </dev/null
          )
          for workload in idle cpu-alu wram ppu-registers dma-vram; do
            test -f "workloads/ares/out/profile-$workload.z64"
          done

      - name: Locate profiling and frame-budget runtime state
        shell: bash
        run: |
          set -euo pipefail
          elf="artifacts/profile/build/sodium64.elf"
          symbol() {
            nm -n "$elf" | awk -v name="$1" '$3 == name { print $1; exit }'
          }

          magic=$(symbol profile_magic)
          end=$(symbol profile_sample_buffer_end)
          buffer=$(symbol profile_sample_buffer)
          write_ptr=$(symbol profile_write_ptr)
          sample_count=$(symbol profile_sample_count)
          last_epc=$(symbol profile_last_epc)
          apu_clock=$(symbol apu_clock)
          jit_lookup=$(symbol jit_lookup)
          jit_pointer=$(symbol jit_pointer)
          fps_native=$(symbol fps_native)
          fps_emulate=$(symbol fps_emulate)
          fps_display=$(symbol fps_display)
          frame_count=$(symbol frame_count)
          skipped_set=$(symbol skipped_set)
          precision_set=$(symbol precision_set)
          audio_set=$(symbol audio_set)

          for value in \
            "$magic" "$end" "$buffer" "$write_ptr" "$sample_count" \
            "$last_epc" "$apu_clock" "$jit_lookup" "$jit_pointer" \
            "$fps_native" "$fps_emulate" "$fps_display" "$frame_count" \
            "$skipped_set" "$precision_set" "$audio_set"; do
            test -n "$value"
          done

          size=$((0x$end - 0x$magic))
          jit_lookup_size=$((0x$jit_pointer - 0x$jit_lookup))
          test "$size" -gt 16384
          test "$jit_lookup_size" -eq 262144

          buffer_hex=$(printf '%08x' "$((0x$buffer))")
          rom_buffer=$(awk '$1 == "#define" && $2 == "ROM_BUFFER" { print $3; exit }' src/defines.h)
          test -n "$rom_buffer"
          jit_buffer=$((rom_buffer - 0x40000))
          jit_buffer_hex=$(printf '%08x' "$jit_buffer")

          {
            echo "ARES_PROFILE_ADDR=$magic"
            echo "ARES_PROFILE_SIZE=$size"
            echo "ARES_PROFILE_BUFFER_ADDR=$buffer"
            echo "ARES_PROFILE_BUFFER_HEX=$buffer_hex"
            echo "ARES_PROFILE_WRITE_PTR_ADDR=$write_ptr"
            echo "ARES_PROFILE_SAMPLE_COUNT_ADDR=$sample_count"
            echo "ARES_PROFILE_LAST_EPC_ADDR=$last_epc"
            echo "ARES_APU_CLOCK_ADDR=$apu_clock"
            echo "ARES_JIT_LOOKUP_ADDR=$jit_lookup"
            echo "ARES_JIT_LOOKUP_SIZE=$jit_lookup_size"
            echo "ARES_JIT_POINTER_ADDR=$jit_pointer"
            echo "ARES_JIT_BUFFER_HEX=$jit_buffer_hex"
            echo "ARES_FPS_NATIVE_ADDR=$fps_native"
            echo "ARES_FPS_EMULATE_ADDR=$fps_emulate"
            echo "ARES_FPS_DISPLAY_ADDR=$fps_display"
            echo "ARES_FRAME_COUNT_ADDR=$frame_count"
            echo "ARES_SKIPPED_SET_ADDR=$skipped_set"
            echo "ARES_PRECISION_SET_ADDR=$precision_set"
            echo "ARES_AUDIO_SET_ADDR=$audio_set"
          } >> "$GITHUB_ENV"

          echo "profiler snapshot:  0x$magic + $size bytes"
          echo "profile buffer:     0x$buffer"
          echo "apu_clock:          0x$apu_clock (measurement value: 0x15 / 21 cycles)"
          echo "APU JIT lookup:     0x$jit_lookup + $jit_lookup_size bytes"
          echo "APU JIT reset ptr:  0x$jit_buffer_hex"
          echo "fps_display:        0x$fps_display"
          echo "frameskip setting:  0x$skipped_set (measurement value: 0x00)"

      - name: Run interpreter control and recompiler workload matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p profiles

          run_profile() {
            label="$1"
            rom="$2"
            force_interpreter="$3"
            run_seconds="$4"
            port="$5"
            min_samples="$6"
            max_run_seconds="$7"

            home="$RUNNER_TEMP/ares-home-$label"
            settings="$RUNNER_TEMP/ares-settings-$label.bml"
            emulator_log="profiles/$label-emulator.log"
            gdb_log="profiles/$label-gdb.log"
            snapshot="profiles/$label.bin"
            report="profiles/$label.txt"
            json="profiles/$label.json"
            state="profiles/$label-state.json"
            mkdir -p "$home"

            HOME="$home" SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 \
              xvfb-run -a stdbuf -oL -eL "$ARES_BIN" \
                --no-file-prompt \
                --system "Nintendo 64" \
                --settings-file "$settings" \
                --setting "Developer/DebugServerEnabled=true" \
                --setting "Developer/DebugServerUseIPv4=true" \
                --setting "Developer/DebugServerPort=$port" \
                --setting "Developer/HomebrewMode=true" \
                --setting "Developer/DeterministicEntropy=true" \
                --setting "Developer/ForceInterpreter=$force_interpreter" \
                --setting "Boot/AwaitGDBClient=true" \
                "$rom" \
                > "$emulator_log" 2>&1 &
            ares_pid=$!

            cleanup_run() {
              kill "$ares_pid" 2>/dev/null || true
              wait "$ares_pid" 2>/dev/null || true
            }

            extra_sampling_args=()
            if [ "$min_samples" -gt 0 ]; then
              extra_sampling_args=(
                --sample-count-address "0x$ARES_PROFILE_SAMPLE_COUNT_ADDR"
                --min-samples "$min_samples"
                --max-run-seconds "$max_run_seconds"
              )
            fi

            if ! python3 scripts/gdb_rsp_dump.py \
              --port "$port" \
              --connect-timeout 45 \
              --response-timeout 60 \
              --warmup-seconds 1 \
              --zero "0x$ARES_JIT_LOOKUP_ADDR:$ARES_JIT_LOOKUP_SIZE" \
              --write "0x$ARES_APU_CLOCK_ADDR:15" \
              --write "0x$ARES_JIT_POINTER_ADDR:$ARES_JIT_BUFFER_HEX" \
              --write "0x$ARES_SKIPPED_SET_ADDR:00" \
              --write "0x$ARES_AUDIO_SET_ADDR:04" \
              --settle-seconds 1 \
              --after-settle-write "0x$ARES_PROFILE_SAMPLE_COUNT_ADDR:00000000" \
              --after-settle-write "0x$ARES_PROFILE_WRITE_PTR_ADDR:$ARES_PROFILE_BUFFER_HEX" \
              --after-settle-write "0x$ARES_PROFILE_LAST_EPC_ADDR:00000000" \
              --after-settle-write "0x$ARES_FPS_NATIVE_ADDR:00" \
              --after-settle-write "0x$ARES_FPS_EMULATE_ADDR:00" \
              --after-settle-write "0x$ARES_FPS_DISPLAY_ADDR:ff" \
              --run-seconds "$run_seconds" \
              "${extra_sampling_args[@]}" \
              --observe "fps_display:0x$ARES_FPS_DISPLAY_ADDR:1" \
              --observe "fps_native:0x$ARES_FPS_NATIVE_ADDR:1" \
              --observe "fps_emulate:0x$ARES_FPS_EMULATE_ADDR:1" \
              --observe "frame_count:0x$ARES_FRAME_COUNT_ADDR:1" \
              --observe "skipped_set:0x$ARES_SKIPPED_SET_ADDR:1" \
              --observe "apu_clock:0x$ARES_APU_CLOCK_ADDR:1" \
              --observe "audio_set:0x$ARES_AUDIO_SET_ADDR:1" \
              --observe "precision_set:0x$ARES_PRECISION_SET_ADDR:1" \
              --state-output "$state" \
              --address "0x$ARES_PROFILE_ADDR" \
              --size "$ARES_PROFILE_SIZE" \
              --output "$snapshot" \
              > "$gdb_log" 2>&1; then
              cat "$gdb_log"
              tail -200 "$emulator_log" || true
              cleanup_run
              return 1
            fi
            cat "$gdb_log"
            cleanup_run

            python3 scripts/profile_report.py \
              "$snapshot" \
              artifacts/profile/build/sodium64.elf \
              --nm nm \
              --map artifacts/profile/build/sodium64.map \
              --json-output "$json" | tee "$report"

            samples=$(awk '/total samples:/ { print $3 }' "$report")
            test -n "$samples"
            test "$samples" -gt 0
            if [ "$min_samples" -gt 0 ]; then
              test "$samples" -ge "$min_samples"
            fi
            echo "$label: $samples total samples"
          }

          # Keep the original short interpreter path as a profiler-throughput
          # control. Frame-budget validity is evaluated only on recompiler runs,
          # which advance enough virtual N64 time to span complete VI windows.
          run_profile \
            interpreter-idle \
            workloads/ares/out/profile-idle.z64 \
            true 3 9123 0 3

          # 800 samples corresponds to more than roughly one second of R4300
          # CP0 Count at the current 65,521-tick interval, ensuring the virtual
          # frame-budget observation includes at least one complete 60-VI window.
          port=9130
          for workload in idle cpu-alu wram ppu-registers dma-vram; do
            run_profile \
              "recompiler-$workload" \
              "workloads/ares/out/profile-$workload.z64" \
              false 3 "$port" 800 60
            port=$((port + 1))
          done

      - name: Build workload and frame-budget reports
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/profile_matrix.py \
            profiles/recompiler-idle.json \
            profiles/recompiler-cpu-alu.json \
            profiles/recompiler-wram.json \
            profiles/recompiler-ppu-registers.json \
            profiles/recompiler-dma-vram.json \
            --output profiles/workload-matrix.md

          python3 scripts/frame_budget_report.py \
            profiles/recompiler-idle-state.json \
            profiles/recompiler-cpu-alu-state.json \
            profiles/recompiler-wram-state.json \
            profiles/recompiler-ppu-registers-state.json \
            profiles/recompiler-dma-vram-state.json \
            --target-fps 60 \
            --output profiles/frame-budget.md

          interpreter_samples=$(python3 -c 'import json; print(json.load(open("profiles/interpreter-idle.json"))["meta"]["sample_count"])')
          recompiler_samples=$(python3 -c 'import json; print(json.load(open("profiles/recompiler-idle.json"))["meta"]["sample_count"])')
          interpreter_wall=$(awk '/Captured .* after .*s measured wall time/ { for (i=1; i<=NF; i++) if ($i == "after") { gsub("s", "", $(i+1)); print $(i+1) } }' profiles/interpreter-idle-gdb.log | tail -n1)
          recompiler_wall=$(awk '/Captured .* after .*s measured wall time/ { for (i=1; i<=NF; i++) if ($i == "after") { gsub("s", "", $(i+1)); print $(i+1) } }' profiles/recompiler-idle-gdb.log | tail -n1)

          {
            echo '### ares profiling throughput'
            echo
            echo "- interpreter idle: $interpreter_samples samples / ${interpreter_wall}s measured wall time"
            echo "- recompiler idle: $recompiler_samples samples / ${recompiler_wall}s measured wall time"
            echo
            echo '### Recompiler workload bottleneck matrix'
            echo
            cat profiles/workload-matrix.md
            echo
            echo '### Virtual N64 frame budget'
            echo
            cat profiles/frame-budget.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ares profiling diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sodium64-ares-profile-matrix
          retention-days: 14
          if-no-files-found: ignore
          path: |
            ares-version.txt
            profiles/
