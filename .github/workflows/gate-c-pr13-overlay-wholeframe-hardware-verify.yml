name: Gate C PR13 Real-N64 Whole-Frame Overlay Verify

on:
  push:
    branches:
      - phase4/gate-c-rsp-overlay-hardware-wholeframe
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sodium64-gate-c-overlay-wholeframe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Install libdragon
        run: npm install -g libdragon

      - name: Checkout Sodium64
        uses: actions/checkout@v4

      - name: Validate deterministic guest and decoder
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile             scripts/make_gate_c_obj_window.py             scripts/make_gate_c_mode7_switch.py             scripts/overlay_wholeframe_hw_report.py
          python3 scripts/test_gate_c_mode7_switch.py -v
          mkdir -p diagnostic
          python3 scripts/make_gate_c_mode7_switch.py diagnostic/whole-a.smc
          python3 scripts/make_gate_c_mode7_switch.py diagnostic/whole-b.smc
          cmp diagnostic/whole-a.smc diagnostic/whole-b.smc
          test "$(stat -c %s diagnostic/whole-a.smc)" -eq 32768
          sha256sum diagnostic/whole-a.smc | tee diagnostic/guest.sha256

          python3 - <<'PY'
          import struct
          from pathlib import Path
          w=[0]*32
          w[0]=0x5336344F; w[1]=1; w[2]=0x4F564D32; w[3]=1; w[4]=0x1FFF; w[5]=2
          w[6]=70; w[7]=7; w[8]=7; w[9]=1; w[10]=0; w[11]=0
          w[12]=0x1000024E; w[13]=0xA0113000; w[14]=0x81
          w[15]=5; w[16]=1; w[17]=1; w[18]=1; w[19]=0; w[20]=0
          w[21]=0x91670E64; w[22]=0xA0133D00; w[23]=0x81
          w[24]=0x1000024E; w[25]=0x91670E64; w[27]=0x80; w[28]=0x454E4421
          checksum=0
          for i,x in enumerate(w):
              if i!=26: checksum^=x
          w[26]=checksum
          Path("diagnostic/synthetic-pass.sav").write_bytes(struct.pack(">32I",*w)+bytes(0x8000-0x80))
          PY
          python3 scripts/overlay_wholeframe_hw_report.py diagnostic/synthetic-pass.sav             | tee diagnostic/decoder-selftest.txt

      - name: Build exact R4300-only whole-frame verifier
        shell: bash
        run: |
          set -euo pipefail
          libdragon init
          libdragon make OVERLAY_WHOLEFRAME_HW_VERIFY=1 -j"$(nproc)" 2>&1             | tee wholeframe-hardware-build.log
          test -s sodium64.z64
          test -s build/sodium64.elf
          nm -n build/sodium64.elf | grep -E ' overlay_wholeframe_verify_hook$'
          grep -Eq '^[[:space:]]*\.text[[:space:]]+0xa4001000[[:space:]]+0xd00([[:space:]]|$)' build/rsp_main.map
          grep -Eq '^[[:space:]]*\.text[[:space:]]+0xa4001000[[:space:]]+0xd00([[:space:]]|$)' build/rsp_mode7.map
          python3 scripts/build_metrics.py             --rom sodium64.z64 --elf build/sodium64.elf --build-dir build             --output wholeframe-hardware-build-metrics.txt
          sha256sum sodium64.z64 build/sodium64.elf | tee wholeframe-hardware-build.sha256

      - name: Wrap exact 60-frame Mode1 Mode7 return guest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wrap package
          cp sodium64.z64 wrap/sodium64.z64
          cp rom-converter.py wrap/rom-converter.py
          cp diagnostic/whole-a.smc wrap/pr13-overlay-wholeframe.smc
          (
            cd wrap
            python3 rom-converter.py </dev/null
          )
          test -s wrap/out/pr13-overlay-wholeframe.z64
          dd if=wrap/out/pr13-overlay-wholeframe.z64 of=package/embedded.smc             bs=1 skip=$((0x104000)) count=$((32*1024)) status=none
          cmp diagnostic/whole-a.smc package/embedded.smc
          rm package/embedded.smc

          cp wrap/out/pr13-overlay-wholeframe.z64 package/pr13-overlay-wholeframe-c2.z64
          cp build/sodium64.elf package/sodium64-pr13-overlay-c2.elf
          cp build/sodium64.map package/sodium64-pr13-overlay-c2.map
          cp build/rsp_main.map package/rsp_main.map
          cp build/rsp_mode7.map package/rsp_mode7.map
          cp scripts/overlay_wholeframe_hw_report.py package/overlay_wholeframe_hw_report.py
          cp diagnostic/guest.sha256 package/guest.sha256
          cp wholeframe-hardware-build.log package/wholeframe-hardware-build.log
          cp wholeframe-hardware-build-metrics.txt package/wholeframe-hardware-build-metrics.txt
          cp wholeframe-hardware-build.sha256 package/wholeframe-hardware-build.sha256

          sha256sum package/pr13-overlay-wholeframe-c2.z64             package/sodium64-pr13-overlay-c2.elf             package/rsp_main.map package/rsp_mode7.map             package/overlay_wholeframe_hw_report.py             | tee package/package.sha256

          cat > package/README.txt <<'EOF'
          Sodium64 PR#13 real-N64 whole-frame overlay proof (C2 / OVM2)

          Run:
              pr13-overlay-wholeframe-c2.z64

          The guest holds Mode1 for 60 NMIs, Mode7 for 60 NMIs, then returns
          to Mode1. The verifier captures the physical SP IMEM renderer-slot
          signature well inside Mode7, keeps running, then captures it again
          after the stable return to Mode1.

          Wait for solid GREEN or RED, then extract the SRAM save.
          GREEN = OVM2 PASS. RED = coherent OVM2 FAIL. Return the save either way.

          This build does not instrument RSP microcode; both renderer overlays
          remain the exact PR#13 0xD00-byte candidates. It is correctness-only,
          not cadence/performance evidence.
          EOF

      - name: Upload C2 hardware package
        uses: actions/upload-artifact@v4
        with:
          name: sodium64-pr13-overlay-real-n64-c2
          retention-days: 30
          path: package/
