name: Gate C H-COMP E4b Mupen Warm Epoch Crosscheck

on:
  push:
    branches:
      - phase4/gate-c-h-comp-e4b-mupen-warm-epoch-crosscheck
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sodium64-gate-c-h-comp-e4b-mupen-warm-epoch-crosscheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Install libdragon
        run: npm install -g libdragon

      - name: Checkout Sodium64
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify runtime is byte-identical to original-Main diagnostic parent
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff 7609019cc26411a3ff179d7edad3110b1f9200b2 -- src/)"
          git diff --stat 7609019cc26411a3ff179d7edad3110b1f9200b2
          python3 -m py_compile             scripts/make_gate_c_h_comp_e1_z_tag.py             scripts/gate_c_h_comp_mupen_crosscheck.py

      - name: Generate deterministic E4b guest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic workload
          python3 scripts/make_gate_c_h_comp_e1_z_tag.py diagnostic/e1c-a.smc
          python3 scripts/make_gate_c_h_comp_e1_z_tag.py diagnostic/e1c-b.smc
          cmp diagnostic/e1c-a.smc diagnostic/e1c-b.smc
          test "$(stat -c %s diagnostic/e1c-a.smc)" -eq 32768
          sha256sum diagnostic/e1c-a.smc | tee diagnostic/guest.sha256

      - name: Build exact original-Main diagnostic runtime
        shell: bash
        run: |
          set -euo pipefail
          libdragon init
          libdragon make -j"$(nproc)" 2>&1 | tee sodium64-build.log
          test -s sodium64.z64
          test -s build/sodium64.elf
          sha256sum sodium64.z64 build/sodium64.elf | tee build-sha256.txt

      - name: Wrap exact deterministic guest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wrap
          cp diagnostic/e1c-a.smc workload/e1c.smc
          cp sodium64.z64 wrap/sodium64.z64
          cp rom-converter.py wrap/rom-converter.py
          cp workload/e1c.smc wrap/e1c.smc
          (cd wrap && python3 rom-converter.py </dev/null)
          test -s wrap/out/e1c.z64
          dd if=wrap/out/e1c.z64 of=workload/embedded.smc             bs=1 skip=$((0x104000)) count=$((32 * 1024)) status=none
          cmp workload/e1c.smc workload/embedded.smc
          sha256sum workload/e1c.smc wrap/out/e1c.z64 | tee workload/hashes.sha256
          rm workload/embedded.smc

      - name: Locate clean-epoch capture state
        shell: bash
        run: |
          set -euo pipefail
          elf=build/sodium64.elf
          symbol() { nm -n "$elf" | awk -v name="$1" '$3 == name { print $1; exit }'; }
          wram=$(symbol wram)
          rsp_wait=$(symbol rsp_wait)
          test -n "$wram"
          test -n "$rsp_wait"
          capture_ready=$(printf '%08x' "$((16#$rsp_wait + 0x14))")
          capture_ready_hex=$(printf '%08X' "$((16#$rsp_wait + 0x14))")
          {
            echo "GUEST_COUNTER_ADDR=0x$wram"
            echo "CAPTURE_READY_ADDR=0x$capture_ready"
            echo "CAPTURE_READY_HEX=$capture_ready_hex"
          } | tee -a "$GITHUB_ENV"
          printf 'wram=0x%s rsp_wait=0x%s capture_ready=0x%s\n'             "$wram" "$rsp_wait" "$capture_ready"

      - name: Generate paused-debugger seed and capture streams
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p captures
          python3 scripts/gate_c_h_comp_mupen_crosscheck.py commands             --guest-counter-address "$GUEST_COUNTER_ADDR"             --seed-output captures/seed.commands             --post-output captures/post.commands             | tee captures/command-plan.json
          sha256sum captures/seed.commands captures/post.commands             | tee captures/command-streams.sha256

      - name: Install pinned Mupen and Angrylion build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential             cmake             expect             freeglut3-dev             git             libfreetype6-dev             libgl1-mesa-dev             libgl1-mesa-dri             libglu1-mesa-dev             libpng-dev             libsdl2-dev             libvulkan-dev             libx11-dev             libxrandr-dev             pkg-config             xauth             xvfb             zlib1g-dev

      - name: Build pinned Mupen64Plus debugger and cxd4 LLE RSP
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/sodium64-mupen"
          mkdir -p "$root"
          cd "$root"

          git clone https://github.com/mupen64plus/mupen64plus-core.git
          git -C mupen64plus-core checkout b20b27ebf9e5b099a978e86dba609111dc98c837

          # Host-lab compatibility shim + observational trace only.
          # Preserve cxd4's returned HALT and trace what Mupen core exposes to
          # the R4300 immediately after the completed custom LLE task.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("mupen64plus-core/src/device/rcp/rsp/rsp_core.c")
          s = p.read_text()

          needle = "#include <string.h>\n"
          repl = "#include <string.h>\n#include <stdio.h>\n"
          assert s.count(needle) == 1
          s = s.replace(needle, repl, 1)

          needle = '#include "api/callbacks.h"\n'
          repl = needle + "\nstatic int s64_sp_reads_remaining;\n"
          assert s.count(needle) == 1
          s = s.replace(needle, repl, 1)

          needle = "    *value = sp->regs[reg];\n\n"
          repl = (
              "    *value = sp->regs[reg];\n\n"
              "    if (reg == SP_STATUS_REG && s64_sp_reads_remaining > 0)\n"
              "    {\n"
              "        fprintf(stderr, \"S64_M64P_SP_READ value=%08X rsp_pc=%08X locked=%d unsafe=%08X mi=%08X remaining=%d\\n\",\n"
              "            *value, sp->regs2[SP_PC_REG], sp->rsp_task_locked,\n"
              "            sp->mi->r4300->cp0.interrupt_unsafe_state, sp->mi->regs[MI_INTR_REG],\n"
              "            s64_sp_reads_remaining);\n"
              "        fflush(stderr);\n"
              "        --s64_sp_reads_remaining;\n"
              "    }\n\n"
          )
          assert s.count(needle) == 1
          s = s.replace(needle, repl, 1)

          needle = "    uint32_t reg = rsp_reg(address);\n\n    switch(reg)\n"
          repl = (
              "    uint32_t reg = rsp_reg(address);\n\n"
              "    if (reg == SP_STATUS_REG && s64_sp_reads_remaining > 0)\n"
              "    {\n"
              "        fprintf(stderr, \"S64_M64P_SP_WRITE value=%08X mask=%08X before=%08X locked=%d remaining=%d\\n\",\n"
              "            value, mask, sp->regs[SP_STATUS_REG], sp->rsp_task_locked, s64_sp_reads_remaining);\n"
              "        fflush(stderr);\n"
              "    }\n\n"
              "    switch(reg)\n"
          )
          assert s.count(needle) == 1
          s = s.replace(needle, repl, 1)

          needle = (
              "    sp->regs[SP_STATUS_REG] &=\n"
              "        ~(SP_STATUS_TASKDONE | SP_STATUS_BROKE | SP_STATUS_HALT);\n"
          )
          repl = (
              "    sp->regs[SP_STATUS_REG] &=\n"
              "        ~(SP_STATUS_TASKDONE | SP_STATUS_BROKE);\n"
              "    fprintf(stderr, \"S64_M64P_TASK_EXIT status=%08X rsp_pc=%08X locked=%d unsafe=%08X mi=%08X\\n\",\n"
              "        sp->regs[SP_STATUS_REG], sp->regs2[SP_PC_REG], sp->rsp_task_locked,\n"
              "        sp->mi->r4300->cp0.interrupt_unsafe_state, sp->mi->regs[MI_INTR_REG]);\n"
              "    fflush(stderr);\n"
              "    s64_sp_reads_remaining = 64;\n"
          )
          assert s.count(needle) == 1
          s = s.replace(needle, repl, 1)

          p.write_text(s)
          PY
          git -C mupen64plus-core diff -- src/device/rcp/rsp/rsp_core.c | tee "$GITHUB_WORKSPACE/captures/mupen-core-sp-read-trace.patch"

          git clone https://github.com/mupen64plus/mupen64plus-ui-console.git
          git -C mupen64plus-ui-console checkout c8ac4862a019d7885b24927d9b4db5dd3e42a528
          git clone https://github.com/mupen64plus/mupen64plus-rsp-cxd4.git
          git -C mupen64plus-rsp-cxd4 checkout 00906a92641c540a64e4e7505012157315314810

          # Host-lab trace only: preserve cxd4 emulation semantics while
          # localizing whether Sodium64 reaches its end-of-frame RSP halt.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("mupen64plus-rsp-cxd4/su.c")
          s = p.read_text()

          # Track cxd4's current interpreted RSP PC in host memory only.
          needle = "static int temp_PC;\n"
          repl = "static int temp_PC;\nstatic u32 s64_trace_pc;\n"
          assert s.count(needle) == 1
          s = s.replace(needle, repl, 1)

          # Observe proof-local true-section-start scratch at DMEM 0xB64
          # (MODE7_BOUNDS+4), plus nearby bnez t0 decisions. This is host-only.
          needle = (
              "    addr = SR[base] + offset;\n"
              "    SR_B(rt, 0) = DMEM[BES(addr + 0) & 0x00000FFFul];\n"
              "    SR_B(rt, 1) = DMEM[BES(addr + 1) & 0x00000FFFul];\n"
              "    SR_B(rt, 2) = DMEM[BES(addr + 2) & 0x00000FFFul];\n"
              "    SR_B(rt, 3) = DMEM[BES(addr + 3) & 0x00000FFFul];\n"
              "    SR[zero] = 0x00000000;\n"
          )
          repl = (
              "    addr = SR[base] + offset;\n"
              "    SR_B(rt, 0) = DMEM[BES(addr + 0) & 0x00000FFFul];\n"
              "    SR_B(rt, 1) = DMEM[BES(addr + 1) & 0x00000FFFul];\n"
              "    SR_B(rt, 2) = DMEM[BES(addr + 2) & 0x00000FFFul];\n"
              "    SR_B(rt, 3) = DMEM[BES(addr + 3) & 0x00000FFFul];\n"
              "    if ((addr & 0x00000FFFu) == 0x00000B64u) {\n"
              "        fprintf(stderr, \"S64_CXD4_BANDSTART_LW value=%08X rsp_pc=%08X k0=%08X k1=%08X rt=%u\\n\",\n"
              "            SR[rt], s64_trace_pc, SR[26], SR[27], rt);\n"
              "        fflush(stderr);\n"
              "    }\n"
              "    SR[zero] = 0x00000000;\n"
          )
          assert s.count(needle) == 1
          s = s.replace(needle, repl, 1)

          needle = (
              "PROFILE_MODE int BNE(u32 inst, u32 PC)\n"
              "{\n"
              "    const unsigned int rs = (inst >> 21) % (1 << 5);\n"
              "    const unsigned int rt = (inst >> 16) % (1 << 5);\n\n"
          )
          repl = needle + (
              "    if (rs == 8u && rt == 0u) {\n"
              "        fprintf(stderr, \"S64_CXD4_BNEZ_T0 pc=%08X value=%08X taken=%u k0=%08X k1=%08X\\n\",\n"
              "            PC, SR[8], SR[8] != 0u, SR[26], SR[27]);\n"
              "        fflush(stderr);\n"
              "    }\n"
          )
          assert s.count(needle) == 1
          s = s.replace(needle, repl, 1)

          # Observe the exact two-screen mask transition. s7 is GPR 23.
          # This distinguishes bad/missing TM state from scalar/control-flow
          # divergence without changing guest or RSP memory.
          needle = (
              "    case 002: /* SRL */\n"
              "        SR[rd] = (u32)(SR[rt]) >> MASK_SA(inst >> 6);\n"
              "        SR[zero] = 0x00000000;\n"
          )
          repl = (
              "    case 002: /* SRL */\n"
              "        if (rd == 23u && rt == 23u && MASK_SA(inst >> 6) == 8u) {\n"
              "            fprintf(stderr, \"S64_CXD4_S7_SRL8_BEFORE pc=%08X value=%08X\\n\", PC, SR[23]);\n"
              "            fflush(stderr);\n"
              "        }\n"
              "        SR[rd] = (u32)(SR[rt]) >> MASK_SA(inst >> 6);\n"
              "        if (rd == 23u && rt == 23u && MASK_SA(inst >> 6) == 8u) {\n"
              "            fprintf(stderr, \"S64_CXD4_S7_SRL8_AFTER pc=%08X value=%08X\\n\", PC, SR[23]);\n"
              "            fflush(stderr);\n"
              "        }\n"
              "        SR[zero] = 0x00000000;\n"
          )
          assert s.count(needle) == 1
          s = s.replace(needle, repl, 1)

          needle = (
              "PROFILE_MODE int BEQ(u32 inst, u32 PC)\n"
              "{\n"
              "    const unsigned int rs = (inst >> 21) % (1 << 5);\n"
              "    const unsigned int rt = (inst >> 16) % (1 << 5);\n\n"
          )
          repl = needle + (
              "    if (rs == 23u && rt == 0u) {\n"
              "        fprintf(stderr, \"S64_CXD4_BEQZ_S7 pc=%08X value=%08X taken=%u\\n\",\n"
              "            PC, SR[23], SR[23] == 0u);\n"
              "        fflush(stderr);\n"
              "    }\n"
          )
          assert s.count(needle) == 1
          s = s.replace(needle, repl, 1)

          # Trace the exact proof-local retarget store and DPC publication.
          # RDP_FRAME is 0xC48 in this exact runtime, so the target word lives
          # at DMEM 0xC4C. These logs are observational only.
          needle = (
              "    addr = SR[base] + offset;\n"
              "    DMEM[BES(addr + 0) & 0x00000FFFul] = SR_B(rt, 0);\n"
          )
          repl = (
              "    addr = SR[base] + offset;\n"
              "    if ((addr & 0x00000FFFu) == 0x00000B64u) {\n"
              "        fprintf(stderr, \"S64_CXD4_BANDSTART_SW value=%08X rsp_pc=%08X k0=%08X k1=%08X rt=%u\\n\",\n"
              "            SR[rt], s64_trace_pc, SR[26], SR[27], rt);\n"
              "        fflush(stderr);\n"
              "    }\n"
              "    if ((addr & 0x00000FFFu) == 0x00000C4Cu) {\n"
              "        fprintf(stderr, \"S64_CXD4_RDP_FRAME_TARGET_STORE value=%08X rsp_pc=%08X\\n\", SR[rt], s64_trace_pc);\n"
              "        fflush(stderr);\n"
              "    }\n"
              "    DMEM[BES(addr + 0) & 0x00000FFFul] = SR_B(rt, 0);\n"
          )
          assert s.count(needle) == 1
          s = s.replace(needle, repl, 1)

          needle = (
              "static void MT_CMD_START(unsigned int rt)\n"
              "{\n"
              "    const u32 source = SR[rt] & 0xFFFFFFF8ul; /* Funnelcube demo by marshallh */\n"
          )
          repl = needle + (
              "    fprintf(stderr, \"S64_CXD4_DP_START value=%08X rsp_pc=%08X status=%08X\\n\",\n"
              "        source, s64_trace_pc, GET_RCP_REG(DPC_STATUS_REG));\n"
              "    fflush(stderr);\n"
          )
          assert s.count(needle) == 1
          s = s.replace(needle, repl, 1)

          needle = (
              "static void MT_CMD_END(unsigned int rt)\n"
              "{\n"
          )
          repl = needle + (
              "    fprintf(stderr, \"S64_CXD4_DP_END value=%08X rsp_pc=%08X status=%08X\\n\",\n"
              "        SR[rt] & 0xFFFFFFF8ul, s64_trace_pc, GET_RCP_REG(DPC_STATUS_REG));\n"
              "    fflush(stderr);\n"
          )
          assert s.count(needle) == 1
          s = s.replace(needle, repl, 1)

          # Keep the proven RDP call-boundary trace, now with real newlines and
          # the interpreted RSP PC rather than Mupen's externally stored SP_PC.
          # Also decode live DMEM SET_COLOR_IMAGE commands before Angrylion
          # consumes them. This is observational only and uses cxd4's BES()
          # accessor so bytes are reconstructed in guest order.
          needle = "    GBI_phase();\n"
          before = (
              "    {\n"
              "        u32 s64_cmd_start = GET_RCP_REG(DPC_CURRENT_REG) & 0x00000FFFu;\n"
              "        u32 s64_cmd_end = GET_RCP_REG(DPC_END_REG) & 0x00000FFFu;\n"
              "        u32 s64_off;\n"
              "        if (GET_RCP_REG(DPC_STATUS_REG) & 0x00000001u) {\n"
              "            for (s64_off = s64_cmd_start; s64_off + 7u < s64_cmd_end; s64_off += 8u) {\n"
              "                u32 s64_w0 = ((u32)DMEM[BES((s64_off + 0u) & 0xFFFu)] << 24) |\n"
              "                    ((u32)DMEM[BES((s64_off + 1u) & 0xFFFu)] << 16) |\n"
              "                    ((u32)DMEM[BES((s64_off + 2u) & 0xFFFu)] << 8) |\n"
              "                    ((u32)DMEM[BES((s64_off + 3u) & 0xFFFu)]);\n"
              "                if ((s64_w0 >> 24) == 0x3Fu) {\n"
              "                    u32 s64_w1 = ((u32)DMEM[BES((s64_off + 4u) & 0xFFFu)] << 24) |\n"
              "                        ((u32)DMEM[BES((s64_off + 5u) & 0xFFFu)] << 16) |\n"
              "                        ((u32)DMEM[BES((s64_off + 6u) & 0xFFFu)] << 8) |\n"
              "                        ((u32)DMEM[BES((s64_off + 7u) & 0xFFFu)]);\n"
              "                    fprintf(stderr,\n"
              "                        \"S64_CXD4_SET_COLOR_IMAGE off=%03X w0=%08X w1=%08X target=%08X rsp_pc=%08X\\n\",\n"
              "                        s64_off, s64_w0, s64_w1, s64_w1 & 0x03FFFFFFu, s64_trace_pc);\n"
              "                    fflush(stderr);\n"
              "                }\n"
              "            }\n"
              "        }\n"
              "    }\n"
              "    fprintf(stderr,\n"
              "        \"S64_CXD4_RDP_BEFORE start=%08X end=%08X current=%08X status=%08X rsp_pc=%08X\\n\",\n"
              "        GET_RCP_REG(DPC_START_REG), GET_RCP_REG(DPC_END_REG),\n"
              "        GET_RCP_REG(DPC_CURRENT_REG), GET_RCP_REG(DPC_STATUS_REG),\n"
              "        s64_trace_pc);\n"
              "    fflush(stderr);\n"
          )
          after = (
              "    fprintf(stderr,\n"
              "        \"S64_CXD4_RDP_AFTER start=%08X end=%08X current=%08X status=%08X rsp_pc=%08X\\n\",\n"
              "        GET_RCP_REG(DPC_START_REG), GET_RCP_REG(DPC_END_REG),\n"
              "        GET_RCP_REG(DPC_CURRENT_REG), GET_RCP_REG(DPC_STATUS_REG),\n"
              "        s64_trace_pc);\n"
              "    fflush(stderr);\n"
          )
          assert s.count(needle) == 1
          s = s.replace(needle, before + needle + after, 1)

          # Log the exact SP_STATUS command. Sodium64 ends a rendered frame with
          # value 0x2 (set HALT); this separates "never reached halt" from
          # "halt reached but not observed by the R4300/debugger".
          needle = "static void MT_SP_STATUS(unsigned int rt)\n{\n    pu32 MI_INTR_REG;\n    pu32 SP_STATUS_REG;\n"
          repl = needle + (
              "    fprintf(stderr, \"S64_CXD4_SP_STATUS_BEFORE value=%08X rsp_pc=%08X status=%08X\\n\",\n"
              "        SR[rt], s64_trace_pc, GET_RCP_REG(SP_STATUS_REG));\n"
              "    fflush(stderr);\n"
          )
          assert s.count(needle) == 1
          s = s.replace(needle, repl, 1)

          needle = "    *SP_STATUS_REG |=   (SR[rt] & 0x00000010) >> 4; /* int set halt */\n    return;\n}\n"
          repl = (
              "    *SP_STATUS_REG |=   (SR[rt] & 0x00000010) >> 4; /* int set halt */\n"
              "    fprintf(stderr, \"S64_CXD4_SP_STATUS_AFTER value=%08X rsp_pc=%08X status=%08X\\n\",\n"
              "        SR[rt], s64_trace_pc, *SP_STATUS_REG);\n"
              "    fflush(stderr);\n"
              "    return;\n}\n"
          )
          assert s.count(needle) == 1
          s = s.replace(needle, repl, 1)

          # Entry/exit plus sparse heartbeats make a non-returning RSP loop
          # localizable without changing guest state or Sodium64 bytes.
          needle = "NOINLINE void run_task(void)\n{\n    register u32 PC;\n\n    PC = FIT_IMEM(GET_RCP_REG(SP_PC_REG));\n"
          repl = (
              "NOINLINE void run_task(void)\n"
              "{\n"
              "    register u32 PC;\n"
              "    unsigned long s64_steps = 0;\n\n"
              "    PC = FIT_IMEM(GET_RCP_REG(SP_PC_REG));\n"
              "    s64_trace_pc = PC;\n"
              "    fprintf(stderr, \"S64_CXD4_RSP_ENTER pc=%08X status=%08X dpc=%08X\\n\",\n"
              "        PC, GET_RCP_REG(SP_STATUS_REG), GET_RCP_REG(DPC_STATUS_REG));\n"
              "    fflush(stderr);\n"
          )
          assert s.count(needle) == 1
          s = s.replace(needle, repl, 1)

          needle = "    for (;;) {\n        inst_word = *(pi32)(IMEM + FIT_IMEM(PC));\n"
          repl = (
              "    for (;;) {\n"
              "        s64_trace_pc = PC;\n"
              "        if ((++s64_steps & 0x000FFFFFul) == 0) {\n"
              "            fprintf(stderr, \"S64_CXD4_RSP_HEARTBEAT pc=%08X status=%08X dpc=%08X steps=%lu\\n\",\n"
              "                PC, GET_RCP_REG(SP_STATUS_REG), GET_RCP_REG(DPC_STATUS_REG), s64_steps);\n"
              "            fflush(stderr);\n"
              "        }\n"
              "        inst_word = *(pi32)(IMEM + FIT_IMEM(PC));\n"
          )
          assert s.count(needle) == 1
          s = s.replace(needle, repl, 1)

          needle = "RSP_halted_CPU_exit_point:\n    GET_RCP_REG(SP_PC_REG) = 0x04001000 | FIT_IMEM(PC);\n"
          repl = (
              "RSP_halted_CPU_exit_point:\n"
              "    fprintf(stderr, \"S64_CXD4_RSP_EXIT pc=%08X status=%08X dpc=%08X steps=%lu\\n\",\n"
              "        PC, GET_RCP_REG(SP_STATUS_REG), GET_RCP_REG(DPC_STATUS_REG), s64_steps);\n"
              "    fflush(stderr);\n"
              "    GET_RCP_REG(SP_PC_REG) = 0x04001000 | FIT_IMEM(PC);\n"
          )
          assert s.count(needle) == 1
          s = s.replace(needle, repl, 1)

          p.write_text(s)
          PY
          git -C mupen64plus-rsp-cxd4 diff -- su.c | tee "$GITHUB_WORKSPACE/captures/cxd4-rsp-control-trace.patch"

          # Host-lab compatibility shim only: Sodium64's resident custom
          # microcode intentionally sets SP_STATUS.HALT to signal frame
          # completion to the R4300. cxd4's wrapper clears that HALT after
          # run_task() returns, before Mupen core can expose it to the CPU.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("mupen64plus-rsp-cxd4/module.c")
          s = p.read_text()
          needle = '    *CR[0x4] &= ~SP_STATUS_HALT; /* CPU restarts with the correct SIGs. */\n'
          repl = (
              '    fprintf(stderr, "S64_CXD4_PRESERVE_HALT status=%08X\\n", *CR[0x4]);\n'
              '    fflush(stderr);\n'
          )
          assert s.count(needle) == 1
          p.write_text(s.replace(needle, repl, 1))
          PY
          git -C mupen64plus-rsp-cxd4 diff -- module.c | tee "$GITHUB_WORKSPACE/captures/cxd4-preserve-halt.patch"

          export PATH="$root/mupen64plus-core/.github/workflows/scripts:$PATH"

          cd "$root/mupen64plus-core"
          export CONFIG_OVERRIDE="DEBUGGER=1 DEBUGGER_NO_DISASM=1 NEW_DYNAREC=0 NO_ASM=1"
          ci_build.sh x64 gcc

          cd "$root/mupen64plus-ui-console"
          export CONFIG_OVERRIDE=""
          ci_build.sh x64 gcc

          cd "$root/mupen64plus-rsp-cxd4"
          export CONFIG_OVERRIDE='SSE="none"'
          export OPTFLAGS="-O3"
          ci_build.sh x64 gcc

          core_lib=$(find "$root/mupen64plus-core/pkg/usr/local/lib" -maxdepth 1 -type f -name 'libmupen64plus.so*' | head -n1)
          ui_bin="$root/mupen64plus-ui-console/pkg/usr/local/bin/mupen64plus"
          rsp_lib=$(find "$root/mupen64plus-rsp-cxd4/pkg/usr/local/lib/mupen64plus" -type f -name '*cxd4*.so' | head -n1)
          data_dir="$root/mupen64plus-core/pkg/usr/local/share/mupen64plus"

          test -f "$core_lib"
          test -x "$ui_bin"
          test -f "$rsp_lib"
          test -d "$data_dir"

          {
            echo "M64P_CORE=$core_lib"
            echo "M64P_UI=$ui_bin"
            echo "M64P_RSP=$rsp_lib"
            echo "M64P_DATA=$data_dir"
            echo "M64P_LIBDIR=$(dirname "$core_lib")"
          } >> "$GITHUB_ENV"

      - name: Build pinned Angrylion software RDP
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/angrylion-rdp-plus"
          git clone https://github.com/ata4/angrylion-rdp-plus.git "$root"
          git -C "$root" checkout 9c8b9ed3e7d7f00dff8bc872ccdd3fba1a3673fc
          cmake -S "$root" -B "$root/build"             -DBUILD_MUPEN64PLUS=ON             -DBUILD_PROJECT64=OFF             -DCMAKE_BUILD_TYPE=Release
          cmake --build "$root/build" --parallel "$(nproc)"
          gfx_lib=$(find "$root/build" -type f -name 'mupen64plus-video-angrylion-plus.so' | head -n1)
          test -f "$gfx_lib"
          echo "M64P_GFX=$gfx_lib" >> "$GITHUB_ENV"
          {
            echo "mupen-core b20b27ebf9e5b099a978e86dba609111dc98c837"
            echo "mupen-ui c8ac4862a019d7885b24927d9b4db5dd3e42a528"
            echo "cxd4 00906a92641c540a64e4e7505012157315314810"
            echo "angrylion-rdp-plus 9c8b9ed3e7d7f00dff8bc872ccdd3fba1a3673fc"
          } | tee captures/lab-pins.txt

      - name: Run exact one-frame clean-epoch crosscheck
        shell: bash
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/m64p-hcomp-config"
          mkdir -p "$config"
          cat > "$RUNNER_TEMP/mupen-hcomp.expect" <<'EOF'
          set timeout 300
          log_file -noappend "$env(GITHUB_WORKSPACE)/captures/mupen-warm-epoch-crosscheck.log"
          spawn env LD_LIBRARY_PATH=$env(M64P_LIBDIR) LIBGL_ALWAYS_SOFTWARE=1             $env(M64P_UI)               --corelib $env(M64P_CORE)               --datadir $env(M64P_DATA)               --configdir $env(M64P_CONFIG)               --debug --emumode 0 --nospeedlimit --noosd --windowed               --resolution 320x240               --gfx $env(M64P_GFX)               --audio dummy               --input dummy               --rsp $env(M64P_RSP)               --set {Video-AngrylionPlus[Parallel]=False}               --set {Video-AngrylionPlus[NumWorkers]=1}               --set {Video-AngrylionPlus[BusyLoop]=False}               --set {Video-AngrylionPlus[DpCompat]=2}               --set {Video-AngrylionPlus[ViVsync]=False}               $env(M64P_ROM)

          expect "(dbg) "
          send "bp add $env(CAPTURE_READY_ADDR) 1 8\r"
          expect "(dbg) "
          send "run\r"
          expect "PC at 0x$env(CAPTURE_READY_HEX)."
          expect "(dbg) "

          # Match the established ares clean-epoch contract: startup ownership
          # is not authoritative. Advance five additional complete rendered
          # frames before seeding proof memory, so guest_counter is expected
          # to be >=5 at the seed boundary.
          for {set warm 0} {$warm < 5} {incr warm} {
            send "bp rm $env(CAPTURE_READY_ADDR)\r"
            expect "(dbg) "
            send "step\r"
            expect "(dbg) "
            send "bp add $env(CAPTURE_READY_ADDR) 1 8\r"
            expect "(dbg) "
            send "run\r"
            expect "PC at 0x$env(CAPTURE_READY_HEX)."
            expect "(dbg) "
          }

          set seedf [open "$env(GITHUB_WORKSPACE)/captures/seed.commands" r]
          set seed [read $seedf]
          close $seedf
          set seed [string map {"\n" "\r"} $seed]
          set send_slow {4096 0.005}
          send -s -- $seed
          expect "PC: $env(CAPTURE_READY_HEX)"
          expect "(dbg) "

          send "bp rm $env(CAPTURE_READY_ADDR)\r"
          expect "(dbg) "
          send "step\r"
          expect "(dbg) "
          send "bp add $env(CAPTURE_READY_ADDR) 1 8\r"
          expect "(dbg) "
          set timeout 60
          send "run\r"
          expect "PC at 0x$env(CAPTURE_READY_HEX)."
          expect "(dbg) "

          set postf [open "$env(GITHUB_WORKSPACE)/captures/post.commands" r]
          set post [read $postf]
          close $postf
          set post [string map {"\n" "\r"} $post]
          send -s -- $post
          expect "PC: $env(CAPTURE_READY_HEX)"
          expect "(dbg) "
          send "quit\r"
          expect eof
          EOF

          export M64P_CONFIG="$config"
          export M64P_ROM="$GITHUB_WORKSPACE/wrap/out/e1c.z64"
          (
            cd captures
            timeout 720 xvfb-run -a expect "$RUNNER_TEMP/mupen-hcomp.expect"
          )

      - name: Classify Mupen Angrylion crosscheck
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/gate_c_h_comp_mupen_crosscheck.py classify             --guest-counter-address "$GUEST_COUNTER_ADDR"             --input-dir captures             --output captures/result.json             | tee captures/classify.log

      - name: Upload Mupen Angrylion crosscheck evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-h-comp-e4b-mupen-warm-epoch-crosscheck
          retention-days: 30
          if-no-files-found: ignore
          path: |
            captures/
            diagnostic/guest.sha256
            workload/hashes.sha256
            workload/e1c.smc
            sodium64-build.log
            build-sha256.txt
            build/rsp_main.map
