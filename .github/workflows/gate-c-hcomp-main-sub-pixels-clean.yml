name: Gate C H-COMP Main Sub Pixels Clean

on:
  push:
    branches:
      - phase4/gate-c-hcomp-main-sub-pixels-clean
    paths:
      - scripts/check_gate_c_hcomp_main_sub_pixels.py
      - scripts/make_gate_c_hcomp_main_sub_lifetime.py
      - scripts/check_gate_c_hcomp_main_sub_lifetime.py
      - scripts/test_gate_c_hcomp_main_sub_exec_clean.py
      - .github/workflows/gate-c-hcomp-main-sub-pixels-clean.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sodium64-gate-c-hcomp-main-sub-pixels-clean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dynamic-main-sub-pixels:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Install libdragon
        run: npm install -g libdragon

      - name: Checkout
        uses: actions/checkout@v4

      - name: Self-test classifier and deterministic guest
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile             scripts/check_gate_c_hcomp_main_sub_pixels.py             scripts/check_gate_c_hcomp_main_sub_lifetime.py             scripts/make_gate_c_hcomp_main_sub_lifetime.py             scripts/test_gate_c_hcomp_main_sub_exec_clean.py
          python3 scripts/check_gate_c_hcomp_main_sub_pixels.py --self-test
          python3 scripts/make_gate_c_hcomp_main_sub_lifetime.py guest-a.smc
          python3 scripts/make_gate_c_hcomp_main_sub_lifetime.py guest-b.smc
          cmp guest-a.smc guest-b.smc
          test "$(stat -c %s guest-a.smc)" -eq 32768
          sha256sum guest-a.smc | tee guest.sha256
          grep -q '^bfbbf280a830cf8659c9b670fa753af94e36a1ddd00f1aada162fb85438d0b05  guest-a.smc$' guest.sha256

      - name: Build exact executable Main Sub candidate
        shell: bash
        run: |
          set -euo pipefail
          libdragon init
          libdragon make -j"$(nproc)" 2>&1 | tee build.log
          readelf -sW build/src/rsp_main.elf > rsp-main.syms
          readelf -sW build/src/rsp_mode7.elf > rsp-mode7.syms
          readelf -sW build/src/rsp_hcomp.elf > rsp-hcomp.syms
          python3 scripts/test_gate_c_hcomp_main_sub_exec_clean.py             --maps build/rsp_main.map build/rsp_mode7.map build/rsp_hcomp.map             --symbols rsp-main.syms rsp-mode7.syms rsp-hcomp.syms             | tee executable-contract.txt
          grep -q '^HCOMP_MAIN_SUB_EXEC_CLEAN_CONTRACT_VALIDATED$' executable-contract.txt
          python3 scripts/check_rsp_branch_delay_slots.py             build/src/rsp_main.elf build/src/rsp_mode7.elf build/src/rsp_hcomp.elf             | tee delay-slots.txt
          sha256sum sodium64.z64 build/sodium64.elf             build/src/rsp_main.elf build/src/rsp_mode7.elf build/src/rsp_hcomp.elf             | tee runtime.sha256
          grep -q '^eb216fcc259dd174d9ae3fb7b1908aaed775753a5b2c43689c9ead238670cff9  sodium64.z64$' runtime.sha256

      - name: Wrap deterministic guest
        shell: bash
        run: |
          set -euo pipefail
          mkdir workload
          cp sodium64.z64 rom-converter.py guest-a.smc workload/
          (
            cd workload
            python3 rom-converter.py </dev/null
          )
          test -f workload/out/guest-a.z64
          sha256sum workload/out/guest-a.z64 | tee wrapped.sha256

      - name: Install Mupen64Plus build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential expect git libfreetype6-dev libgl1-mesa-dev             libglu1-mesa-dev libpng-dev libsdl2-dev libvulkan-dev pkg-config zlib1g-dev

      - name: Build pinned Mupen64Plus debugger and LLE RSP
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/sodium64-mupen"
          mkdir -p "$root"
          cd "$root"

          git clone https://github.com/mupen64plus/mupen64plus-core.git
          git -C mupen64plus-core checkout b20b27ebf9e5b099a978e86dba609111dc98c837
          git clone https://github.com/mupen64plus/mupen64plus-ui-console.git
          git -C mupen64plus-ui-console checkout c8ac4862a019d7885b24927d9b4db5dd3e42a528
          git clone https://github.com/mupen64plus/mupen64plus-rsp-cxd4.git
          git -C mupen64plus-rsp-cxd4 checkout 00906a92641c540a64e4e7505012157315314810

          export PATH="$root/mupen64plus-core/.github/workflows/scripts:$PATH"
          cd "$root/mupen64plus-core"
          export CONFIG_OVERRIDE="DEBUGGER=1 DEBUGGER_NO_DISASM=1 NEW_DYNAREC=0 NO_ASM=1"
          ci_build.sh x64 gcc

          cd "$root/mupen64plus-ui-console"
          export CONFIG_OVERRIDE=""
          ci_build.sh x64 gcc

          cd "$root/mupen64plus-rsp-cxd4"
          export CONFIG_OVERRIDE='SSE="none"'
          export OPTFLAGS="-O3"
          ci_build.sh x64 gcc

          core_lib=$(find "$root/mupen64plus-core/pkg/usr/local/lib" -maxdepth 1 -type f -name 'libmupen64plus.so*' | head -n1)
          ui_bin="$root/mupen64plus-ui-console/pkg/usr/local/bin/mupen64plus"
          rsp_lib=$(find "$root/mupen64plus-rsp-cxd4/pkg/usr/local/lib/mupen64plus" -type f -name '*cxd4*.so' | head -n1)
          data_dir="$root/mupen64plus-core/pkg/usr/local/share/mupen64plus"
          {
            echo "M64P_CORE=$core_lib"
            echo "M64P_UI=$ui_bin"
            echo "M64P_RSP=$rsp_lib"
            echo "M64P_DATA=$data_dir"
            echo "M64P_LIBDIR=$(dirname "$core_lib")"
          } >> "$GITHUB_ENV"

      - name: Capture compact Sub and Main pixel bands
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence "$RUNNER_TEMP/m64p-config"

          cat > "$RUNNER_TEMP/main-sub-pixels.expect" <<'EOF'
          set timeout 90
          log_file evidence/mupen.log
          spawn env LD_LIBRARY_PATH=$env(M64P_LIBDIR) $env(M64P_UI)             --corelib $env(M64P_CORE)             --datadir $env(M64P_DATA)             --configdir $env(RUNNER_TEMP)/m64p-config             --debug --emumode 0 --nospeedlimit             --gfx dummy --audio dummy --input dummy --rsp $env(M64P_RSP)             workload/out/guest-a.z64
          expect "(dbg)"

          for {set n 0} {$n < 6} {incr n} {
            send "run\r"
            if {$n == 0} { after 5000 } else { after 700 }
            send "pause\r"
            expect "(dbg)"

            send "dumpmem 0xA016C600 256 evidence/snap$n-q1.bin\r"
            expect "(dbg)"
            send "dumpmem 0xA0171600 256 evidence/snap$n-q2.bin\r"
            expect "(dbg)"
            send "dumpmem 0xA00E4000 4480 evidence/snap$n-sub.bin\r"
            expect "(dbg)"
            send "dumpmem 0xA00F2300 4480 evidence/snap$n-main1.bin\r"
            expect "(dbg)"
            send "dumpmem 0xA0113000 4480 evidence/snap$n-main2.bin\r"
            expect "(dbg)"
            send "dumpmem 0xA0133D00 4480 evidence/snap$n-main3.bin\r"
            expect "(dbg)"
            send "dumpmem $env(RDP_FRAME_ADDR) 24 evidence/snap$n-rdp-frame.bin\r"
            expect "(dbg)"
          }

          send "quit\r"
          expect eof
          EOF

          expect "$RUNNER_TEMP/main-sub-pixels.expect"
          for kind in q1 q2 sub main1 main2 main3 rdp-frame; do
            test "$(find evidence -name "snap*-$kind.bin" | wc -l)" -eq 6
          done

      - name: Classify dual rendered color ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_gate_c_hcomp_main_sub_pixels.py evidence             --guest guest-a.smc             --output evidence/result.json
          grep -q '"classification": "HCOMP_MAIN_SUB_PIXELS_DYNAMIC_VALIDATED"' evidence/result.json
          grep -q '"passed": true' evidence/result.json
          grep -q '"independent_rendered_operands": true' evidence/result.json

      - name: Upload pixel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-hcomp-main-sub-pixels-clean
          retention-days: 30
          path: |
            evidence/
            guest-a.smc
            guest.sha256
            wrapped.sha256
            runtime.sha256
            executable-contract.txt
            delay-slots.txt
            rdp-frame-address.txt
            build.log
