name: Gate C CGRAM DMA8 Producer

on:
  push:
    branches:
      - phase4/gate-c-cgram-epoch-dma8-producer
    paths:
      - src/defines.h
      - src/ppu.S
      - src/main.S
      - src/rsp_main.S
      - src/rsp_mode7.S
      - scripts/test_gate_c_cgram_epoch_contract.py
      - scripts/test_gate_c_cgram_rsp_consumer_contract.py
      - scripts/test_gate_c_cgram_epoch_producer.py
      - .github/workflows/gate-c-cgram-epoch-producer.yml
  workflow_dispatch:

concurrency:
  group: sodium64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cgram-dma8-producer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile host oracles
        run: |
          python3 -m py_compile scripts/test_gate_c_cgram_epoch_contract.py
          python3 -m py_compile scripts/test_gate_c_cgram_rsp_consumer_contract.py
          python3 -m py_compile scripts/test_gate_c_cgram_epoch_producer.py

      - name: Reprove epoch layout and timing bound
        run: python3 scripts/test_gate_c_cgram_epoch_contract.py

      - name: Reprove hardened DMA8 consumer contract
        run: python3 scripts/test_gate_c_cgram_rsp_consumer_contract.py

      - name: Prove DMA8 CPU producer contract
        run: python3 scripts/test_gate_c_cgram_epoch_producer.py
