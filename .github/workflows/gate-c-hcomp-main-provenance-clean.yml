              test -s "$wrap/out/guest.z64"
              dd if="$wrap/out/guest.z64" of="workload/$stem-embedded.smc"                 bs=1 skip=$((0x104000)) count=$((32 * 1024)) status=none
              cmp "diagnostic/$stem-a.smc" "workload/$stem-embedded.smc"
              rm "workload/$stem-embedded.smc"
            done
          done
          sha256sum wrap-*/out/guest.z64 | sort | tee workload/wrapped-hashes.sha256

