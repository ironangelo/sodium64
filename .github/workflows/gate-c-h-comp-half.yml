name: Gate C H-COMP Half-Add Diagnostic

on:
  push:
    branches:
      - phase4/gate-c-h-comp-half-diagnostic
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sodium64-gate-c-h-comp-half-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout Sodium64
        uses: actions/checkout@v4

      - name: Validate H-COMP diagnostic tools
        run: |
          python3 scripts/test_gate_c_h_comp_half.py -v
          python3 scripts/test_gate_c_h_comp_half_analyze.py -v

      - name: Generate deterministic original SNES diagnostic twice
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic
          python3 scripts/make_gate_c_h_comp_half.py diagnostic/a.smc | tee diagnostic/generator-a.log
          python3 scripts/make_gate_c_h_comp_half.py diagnostic/b.smc | tee diagnostic/generator-b.log
          cmp diagnostic/a.smc diagnostic/b.smc
          sha256sum diagnostic/a.smc | tee diagnostic/guest.sha256
          test "$(stat -c %s diagnostic/a.smc)" -eq $((32 * 1024))

          cat > diagnostic/MANIFEST.txt <<EOF
          purpose=Gate C H-COMP full-add vs half-add discriminator
          sodium64_base=5b7134930a0ca859f6aa24e54102de116948e3ed
          diagnostic_source_sha=$GITHUB_SHA
          mode=SNES Mode1
          main=BG1 RGB5(16,0,0)
          second_operand=fixed RGB5(0,16,0)
          tm=0x01
          ts=0x00
          cgwsel=0x00
          control_cgadsub=0x01
          treatment_cgadsub=0x41
          control_expected_rgb5=16,16,0
          treatment_expected_rgb5=8,8,0
          windows=disabled
          obj=disabled
          hdma=disabled
          EOF

      - name: Upload original diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-h-comp-half-diagnostic
          retention-days: 30
          path: diagnostic/

  sodium64-n64-semantic:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: diagnostic-build
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Install libdragon
        run: npm install -g libdragon

      - name: Checkout Sodium64
        uses: actions/checkout@v4

      - name: Run H-COMP host tests
        run: |
          python3 scripts/test_gate_c_h_comp_half.py -v
          python3 scripts/test_gate_c_h_comp_half_analyze.py -v

      - name: Build exact unchanged integrated core
        shell: bash
        run: |
          set -euo pipefail
          libdragon init
          libdragon make -j"$(nproc)" 2>&1 | tee sodium64-build.log
          test -s sodium64.z64
          test -s build/sodium64.elf

      - name: Generate wrap and verify exact embedded guest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workload wrap
          python3 scripts/make_gate_c_h_comp_half.py workload/gate-c-h-comp-half.smc
          sha256sum workload/gate-c-h-comp-half.smc | tee workload/guest.sha256

          cp sodium64.z64 wrap/sodium64.z64
          cp rom-converter.py wrap/rom-converter.py
          cp workload/gate-c-h-comp-half.smc wrap/gate-c-h-comp-half.smc
          (cd wrap && python3 rom-converter.py </dev/null)
          test -s wrap/out/gate-c-h-comp-half.z64

          dd if=wrap/out/gate-c-h-comp-half.z64 of=workload/embedded.smc             bs=1 skip=$((0x104000)) count=$((32 * 1024)) status=none
          cmp workload/gate-c-h-comp-half.smc workload/embedded.smc
          rm workload/embedded.smc

      - name: Locate Sodium64 H-COMP state
        shell: bash
        run: |
          set -euo pipefail
          elf=build/sodium64.elf
          symbol() { nm -n "$elf" | awk -v name="$1" '$3 == name { print $1; exit }'; }

          wram=$(symbol wram)
          framebuffer=$(symbol framebuffer)
          cgadsub=$(symbol cgadsub)
          cgwsel=$(symbol cgwsel)
          tm=$(symbol tm)
          ts=$(symbol ts)
          bg_mode=$(symbol bg_mode)
          coldata=$(symbol coldata)

          for value in "$wram" "$framebuffer" "$cgadsub" "$cgwsel" "$tm" "$ts" "$bg_mode" "$coldata"; do
            test -n "$value"
          done

          {
            echo "PHASE_ADDR=0x$(printf '%08x' "$((0x$wram + 1))")"
            echo "FRAMEBUFFER_ADDR=0x$framebuffer"
            echo "CGADSUB_ADDR=0x$cgadsub"
            echo "CGWSEL_ADDR=0x$cgwsel"
            echo "TM_ADDR=0x$tm"
            echo "TS_ADDR=0x$ts"
            echo "BG_MODE_ADDR=0x$bg_mode"
            echo "COLDATA_ADDR=0x$coldata"
          } | tee -a "$GITHUB_ENV"

      - name: Install pinned ares dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             ccache cmake git libgtk-3-dev libgl1-mesa-dri libsdl2-dev             libvulkan1 mesa-vulkan-drivers ninja-build qt6-base-dev unzip xauth xvfb

      - name: Build pinned N64-only ares in valid lab mode
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ares-n64-src"
          git clone --filter=blob:none https://github.com/ares-emulator/ares.git "$root"
          git -C "$root" checkout 17813a3ccda21ab9bd45f09bfc2f91196dbf50ff
          cd "$root"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ares/n64/system/system.cpp')
          s = p.read_text()
          old = 'rsp.recompiler.enabled = value.boolean();'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'rsp.recompiler.enabled = false;', 1))
          PY
          .github/scripts/build_sdl.sh
          cmake --preset ubuntu-ci -DARES_CORES=n64
          cmake --build build --parallel "$(nproc)"
          ares_bin=$(find "$root/build" -type f -name ares -perm -111 | head -n1)
          test -x "$ares_bin"
          echo "ARES_BIN=$ares_bin" >> "$GITHUB_ENV"
          "$ares_bin" --version | tee "$GITHUB_WORKSPACE/ares-n64-version.txt"

      - name: Capture synchronized Sodium64 full-add and half-add frames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p captures
          home="$RUNNER_TEMP/ares-home-h-comp"
          settings="$RUNNER_TEMP/ares-h-comp-settings.bml"
          mkdir -p "$home"

          HOME="$home" SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1             xvfb-run -a stdbuf -oL -eL "$ARES_BIN"               --no-file-prompt               --system "Nintendo 64"               --settings-file "$settings"               --setting "Developer/DebugServerEnabled=true"               --setting "Developer/DebugServerUseIPv4=true"               --setting "Developer/DebugServerPort=9147"               --setting "Developer/HomebrewMode=true"               --setting "Developer/DeterministicEntropy=true"               --setting "Developer/ForceInterpreter=false"               --setting "Boot/AwaitGDBClient=true"               wrap/out/gate-c-h-comp-half.z64               > captures/ares-n64.log 2>&1 &
          pid=$!

          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          python3 scripts/gate_c_h_comp_half_capture_n64.py             --port 9147             --phase-address "$PHASE_ADDR"             --framebuffer-address "$FRAMEBUFFER_ADDR"             --observe "cgadsub:$CGADSUB_ADDR:1"             --observe "cgwsel:$CGWSEL_ADDR:1"             --observe "tm:$TM_ADDR:1"             --observe "ts:$TS_ADDR:1"             --observe "bg_mode:$BG_MODE_ADDR:1"             --observe "coldata:$COLDATA_ADDR:2"             --output-dir captures

          python3 scripts/gate_c_h_comp_half_analyze_fb.py             captures/control.rgba5551 captures/treatment.rgba5551             --output captures/analysis.json | tee captures/analysis.txt

          python3 - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path('captures/state.json').read_text())
          result = json.loads(Path('captures/analysis.json').read_text())

          assert state['control']['phase'] == 0x01, state
          assert state['treatment']['phase'] == 0x41, state
          assert state['control']['cgadsub'] == 0x01, state
          assert state['treatment']['cgadsub'] == 0x41, state
          for phase in ('control', 'treatment'):
              assert state[phase]['cgwsel'] == 0x00, state
              assert state[phase]['tm'] == 0x01, state
              assert state[phase]['ts'] == 0x00, state
              assert state[phase]['bg_mode'] == 0x01, state
              assert state[phase]['coldata'] == 0x0200, state

          assert result['control']['mode_fraction'] >= 0.80, result
          assert result['treatment']['mode_fraction'] >= 0.80, result

          valid = {
              'H_COMP_HALF_FALSIFIED_EXACT_SODIUM64_MATH',
              'H_COMP_HALF_SUPPORTED_NO_HALF_EFFECT',
              'H_COMP_HALF_SUPPORTED_WRONG_ARITHMETIC',
          }
          assert result['classification'] in valid, result
          print('Gate-C H-COMP Sodium64 classification:', result['classification'])
          print('control RGB5:', result['control']['mode_rgb5'])
          print('treatment RGB5:', result['treatment']['mode_rgb5'])
          PY

      - name: Upload Sodium64 H-COMP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-h-comp-half-sodium64-evidence
          retention-days: 30
          path: |
            captures/
            workload/guest.sha256
            ares-n64-version.txt
            sodium64-build.log

  snes-reference-semantic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: diagnostic-build
    steps:
      - name: Checkout Sodium64
        uses: actions/checkout@v4

      - name: Install pinned ares reference dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             ccache cmake git imagemagick libgtk-3-dev libgl1-mesa-dri libsdl2-dev             libvulkan1 mesa-vulkan-drivers ninja-build python3-pil qt6-base-dev             unzip xauth xvfb

      - name: Generate exact original diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reference
          python3 scripts/make_gate_c_h_comp_half.py reference/gate-c-h-comp-half.smc
          sha256sum reference/gate-c-h-comp-half.smc | tee reference/guest.sha256

      - name: Build pinned ares Super Famicom reference
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ares-sfc-src"
          git clone --filter=blob:none https://github.com/ares-emulator/ares.git "$root"
          git -C "$root" checkout 17813a3ccda21ab9bd45f09bfc2f91196dbf50ff
          cd "$root"
          .github/scripts/build_sdl.sh
          cmake --preset ubuntu-ci -DARES_CORES=sfc
          cmake --build build --parallel "$(nproc)"
          ares_bin=$(find "$root/build" -type f -name ares -perm -111 | head -n1)
          test -x "$ares_bin"
          echo "ARES_SFC_BIN=$ares_bin" >> "$GITHUB_ENV"
          "$ares_bin" --version | tee "$GITHUB_WORKSPACE/reference/ares-version.txt"

      - name: Capture direct-SNES alternating phase sequence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reference/frames
          export ROM="$GITHUB_WORKSPACE/reference/gate-c-h-comp-half.smc"
          export FRAME_DIR="$GITHUB_WORKSPACE/reference/frames"
          export ARES_LOG="$GITHUB_WORKSPACE/reference/ares-sfc.log"
          export ARES_SETTINGS="$RUNNER_TEMP/ares-sfc-settings.bml"
          export ARES_HOME="$RUNNER_TEMP/ares-sfc-home"
          mkdir -p "$ARES_HOME"

          xvfb-run -a -s "-screen 0 1024x768x24" bash -c '
            set -euo pipefail
            HOME="$ARES_HOME" SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1               "$ARES_SFC_BIN"                 --no-file-prompt                 --system "Super Famicom"                 --settings-file "$ARES_SETTINGS"                 --setting "Developer/DeterministicEntropy=true"                 "$ROM" > "$ARES_LOG" 2>&1 &
            pid=$!
            trap "kill $pid 2>/dev/null || true; wait $pid 2>/dev/null || true" EXIT
            sleep 1
            for i in $(seq -w 0 23); do
              import -window root "$FRAME_DIR/frame-$i.png"
              sleep 0.25
            done
          '

          test "$(find reference/frames -name 'frame-*.png' | wc -l)" -eq 24

      - name: Analyze pinned direct-SNES half-add semantics
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/gate_c_h_comp_half_analyze_reference.py             reference/frames/frame-*.png             --output reference/analysis.json | tee reference/analysis.txt

          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('reference/analysis.json').read_text())
          print('Gate-C H-COMP direct-SNES classification:', result['classification'])
          if result['classification'] != 'REFERENCE_CONFIRMS_HALF_ADD_TWO_LEVELS':
              raise SystemExit('direct SNES reference did not establish the half-add phase oracle')
          PY

      - name: Upload direct-SNES H-COMP reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-h-comp-half-snes-reference
          retention-days: 30
          path: reference/
