name: Gate C CGRAM RSP Consumer Clean Contract

on:
  push:
    branches:
      - phase4/gate-c-cgram-rsp-consumer-contract-clean
    paths:
      - scripts/test_gate_c_cgram_rsp_consumer_clean_contract.py
      - src/defines.h
      - src/rsp_main.S
      - src/rsp_mode7.S
      - .github/workflows/gate-c-cgram-rsp-consumer-clean-contract.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sodium64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-consumer-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current clean lineage
        uses: actions/checkout@v4

      - name: Checkout exact validated clean producer authority
        uses: actions/checkout@v4
        with:
          ref: 8dce5f45e6278356172b24576053a66ccf5f6daf
          path: producer-reference

      - name: Compile host oracle
        run: python3 -m py_compile scripts/test_gate_c_cgram_rsp_consumer_clean_contract.py

      - name: Prove clean producer to DMA8 consumer compatibility
        run: |
          python3 scripts/test_gate_c_cgram_rsp_consumer_clean_contract.py \
            --producer-root producer-reference \
            --producer-sha 8dce5f45e6278356172b24576053a66ccf5f6daf
