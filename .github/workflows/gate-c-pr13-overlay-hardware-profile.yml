name: Gate C PR13 Real-N64 Overlay Cadence

on:
  push:
    branches:
      - phase4/gate-c-rsp-overlay-hardware-profile
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sodium64-gate-c-overlay-hw-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Install libdragon
        run: npm install -g libdragon

      - name: Checkout Sodium64
        uses: actions/checkout@v4

      - name: Validate deterministic stress and profile decoders
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile             scripts/make_gate_c_obj_window.py             scripts/make_gate_c_mode7_switch.py             scripts/make_gate_c_mode7_thrash.py             scripts/hw_profile_report.py             scripts/profile_report.py
          python3 scripts/test_hw_profile_report.py
          python3 scripts/test_profile_report.py

          mkdir -p diagnostic
          python3 scripts/make_gate_c_mode7_thrash.py diagnostic/overlay-thrash-a.smc
          python3 scripts/make_gate_c_mode7_thrash.py diagnostic/overlay-thrash-b.smc
          cmp diagnostic/overlay-thrash-a.smc diagnostic/overlay-thrash-b.smc
          test "$(stat -c %s diagnostic/overlay-thrash-a.smc)" -eq 32768
          sha256sum diagnostic/overlay-thrash-a.smc | tee diagnostic/guest.sha256

      - name: Build exact uninstrumented PR13 hardware profile
        shell: bash
        run: |
          set -euo pipefail
          libdragon init
          libdragon make HW_PROFILE=1 -j"$(nproc)" 2>&1             | tee overlay-profile-build.log
          test -s sodium64.z64
          test -s build/sodium64.elf
          nm -n build/sodium64.elf | grep -E ' hw_profile_header$'
          nm -n build/sodium64.elf | grep -E ' profile_sample_buffer$'

          python3 scripts/build_metrics.py             --rom sodium64.z64             --elf build/sodium64.elf             --build-dir build             --output overlay-profile-build-metrics.txt
          sha256sum sodium64.z64 build/sodium64.elf             | tee overlay-profile-build.sha256

          grep -F '.text' build/rsp_main.map | head -n5 || true
          grep -F '.text' build/rsp_mode7.map | head -n5 || true

      - name: Wrap exact per-frame overlay stress guest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wrap package
          cp sodium64.z64 wrap/sodium64.z64
          cp rom-converter.py wrap/rom-converter.py
          cp diagnostic/overlay-thrash-a.smc wrap/pr13-overlay-per-frame.smc
          (
            cd wrap
            python3 rom-converter.py </dev/null
          )
          test -s wrap/out/pr13-overlay-per-frame.z64

          dd if=wrap/out/pr13-overlay-per-frame.z64             of=package/embedded.smc bs=1 skip=$((0x104000)) count=$((32 * 1024)) status=none
          cmp diagnostic/overlay-thrash-a.smc package/embedded.smc
          rm package/embedded.smc

          cp wrap/out/pr13-overlay-per-frame.z64 package/pr13-overlay-per-frame-cadence.z64
          cp build/sodium64.elf package/sodium64-pr13-overlay-profile.elf
          cp build/sodium64.map package/sodium64-pr13-overlay-profile.map
          cp build/rsp_main.map package/rsp_main.map
          cp build/rsp_mode7.map package/rsp_mode7.map
          cp scripts/hw_profile_report.py package/hw_profile_report.py
          cp scripts/profile_report.py package/profile_report.py
          cp diagnostic/guest.sha256 package/guest.sha256
          cp overlay-profile-build.log package/overlay-profile-build.log
          cp overlay-profile-build-metrics.txt package/overlay-profile-build-metrics.txt
          cp overlay-profile-build.sha256 package/overlay-profile-build.sha256

          sha256sum             package/pr13-overlay-per-frame-cadence.z64             package/sodium64-pr13-overlay-profile.elf             package/rsp_main.map             package/rsp_mode7.map             package/hw_profile_report.py             package/profile_report.py             | tee package/package.sha256

          cat > package/README.txt <<'EOF'
          Sodium64 PR#13 real-N64 fixed-slot overlay cadence stress

          Run:
              pr13-overlay-per-frame-cadence.z64

          The guest alternates complete Mode1 / Mode7 frames every NMI, forcing
          one renderer-slot overlay transfer per emulated frame. This is an
          intentional worst-case synthetic overlay-DMA stress.

          Leave it running until the screen freezes solid RED. RED means the
          HW_PROFILE SRAM capture was committed; it is not a failure indicator.

          Then extract the SRAM save. Decode first with:
              python3 hw_profile_report.py <save> --snapshot-output profile.bin

          Strict interpretation requires Road-valid settings and >=800 samples.
          Five 60/60 measured windows show that this per-frame overlay stress is
          not throughput-bound on real N64. A deficit is diagnostic for this
          stress and must not be generalized to normal game switching frequency.
          EOF

      - name: Upload real-N64 overlay cadence package
        uses: actions/upload-artifact@v4
        with:
          name: sodium64-pr13-overlay-real-n64-cadence
          retention-days: 30
          path: package/
