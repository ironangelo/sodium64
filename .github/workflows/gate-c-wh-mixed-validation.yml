name: Gate C WH Mixed Rendering Validation

on:
  push:
    branches:
      - phase4/gate-c-h-sample-wh-mixed-validation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sodium64-gate-c-wh-mixed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mixed:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Install libdragon
        run: npm install -g libdragon

      - name: Checkout Sodium64
        uses: actions/checkout@v4

      - name: Validate deterministic mixed guest generator
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/make_gate_c_wh_mixed.py
          rm -rf guest-a guest-b
          python3 scripts/make_gate_c_wh_mixed.py guest-a --only gameplay-window-hdma
          python3 scripts/make_gate_c_wh_mixed.py guest-b --only gameplay-window-hdma
          cmp guest-a/profile-gameplay-window-hdma.smc guest-b/profile-gameplay-window-hdma.smc
          sha256sum guest-a/profile-gameplay-window-hdma.smc | tee mixed-guest-sha256.txt

      - name: Build exact WH-urgent candidate
        shell: bash
        run: |
          set -euo pipefail
          libdragon init
          libdragon make -j"$(nproc)" 2>&1 | tee sodium64-build.log
          test -s sodium64.z64
          test -s build/sodium64.elf

      - name: Generate and wrap mixed rendering plus per-line WH workload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workload wrap
          python3 scripts/make_gate_c_wh_mixed.py workload --only gameplay-window-hdma
          cp workload/profile-gameplay-window-hdma.smc workload/original.smc
          sha256sum workload/original.smc | tee workload/sha256.txt

          cp sodium64.z64 wrap/sodium64.z64
          cp rom-converter.py wrap/rom-converter.py
          cp workload/original.smc wrap/profile-gameplay-window-hdma.smc
          (cd wrap && python3 rom-converter.py </dev/null)
          test -s wrap/out/profile-gameplay-window-hdma.z64

          dd if=wrap/out/profile-gameplay-window-hdma.z64 of=workload/embedded.smc \
            bs=1 skip=$((0x104000)) count=$((32 * 1024)) status=none
          cmp workload/original.smc workload/embedded.smc
          rm workload/embedded.smc

      - name: Locate section and frame-budget state
        shell: bash
        run: |
          set -euo pipefail
          elf=build/sodium64.elf
          symbol() { nm -n "$elf" | awk -v name="$1" '$3 == name { print $1; exit }'; }
          wram=$(symbol wram)
          sect_queues=$(symbol sect_queues)
          section_ptr=$(symbol section_ptr)
          queue_id=$(symbol queue_id)
          precision_set=$(symbol precision_set)
          cur_line=$(symbol cur_line)
          whx=$(symbol whx)
          cooldown=$(symbol cooldown)
          sect_status=$(symbol sect_status)
          fps_native=$(symbol fps_native)
          fps_emulate=$(symbol fps_emulate)
          fps_display=$(symbol fps_display)
          frame_count=$(symbol frame_count)
          skipped_set=$(symbol skipped_set)
          audio_set=$(symbol audio_set)
          apu_clock=$(symbol apu_clock)
          for value in "$wram" "$sect_queues" "$section_ptr" "$queue_id" "$precision_set" \
                       "$cur_line" "$whx" "$cooldown" "$sect_status" "$fps_native" \
                       "$fps_emulate" "$fps_display" "$frame_count" "$skipped_set" \
                       "$audio_set" "$apu_clock"; do
            test -n "$value"
          done
          {
            echo "SECT_QUEUES_ADDR=0x$sect_queues"
            echo "SECTION_PTR_ADDR=0x$section_ptr"
            echo "QUEUE_ID_ADDR=0x$queue_id"
            echo "PRECISION_ADDR=0x$precision_set"
            echo "CUR_LINE_ADDR=0x$cur_line"
            echo "WHX_ADDR=0x$whx"
            echo "COOLDOWN_ADDR=0x$cooldown"
            echo "SECT_STATUS_ADDR=0x$sect_status"
            echo "FRAME_COUNTER_ADDR=0x$(printf '%08x' "$((0x$wram))")"
            echo "PROBE_ADDR=0x$(printf '%08x' "$((0x$wram + 0x100))")"
            echo "FPS_NATIVE_ADDR=0x$fps_native"
            echo "FPS_EMULATE_ADDR=0x$fps_emulate"
            echo "FPS_DISPLAY_ADDR=0x$fps_display"
            echo "FRAME_COUNT_ADDR=0x$frame_count"
            echo "SKIPPED_SET_ADDR=0x$skipped_set"
            echo "PRECISION_SET_ADDR=0x$precision_set"
            echo "AUDIO_SET_ADDR=0x$audio_set"
            echo "APU_CLOCK_ADDR=0x$apu_clock"
          } | tee -a "$GITHUB_ENV"

      - name: Install pinned ares dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache cmake git libgtk-3-dev libgl1-mesa-dri libsdl2-dev \
            libvulkan1 mesa-vulkan-drivers ninja-build qt6-base-dev unzip xauth xvfb

      - name: Build pinned N64-only ares in valid lab mode
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ares-src"
          git clone --filter=blob:none https://github.com/ares-emulator/ares.git "$root"
          git -C "$root" checkout 17813a3ccda21ab9bd45f09bfc2f91196dbf50ff
          cd "$root"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ares/n64/system/system.cpp')
          s = p.read_text()
          old = 'rsp.recompiler.enabled = value.boolean();'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'rsp.recompiler.enabled = false;', 1))
          PY
          .github/scripts/build_sdl.sh
          cmake --preset ubuntu-ci -DARES_CORES=n64
          cmake --build build --parallel "$(nproc)"
          ares_bin=$(find "$root/build" -type f -name ares -perm -111 | head -n1)
          test -x "$ares_bin"
          echo "ARES_BIN=$ares_bin" >> "$GITHUB_ENV"
          "$ares_bin" --version | tee "$GITHUB_WORKSPACE/ares-version.txt"

      - name: Verify mixed workload reaches 224 distinct WH states at MEDIUM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p semantic
          home="$RUNNER_TEMP/ares-home-wh-mixed-semantic"
          settings="$RUNNER_TEMP/ares-wh-mixed-semantic-settings.bml"
          mkdir -p "$home"

          HOME="$home" SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 \
            xvfb-run -a stdbuf -oL -eL "$ARES_BIN" \
              --no-file-prompt \
              --system "Nintendo 64" \
              --settings-file "$settings" \
              --setting "Developer/DebugServerEnabled=true" \
              --setting "Developer/DebugServerUseIPv4=true" \
              --setting "Developer/DebugServerPort=9147" \
              --setting "Developer/HomebrewMode=true" \
              --setting "Developer/DeterministicEntropy=true" \
              --setting "Developer/ForceInterpreter=false" \
              --setting "Boot/AwaitGDBClient=true" \
              wrap/out/profile-gameplay-window-hdma.z64 \
              > semantic/ares-n64.log 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          python3 scripts/gate_c_wh_mixed_capture_n64.py \
            --port 9147 \
            --warmup-seconds 3 \
            --sect-queues-address "$SECT_QUEUES_ADDR" \
            --section-ptr-address "$SECTION_PTR_ADDR" \
            --queue-id-address "$QUEUE_ID_ADDR" \
            --precision-address "$PRECISION_ADDR" \
            --cur-line-address "$CUR_LINE_ADDR" \
            --whx-address "$WHX_ADDR" \
            --cooldown-address "$COOLDOWN_ADDR" \
            --sect-status-address "$SECT_STATUS_ADDR" \
            --frame-counter-address "$FRAME_COUNTER_ADDR" \
            --probe-address "$PROBE_ADDR" \
            --output semantic/capture.json

          python3 - <<'PY' | tee semantic/assertion.txt
          import json
          from pathlib import Path
          c = json.loads(Path('semantic/capture.json').read_text())
          records = []
          for r in c['records']:
              records.append(r)
              if int(r['end_line']) >= 224:
                  break
          wh = sorted(set(int(r['wh0']) for r in records))
          ends = [int(r['end_line']) for r in records]
          result = {
              "precision_set": int(c["precision_set"]),
              "record_count": len(records),
              "unique_wh0_count": len(wh),
              "unique_wh0_exact_0_to_223": wh == list(range(224)),
              "final_section_seen": bool(ends and ends[-1] >= 224),
              "max_end_line_step": max(
                  (b - a for a, b in zip(ends, ends[1:])), default=0
              ),
          }
          Path('semantic/result.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n'
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          assert result["precision_set"] == 8, result
          assert result["unique_wh0_exact_0_to_223"], result
          assert result["final_section_seen"], result
          assert result["max_end_line_step"] <= 1, result
          PY

          cleanup
          trap - EXIT

      - name: Measure virtual N64 frame budget under mixed rendering + 224-line WH stress
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p budget
          home="$RUNNER_TEMP/ares-home-h-sample-budget"
          settings="$RUNNER_TEMP/ares-h-sample-budget-settings.bml"
          mkdir -p "$home"

          HOME="$home" SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 \
            xvfb-run -a stdbuf -oL -eL "$ARES_BIN" \
              --no-file-prompt \
              --system "Nintendo 64" \
              --settings-file "$settings" \
              --setting "Developer/DebugServerEnabled=true" \
              --setting "Developer/DebugServerUseIPv4=true" \
              --setting "Developer/DebugServerPort=9148" \
              --setting "Developer/HomebrewMode=true" \
              --setting "Developer/DeterministicEntropy=true" \
              --setting "Developer/ForceInterpreter=false" \
              --setting "Boot/AwaitGDBClient=true" \
              wrap/out/profile-gameplay-window-hdma.z64 \
              > budget/ares-n64.log 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          python3 scripts/gdb_rsp_dump.py \
            --port 9148 \
            --connect-timeout 45 \
            --response-timeout 60 \
            --warmup-seconds 1 \
            --write "$APU_CLOCK_ADDR:15" \
            --write "$SKIPPED_SET_ADDR:00" \
            --write "$AUDIO_SET_ADDR:04" \
            --write "$PRECISION_SET_ADDR:08" \
            --settle-seconds 1 \
            --after-settle-write "$FPS_NATIVE_ADDR:00" \
            --after-settle-write "$FPS_EMULATE_ADDR:00" \
            --after-settle-write "$FPS_DISPLAY_ADDR:ff" \
            --run-seconds 5 \
            --observe "fps_display:$FPS_DISPLAY_ADDR:1" \
            --observe "fps_native:$FPS_NATIVE_ADDR:1" \
            --observe "fps_emulate:$FPS_EMULATE_ADDR:1" \
            --observe "frame_count:$FRAME_COUNT_ADDR:1" \
            --observe "skipped_set:$SKIPPED_SET_ADDR:1" \
            --observe "apu_clock:$APU_CLOCK_ADDR:1" \
            --observe "audio_set:$AUDIO_SET_ADDR:1" \
            --observe "precision_set:$PRECISION_SET_ADDR:1" \
            --state-output budget/state.json \
            --address "$FPS_DISPLAY_ADDR" \
            --size 1 \
            --output budget/fps-display.bin \
            | tee budget/gdb.log

      - name: Assert Road-valid virtual frame budget
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/frame_budget_report.py \
            budget/state.json \
            --target-fps 60 \
            --output budget/frame-budget.md
          cat budget/frame-budget.md
          python3 - <<'PY' | tee budget/assertion.txt
          import json
          from pathlib import Path
          state = json.loads(Path('budget/state.json').read_text())
          o = state['observations']
          assert o['skipped_set'] == 0, o
          assert o['apu_clock'] == 21, o
          assert o['audio_set'] == 4, o
          assert o['precision_set'] == 8, o
          assert o['fps_display'] != 0xFF, o
          if o['fps_display'] < 60:
              raise SystemExit(f"WH mixed rendering virtual budget below target: {o}")
          print(
              "Gate-C WH mixed rendering virtual budget PASS: "
              f"fps_display={o['fps_display']}/60 "
              f"partial_vi={o['fps_native']}/60 "
              f"partial_guest={o['fps_emulate']} queue={o['frame_count']} "
              f"precision={o['precision_set']}"
          )
          PY

      - name: Upload mixed WH rendering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-wh-mixed-rendering-evidence
          retention-days: 30
          path: |
            semantic/
            budget/
            ares-version.txt
            sodium64-build.log
            mixed-guest-sha256.txt
            workload/original.smc
            workload/sha256.txt
