name: Gate C CGRAM DMA8 RSP Consumer

on:
  push:
    branches:
      - phase4/gate-c-cgram-epoch-rsp-consumer-dma8
    paths:
      - src/defines.h
      - src/rsp_main.S
      - src/rsp_mode7.S
      - src/main.S
      - src/ppu.S
      - scripts/test_gate_c_cgram_epoch_contract.py
      - scripts/test_gate_c_cgram_rsp_consumer_contract.py
      - scripts/test_gate_c_cgram_rsp_consumer_impl.py
      - .github/workflows/gate-c-cgram-rsp-consumer-impl.yml
  workflow_dispatch:

concurrency:
  group: sodium64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cgram-dma8-rsp-consumer:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Install libdragon
        run: npm install -g libdragon

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prove source/model contract
        run: python3 scripts/test_gate_c_cgram_rsp_consumer_impl.py

      - name: Build exact candidate
        shell: bash
        run: |
          set -euo pipefail
          libdragon init
          libdragon make -j$(nproc) 2>&1 | tee consumer-build.log
          readelf -sW build/src/rsp_main.elf | awk '$8=="draw_bg" || $8=="draw_obj" {print $2, $8}' > rsp-main.sym
          readelf -sW build/src/rsp_mode7.elf | awk '$8=="draw_bg" || $8=="draw_obj" {print $2, $8}' > rsp-mode7.sym
          test "$(wc -l < rsp-main.sym)" -eq 2
          test "$(wc -l < rsp-mode7.sym)" -eq 2

      - name: Prove binary layout
        run: |
          python3 scripts/test_gate_c_cgram_rsp_consumer_impl.py \
            --maps build/rsp_main.map build/rsp_mode7.map \
            --symbols rsp-main.sym rsp-mode7.sym

      - name: Record hashes
        run: |
          sha256sum sodium64.z64 build/sodium64.elf build/src/rsp_main.elf build/src/rsp_mode7.elf | tee consumer-hashes.txt

      - name: Upload consumer proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-cgram-dma8-rsp-consumer
          retention-days: 30
          path: |
            consumer-build.log
            consumer-hashes.txt
            rsp-main.sym
            rsp-mode7.sym
            build/rsp_main.map
            build/rsp_mode7.map
            build/src/rsp_main.elf
            build/src/rsp_mode7.elf
            build/sodium64.elf
            sodium64.z64
