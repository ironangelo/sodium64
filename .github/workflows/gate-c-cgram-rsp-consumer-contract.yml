name: Gate C CGRAM RSP Consumer Contract

on:
  push:
    branches:
      - phase4/gate-c-cgram-epoch-rsp-consumer-contract
    paths:
      - scripts/test_gate_c_cgram_epoch_contract.py
      - scripts/test_gate_c_cgram_rsp_consumer_contract.py
      - src/rsp_main.S
      - src/rsp_mode7.S
      - src/ppu.S
      - .github/workflows/gate-c-cgram-rsp-consumer-contract.yml
  workflow_dispatch:

concurrency:
  group: sodium64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cgram-rsp-consumer-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile host oracle
        run: |
          python3 -m py_compile scripts/test_gate_c_cgram_epoch_contract.py
          python3 -m py_compile scripts/test_gate_c_cgram_rsp_consumer_contract.py

      - name: Prove capacity-safe typed CGRAM consumer
        run: python3 scripts/test_gate_c_cgram_rsp_consumer_contract.py
