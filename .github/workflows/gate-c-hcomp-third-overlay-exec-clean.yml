name: Gate C H-COMP Third Overlay Exec Clean

on:
  push:
    branches:
      - phase4/gate-c-hcomp-third-overlay-exec-clean
    paths:
      - src/defines.h
      - src/main.S
      - src/rsp_main.S
      - src/rsp_mode7.S
      - src/rsp_hcomp.S
      - scripts/test_gate_c_hcomp_third_overlay_exec_clean.py
      - .github/workflows/gate-c-hcomp-third-overlay-exec-clean.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sodium64-gate-c-hcomp-third-overlay-exec-clean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  executable-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: latest
      - name: Install libdragon
        run: npm install -g libdragon
      - uses: actions/checkout@v4
      - name: Prove source contract
        run: |
          python3 -m py_compile scripts/test_gate_c_hcomp_third_overlay_exec_clean.py
          python3 scripts/test_gate_c_hcomp_third_overlay_exec_clean.py
      - name: Build and prove exact binary layout
        shell: bash
        run: |
          set -euo pipefail
          libdragon init
          libdragon make -j"$(nproc)" 2>&1 | tee exec-clean-build.log
          readelf -sW build/src/rsp_main.elf > rsp-main.syms
          readelf -sW build/src/rsp_mode7.elf > rsp-mode7.syms
          readelf -sW build/src/rsp_hcomp.elf > rsp-hcomp.syms
          python3 scripts/test_gate_c_hcomp_third_overlay_exec_clean.py             --maps build/rsp_main.map build/rsp_mode7.map build/rsp_hcomp.map             --symbols rsp-main.syms rsp-mode7.syms rsp-hcomp.syms
          python3 scripts/check_rsp_branch_delay_slots.py             build/src/rsp_main.elf build/src/rsp_mode7.elf build/src/rsp_hcomp.elf             | tee exec-clean-delay-slots.txt
          sha256sum sodium64.z64 build/sodium64.elf             build/src/rsp_main.elf build/src/rsp_mode7.elf build/src/rsp_hcomp.elf             | tee exec-clean-runtime.sha256
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-hcomp-third-overlay-exec-clean
          retention-days: 30
          path: |
            exec-clean-build.log
            exec-clean-delay-slots.txt
            exec-clean-runtime.sha256
            build/rsp_main.map
            build/rsp_mode7.map
            build/rsp_hcomp.map
            rsp-main.syms
            rsp-mode7.syms
            rsp-hcomp.syms
