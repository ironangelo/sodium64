name: Gate B Nova2 Audition

on:
  push:
    branches:
      - phase3/gate-b-nova2-audition
    paths:
      - '.github/workflows/gate-b-nova2-audition.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sodium64-gate-b-nova2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-build-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      NOVA_REPO: https://github.com/NovaSquirrel/NovaTheSquirrel2.git
      NOVA_SHA: 94385f1812f3b322f939f79a29502a1a3ee6d87f

    steps:
      - name: Checkout Sodium64
        uses: actions/checkout@v4

      - name: Reproduce upstream-era Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install pinned-source build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cc65 \
            git \
            lz4
          # The 2023 palette generator relies on the padded getpalette()
          # 2020-era behavior matching the generator's last source change.
          python3 -m pip install --disable-pip-version-check 'Pillow==7.1.2'

      - name: Checkout exact Nova the Squirrel 2 source
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/nova-the-squirrel-2"
          git clone --filter=blob:none "$NOVA_REPO" "$root"
          git -C "$root" checkout --detach "$NOVA_SHA"
          test "$(git -C "$root" rev-parse HEAD)" = "$NOVA_SHA"
          echo "NOVA_ROOT=$root" >> "$GITHUB_ENV"

      - name: Inspect source palette encoding
        shell: bash
        run: |
          set -euo pipefail
          cd "$NOVA_ROOT"
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import struct

          def plte_entries(path):
              data = path.read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n"
              p = 8
              while p + 12 <= len(data):
                  n = struct.unpack(">I", data[p:p+4])[0]
                  typ = data[p+4:p+8]
                  if typ == b"PLTE":
                      return n // 3
                  p += 12 + n
              return None

          files = sorted(Path("palettes").glob("*.png"))
          print(f"regular_palette_files={len(files)}")
          short = []
          for path in files:
              with Image.open(path) as im:
                  pal = im.getpalette()
                  plen = 0 if pal is None else len(pal) // 3
                  plte = plte_entries(path)
                  print(f"{path}: mode={im.mode} png_plte_entries={plte} pillow_palette_entries={plen}")
                  if plte is None or plte < 16:
                      short.append((str(path), plte, plen))
          print("short_regular_palettes=", short)
          PY

      - name: Build unmodified game from pinned source
        shell: bash
        run: |
          set -euo pipefail
          root="$NOVA_ROOT"

          # The upstream Linux rule for this generated helper omits libm even
          # though gssbrr.c uses sin/cos/floor. Build the exact upstream helper
          # source with the required system math library, without editing source.
          gcc "$root/audio/brr/gssbrr.c" -lm -o "$root/audio/brr/gssbrr"

          # The upstream default target launches an emulator after building.
          # Build only the ROM target so the proof stays autonomous/headless.
          mkdir -p "$root/obj/snes"
          make -C "$root" -j"$(nproc)" nova-the-squirrel-2.sfc 2>&1 | tee nova2-build.log

          rom="$root/nova-the-squirrel-2.sfc"
          test -s "$rom"

          # Generated products may be untracked/ignored, but the build must not
          # require mutating any tracked source or asset.
          git -C "$root" diff --check
          test -z "$(git -C "$root" diff --name-only)"

          sha256sum "$rom" | tee nova2-rom.sha256
          {
            echo "upstream_repo=$NOVA_REPO"
            echo "upstream_sha=$NOVA_SHA"
            echo "rom_size=$(stat -c '%s' "$rom")"
            echo "rom_sha256=$(sha256sum "$rom" | awk '{print $1}')"
            echo "ca65_version=$(ca65 --version 2>&1 | head -n1)"
            echo "ld65_version=$(ld65 --version 2>&1 | head -n1)"
            echo "lz4_version=$(lz4 --version 2>&1 | head -n1)"
            echo "python_version=$(python3 --version 2>&1)"
            echo "pillow_version=$(python3 -c 'import PIL; print(PIL.__version__)')"
            echo "gssbrr_bootstrap=gcc exact upstream source with -lm; no source edit"
            echo "asset_boundary=assets used only to build this upstream game; no ROM/assets uploaded"
          } | tee nova2-provenance.txt

      - name: Upload source-build provenance
        uses: actions/upload-artifact@v4
        with:
          name: gate-b-nova2-source-build-proof
          retention-days: 14
          path: |
            nova2-rom.sha256
            nova2-provenance.txt
            nova2-build.log

      - name: Create deterministic Nova2 hubworld walking benchmark
        shell: bash
        run: |
          set -euo pipefail
          root="$NOVA_ROOT"

          python3 - <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ["NOVA_ROOT"])

          main = root / "src/main.s"
          text = main.read_text()
          old = "\n".join([
              "  .import OpenOverworld",
              "  seta8",
              "  lda #2*16",
              "  sta OverworldPlayerX",
              "  lda #10*16",
              "  sta OverworldPlayerY",
              "  stz OverworldMap",
              "  stz OverworldDirection",
              "  jml OpenOverworld",
              "",
          ])
          new = "\n".join([
              "  ; SODIUM64 GATE-B NOVA2 BENCHMARK:",
              "  ; Enter the authored hubworld directly.  This skips only overworld/menu",
              "  ; routing; hubworld initialization, PPU setup, rendering and frame pacing",
              "  ; remain the game's own code.",
              "  .import OpenHubworld",
              "  jml OpenHubworld",
              "",
          ])
          if text.count(old) != 1:
              raise SystemExit(f"src/main.s benchmark anchor count={text.count(old)}")
          main.write_text(text.replace(old, new, 1))

          hub = root / "src/hubworld.s"
          text = hub.read_text()
          old = "\n".join([
              "  lda keydown",
              "  sta keylast",
              "  lda JOY1CUR",
              "  sta keydown",
              "",
          ])
          new = "\n".join([
              "  lda keydown",
              "  sta keylast",
              "  ; SODIUM64 GATE-B NOVA2 BENCHMARK:",
              "  ; deterministic normal hubworld input: hold Right continuously.",
              "  ; This exercises player drawing, scrolling, row/column map updates,",
              "  ; VRAM/OAM DMA and WaitVblank without writing position/camera state.",
              "  lda #KEY_RIGHT",
              "  sta keydown",
              "",
          ])
          if text.count(old) != 1:
              raise SystemExit(f"src/hubworld.s input anchor count={text.count(old)}")
          hub.write_text(text.replace(old, new, 1))
          PY

          git -C "$root" diff --check
          changed="$(git -C "$root" diff --name-only)"
          test "$(printf '%s\n' "$changed" | wc -l)" -eq 2
          printf '%s\n' "$changed" | grep -Fxq 'src/main.s'
          printf '%s\n' "$changed" | grep -Fxq 'src/hubworld.s'

          git -C "$root" diff -- src/main.s src/hubworld.s | tee nova2-hubworld-benchmark.patch

          make -C "$root" -j"$(nproc)" nova-the-squirrel-2.sfc 2>&1 | tee nova2-hubworld-build.log
          rom="$root/nova-the-squirrel-2.sfc"
          test -s "$rom"

          {
            echo "upstream_sha=$NOVA_SHA"
            echo "benchmark=authored Nova2 hubworld, deterministic continuous Right input"
            echo "modified_files=src/main.s,src/hubworld.s"
            echo "benchmark_rom_size=$(stat -c '%s' "$rom")"
            echo "benchmark_rom_sha256=$(sha256sum "$rom" | awk '{print $1}')"
            echo "benchmark_patch_sha256=$(sha256sum nova2-hubworld-benchmark.patch | awk '{print $1}')"
            echo "preserved=hubworld initialization, PPU setup, player drawing, camera, row/column rendering, OAM/VRAM DMA, WaitVblank"
            echo "disabled=overworld/menu routing only; physical controller input replaced with deterministic Right"
            echo "scope_limit=no authored collision/enemy route and no active game audio at this upstream revision"
          } | tee nova2-hubworld-provenance.txt

      - name: Setup Node.js for Sodium64 profile build
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Build Sodium64 PROFILE runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install -g libdragon
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          libdragon init
          libdragon make PROFILE=1 -j"$(nproc)" 2>&1 | tee profile-build.log
          test -s sodium64.z64
          test -s build/sodium64.elf

      - name: Install ares lab dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            ccache \
            cmake \
            curl \
            libgtk-3-dev \
            libgl1-mesa-dri \
            libsdl2-dev \
            libvulkan1 \
            mesa-vulkan-drivers \
            ninja-build \
            qt6-base-dev \
            unzip \
            xauth \
            xvfb

      - name: Restore ares compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ares-n64-ccache-${{ runner.os }}-${{ runner.arch }}-17813a3ccda21ab9bd45f09bfc2f91196dbf50ff-rsp-interpreter-v1

      - name: Build pinned N64-only ares in valid lab mode
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ares-src"
          git clone --filter=blob:none https://github.com/ares-emulator/ares.git "$root"
          git -C "$root" checkout 17813a3ccda21ab9bd45f09bfc2f91196dbf50ff
          cd "$root"

          python3 - <<'PY'
          from pathlib import Path
          p = Path('ares/n64/system/system.cpp')
          s = p.read_text()
          old = 'rsp.recompiler.enabled = value.boolean();'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'rsp.recompiler.enabled = false;', 1))
          PY

          ccache --zero-stats
          .github/scripts/build_sdl.sh
          cmake --preset ubuntu-ci -DARES_CORES=n64
          cmake --build build --parallel "$(nproc)"
          ccache --show-stats
          ares_bin=$(find "$root/build" -type f -name ares -perm -111 | head -n1)
          test -n "$ares_bin"
          test -x "$ares_bin"
          echo "ARES_BIN=$ares_bin" >> "$GITHUB_ENV"
          "$ares_bin" --version | tee "$GITHUB_WORKSPACE/ares-version.txt"

      - name: Wrap Nova2 benchmark locally without publishing ROM bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workloads/ares
          cp sodium64.z64 workloads/ares/sodium64.z64
          cp rom-converter.py workloads/ares/rom-converter.py
          cp "$NOVA_ROOT/nova-the-squirrel-2.sfc" workloads/ares/profile-nova2.smc
          (
            cd workloads/ares
            python3 rom-converter.py </dev/null
          )
          test -s workloads/ares/out/profile-nova2.z64

      - name: Locate Sodium64 profiling and frame-budget state
        shell: bash
        run: |
          set -euo pipefail
          elf="build/sodium64.elf"
          symbol() {
            nm -n "$elf" | awk -v name="$1" '$3 == name { print $1; exit }'
          }

          magic=$(symbol profile_magic)
          end=$(symbol profile_sample_buffer_end)
          buffer=$(symbol profile_sample_buffer)
          write_ptr=$(symbol profile_write_ptr)
          sample_count=$(symbol profile_sample_count)
          last_epc=$(symbol profile_last_epc)
          apu_clock=$(symbol apu_clock)
          jit_lookup=$(symbol jit_lookup)
          jit_pointer=$(symbol jit_pointer)
          fps_native=$(symbol fps_native)
          fps_emulate=$(symbol fps_emulate)
          fps_display=$(symbol fps_display)
          frame_count=$(symbol frame_count)
          skipped_set=$(symbol skipped_set)
          precision_set=$(symbol precision_set)
          audio_set=$(symbol audio_set)

          for value in \
            "$magic" "$end" "$buffer" "$write_ptr" "$sample_count" \
            "$last_epc" "$apu_clock" "$jit_lookup" "$jit_pointer" \
            "$fps_native" "$fps_emulate" "$fps_display" "$frame_count" \
            "$skipped_set" "$precision_set" "$audio_set"; do
            test -n "$value"
          done

          size=$((0x$end - 0x$magic))
          jit_lookup_size=$((0x$jit_pointer - 0x$jit_lookup))
          test "$size" -gt 16384
          test "$jit_lookup_size" -eq 262144

          buffer_hex=$(printf '%08x' "$((0x$buffer))")
          rom_buffer=$(awk '$1 == "#define" && $2 == "ROM_BUFFER" { print $3; exit }' src/defines.h)
          test -n "$rom_buffer"
          jit_buffer=$((rom_buffer - 0x40000))
          jit_buffer_hex=$(printf '%08x' "$jit_buffer")

          {
            echo "ARES_PROFILE_ADDR=$magic"
            echo "ARES_PROFILE_SIZE=$size"
            echo "ARES_PROFILE_BUFFER_HEX=$buffer_hex"
            echo "ARES_PROFILE_WRITE_PTR_ADDR=$write_ptr"
            echo "ARES_PROFILE_SAMPLE_COUNT_ADDR=$sample_count"
            echo "ARES_PROFILE_LAST_EPC_ADDR=$last_epc"
            echo "ARES_APU_CLOCK_ADDR=$apu_clock"
            echo "ARES_JIT_LOOKUP_ADDR=$jit_lookup"
            echo "ARES_JIT_LOOKUP_SIZE=$jit_lookup_size"
            echo "ARES_JIT_POINTER_ADDR=$jit_pointer"
            echo "ARES_JIT_BUFFER_HEX=$jit_buffer_hex"
            echo "ARES_FPS_NATIVE_ADDR=$fps_native"
            echo "ARES_FPS_EMULATE_ADDR=$fps_emulate"
            echo "ARES_FPS_DISPLAY_ADDR=$fps_display"
            echo "ARES_FRAME_COUNT_ADDR=$frame_count"
            echo "ARES_SKIPPED_SET_ADDR=$skipped_set"
            echo "ARES_PRECISION_SET_ADDR=$precision_set"
            echo "ARES_AUDIO_SET_ADDR=$audio_set"
          } >> "$GITHUB_ENV"

      - name: Run first Sodium64 Nova2 hubworld audition
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p profiles

          label="nova2-hubworld-r1"
          rom="workloads/ares/out/profile-nova2.z64"
          home="$RUNNER_TEMP/ares-home-$label"
          settings="$RUNNER_TEMP/ares-settings-$label.bml"
          emulator_log="profiles/$label-emulator.log"
          gdb_log="profiles/$label-gdb.log"
          snapshot="profiles/$label.bin"
          report="profiles/$label.txt"
          json="profiles/$label.json"
          state="profiles/$label-state.json"
          mkdir -p "$home"

          HOME="$home" SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 \
            xvfb-run -a stdbuf -oL -eL "$ARES_BIN" \
              --no-file-prompt \
              --system "Nintendo 64" \
              --settings-file "$settings" \
              --setting "Developer/DebugServerEnabled=true" \
              --setting "Developer/DebugServerUseIPv4=true" \
              --setting "Developer/DebugServerPort=9140" \
              --setting "Developer/HomebrewMode=true" \
              --setting "Developer/DeterministicEntropy=true" \
              --setting "Developer/ForceInterpreter=false" \
              --setting "Boot/AwaitGDBClient=true" \
              "$rom" \
              > "$emulator_log" 2>&1 &
          ares_pid=$!

          cleanup_run() {
            kill "$ares_pid" 2>/dev/null || true
            wait "$ares_pid" 2>/dev/null || true
          }
          trap cleanup_run EXIT

          if ! python3 scripts/gdb_rsp_dump.py \
            --port 9140 \
            --connect-timeout 45 \
            --response-timeout 60 \
            --warmup-seconds 1 \
            --zero "0x$ARES_JIT_LOOKUP_ADDR:$ARES_JIT_LOOKUP_SIZE" \
            --write "0x$ARES_APU_CLOCK_ADDR:15" \
            --write "0x$ARES_JIT_POINTER_ADDR:$ARES_JIT_BUFFER_HEX" \
            --write "0x$ARES_SKIPPED_SET_ADDR:00" \
            --write "0x$ARES_AUDIO_SET_ADDR:04" \
            --write "0x$ARES_PRECISION_SET_ADDR:08" \
            --settle-seconds 1 \
            --after-settle-write "0x$ARES_PROFILE_SAMPLE_COUNT_ADDR:00000000" \
            --after-settle-write "0x$ARES_PROFILE_WRITE_PTR_ADDR:$ARES_PROFILE_BUFFER_HEX" \
            --after-settle-write "0x$ARES_PROFILE_LAST_EPC_ADDR:00000000" \
            --after-settle-write "0x$ARES_FPS_NATIVE_ADDR:00" \
            --after-settle-write "0x$ARES_FPS_EMULATE_ADDR:00" \
            --after-settle-write "0x$ARES_FPS_DISPLAY_ADDR:ff" \
            --run-seconds 3 \
            --sample-count-address "0x$ARES_PROFILE_SAMPLE_COUNT_ADDR" \
            --min-samples 800 \
            --max-run-seconds 60 \
            --observe "fps_display:0x$ARES_FPS_DISPLAY_ADDR:1" \
            --observe "fps_native:0x$ARES_FPS_NATIVE_ADDR:1" \
            --observe "fps_emulate:0x$ARES_FPS_EMULATE_ADDR:1" \
            --observe "frame_count:0x$ARES_FRAME_COUNT_ADDR:1" \
            --observe "skipped_set:0x$ARES_SKIPPED_SET_ADDR:1" \
            --observe "apu_clock:0x$ARES_APU_CLOCK_ADDR:1" \
            --observe "audio_set:0x$ARES_AUDIO_SET_ADDR:1" \
            --observe "precision_set:0x$ARES_PRECISION_SET_ADDR:1" \
            --state-output "$state" \
            --address "0x$ARES_PROFILE_ADDR" \
            --size "$ARES_PROFILE_SIZE" \
            --output "$snapshot" \
            > "$gdb_log" 2>&1; then
            cat "$gdb_log"
            tail -200 "$emulator_log" || true
            exit 1
          fi

          cat "$gdb_log"
          cleanup_run
          trap - EXIT

          python3 scripts/profile_report.py \
            "$snapshot" build/sodium64.elf \
            --nm nm --map build/sodium64.map \
            --json-output "$json" | tee "$report"

          samples=$(awk '/total samples:/ { print $3 }' "$report")
          test -n "$samples"
          test "$samples" -ge 800

          python3 - <<'PY'
          import json
          state = json.load(open("profiles/nova2-hubworld-r1-state.json"))
          obs = state["observations"]
          assert int(obs["skipped_set"]) == 0, obs
          assert int(obs["apu_clock"]) == 21, obs
          assert int(obs["audio_set"]) == 4, obs
          assert int(obs["precision_set"]) == 8, obs
          PY

      - name: Summarize first Nova2 audition
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/profile_matrix.py \
            profiles/nova2-hubworld-r1.json \
            --output profiles/nova2-hubworld-profile.md

          python3 scripts/frame_budget_report.py \
            profiles/nova2-hubworld-r1-state.json \
            --target-fps 60 \
            --output profiles/nova2-hubworld-frame-budget.md

          {
            echo '### Gate-B Nova2 first hubworld audition'
            echo
            echo '- Pinned upstream Nova2 source; benchmark changes only entry routing and deterministic controller input.'
            echo '- Route: authored hubworld, continuous Right; player/camera state is not directly written.'
            echo '- Exercises player drawing, scrolling, row/column map updates, OAM/VRAM DMA and WaitVblank.'
            echo '- This is a discovery workload, not yet a full-level compatibility or direct-SNES equivalence claim.'
            echo '- R4300 JIT + RSP interpreter due the documented ares RSP-JIT LAB LIMITATION.'
            echo '- Frameskip 0; APU clock 21; audio 4; precision 8.'
            echo
            cat profiles/nova2-hubworld-profile.md
            echo
            cat profiles/nova2-hubworld-frame-budget.md
            echo
            echo '> ares host-lab throughput is not real-N64 FPS authority.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload non-ROM Nova2 audition diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-b-nova2-hubworld-audition
          retention-days: 14
          if-no-files-found: ignore
          path: |
            ares-version.txt
            profile-build.log
            nova2-hubworld-benchmark.patch
            nova2-hubworld-provenance.txt
            nova2-hubworld-build.log
            profiles/
