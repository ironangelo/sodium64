name: PR44 aligned VI comparison
on:
  push:
    branches: [local/ci-pr44-aligned-vi]
permissions:
  contents: read
jobs:
  aligned-vi:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare the two immutable source trees
        run: |
          git worktree add --detach "$RUNNER_TEMP/master" b012b6b665ede6a9c537bf0e491dfdb8867835e1
          git worktree add --detach "$RUNNER_TEMP/candidate" 027a1233fbfa9dbdddecb1709a6695dddb5d8c75
      - name: Build and wrap the original synthetic workload
        shell: bash
        run: |
          set -euo pipefail
          source scripts/setup_n64_ci.sh
          for label in master candidate; do
            root="$RUNNER_TEMP/$label"
            make -C "$root" PROFILE=1 -j"$(nproc)"
            python3 scripts/make_profile_workloads.py "$root"
            (cd "$root" && python3 rom-converter.py </dev/null)
          done
          cmp "$RUNNER_TEMP/master/profile-gameplay-balanced.smc" "$RUNNER_TEMP/candidate/profile-gameplay-balanced.smc"
      - name: Install ares build and virtual-display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache \
            cmake \
            git \
            libgtk-3-dev \
            libgl1-mesa-dri \
            libsdl2-dev \
            libvulkan1 \
            mesa-vulkan-drivers \
            ninja-build \
            qt6-base-dev \
            xauth \
            xvfb

      - name: Restore ares compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ares-n64-ccache-${{ runner.os }}-${{ runner.arch }}-17813a3ccda21ab9bd45f09bfc2f91196dbf50ff-rsp-interpreter-v1

      - name: Build pinned N64-only ares
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ares-src"
          git clone --filter=blob:none https://github.com/ares-emulator/ares.git "$root"
          git -C "$root" checkout 17813a3ccda21ab9bd45f09bfc2f91196dbf50ff
          cd "$root"

          # LAB LIMITATION: the pinned ares RSP recompiler deadlocks Sodium64's
          # VRAM semaphore path under gameplay-balanced. The controlled 2x2 run
          # 35113184294 proved that CPU-JIT + RSP-interpreter is good (60/60),
          # while every mode with RSP JIT enabled collapses. Keep the R4300 JIT
          # for profiling density but force only the RSP to its interpreter.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ares/n64/system/system.cpp')
          s = p.read_text()
          old = 'rsp.recompiler.enabled = value.boolean();'
          assert old in s
          p.write_text(s.replace(old, 'rsp.recompiler.enabled = false;', 1))
          PY

          ccache --zero-stats
          .github/scripts/build_sdl.sh
          cmake --preset ubuntu-ci -DARES_CORES=n64
          cmake --build build --parallel "$(nproc)"
          ccache --show-stats
          ares_bin=$(find "$root/build" -type f -name ares -perm -111 | head -n1)
          test -n "$ares_bin"
          test -x "$ares_bin"
          echo "ARES_BIN=$ares_bin" >> "$GITHUB_ENV"
          "$ares_bin" --version | tee "$GITHUB_WORKSPACE/ares-version.txt"

      - name: Sample the same 60-VI boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aligned
          port=9139
          force_interpreter=false
          for label in master candidate candidate-repeat master-repeat; do
            variant="${label%-repeat}"
            root="$RUNNER_TEMP/$variant"
            rom="$root/out/profile-gameplay-balanced.z64"
            settings="$RUNNER_TEMP/ares-settings-$label.bml"
            home="$RUNNER_TEMP/ares-home-$label"
            emulator_log="aligned/$label-ares.log"
            mkdir -p "$home"
            HOME="$home" SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 \
              xvfb-run -a stdbuf -oL -eL "$ARES_BIN" \
                --no-file-prompt \
                --system "Nintendo 64" \
                --settings-file "$settings" \
                --setting "Developer/DebugServerEnabled=true" \
                --setting "Developer/DebugServerUseIPv4=true" \
                --setting "Developer/DebugServerPort=$port" \
                --setting "Developer/HomebrewMode=true" \
                --setting "Developer/DeterministicEntropy=true" \
                --setting "Developer/ForceInterpreter=$force_interpreter" \
                --setting "Boot/AwaitGDBClient=true" \
                "$rom" \
                > "$emulator_log" 2>&1 &
            ares_pid=$!

            trap 'kill "$ares_pid" 2>/dev/null || true; wait "$ares_pid" 2>/dev/null || true' EXIT
            python3 scripts/measure_pr44_aligned_vi.py --port "$port" \
              --elf "$root/build/sodium64.elf" --output "aligned/$label.json"
            kill "$ares_pid" 2>/dev/null || true
            wait "$ares_pid" 2>/dev/null || true
            trap - EXIT
            port=$((port + 1))
          done
          cat aligned/*.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr44-aligned-vi
          path: aligned/
