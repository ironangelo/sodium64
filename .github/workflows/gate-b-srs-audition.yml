name: Gate B SRS v5 Matched

on:
  push:
    branches:
      - phase3/gate-b-srs-v5-matched
    paths:
      - '.github/workflows/gate-b-srs-audition.yml'
      - 'src/main.S'
      - 'src/profile.S'
      - 'scripts/gdb_matched_srs.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sodium64-gate-b-srs-v5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-build-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      SRS_REPO: https://github.com/undisbeliever/space-rescue-squad.git
      SRS_SHA: e08333a6cbdf5ac5f9e8deb052fe6a9fd9a54865
      BASS_SHA: 9db6088a378061afc7b82f50997a5b9a1d951175
      UNTECH_EDITOR_SHA: 4c72dc69619c0c246aa7e6325b18b6fb3c219821
      TAD_SHA: 17823e5a55893e8442917abadb4e84feb216e5ad

    steps:
      - name: Checkout Sodium64
        uses: actions/checkout@v4

      - name: Install pinned-source build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            libgl1-mesa-dev \
            libmsgsl-dev \
            libsdl2-dev \
            ninja-build \
            python3

      - name: Checkout exact Space Rescue Squad source and submodules
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/space-rescue-squad"
          git clone --filter=blob:none "$SRS_REPO" "$root"
          git -C "$root" checkout --detach "$SRS_SHA"
          git -C "$root" submodule update --init --recursive

          test "$(git -C "$root" rev-parse HEAD)" = "$SRS_SHA"
          test "$(git -C "$root/bass-untech" rev-parse HEAD)" = "$BASS_SHA"
          test "$(git -C "$root/untech-editor" rev-parse HEAD)" = "$UNTECH_EDITOR_SHA"
          test "$(git -C "$root/terrific-audio-driver" rev-parse HEAD)" = "$TAD_SHA"

          echo "SRS_ROOT=$root" >> "$GITHUB_ENV"

      - name: Build exact upstream CLI toolchain
        shell: bash
        run: |
          set -euo pipefail
          root="$SRS_ROOT"

          # bass-untech is built by the game Makefile when required.

          cmake -S "$root/untech-editor" -B "$root/untech-editor/build" \
            -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$root/untech-editor/build" --parallel "$(nproc)" --target \
            untech-compiler \
            untech-lz4c \
            untech-png2snes \
            untech-png2tileset \
            untech-write-sfc-checksum

          make -j"$(nproc)" -C "$root/terrific-audio-driver/wiz"
          cargo build --quiet --release \
            --manifest-path "$root/terrific-audio-driver/Cargo.toml" \
            --package tad-compiler

          test -x "$root/untech-editor/build/untech-compiler"
          test -x "$root/untech-editor/build/untech-png2tileset"
          test -x "$root/untech-editor/build/untech-write-sfc-checksum"
          test -x "$root/terrific-audio-driver/target/release/tad-compiler"

      - name: Build unmodified release game from pinned source
        shell: bash
        run: |
          set -euo pipefail
          root="$SRS_ROOT"

          # Upstream commits both .aseprite sources and the generated PNG inputs.
          # The release build only needs the committed PNGs; touching them after
          # checkout prevents Make from needlessly requiring the proprietary
          # Aseprite editor to regenerate byte-identical build inputs.
          find "$root/game/resources" -type f -name '*.png' -exec touch {} +

          # Direct ROM targets do not inherit upstream's `all: directories`
          # prerequisite, so create generated-output directories explicitly.
          make -C "$root/game" directories
          make -C "$root/game" bin/space-rescue-squad.sfc

          rom="$root/game/bin/space-rescue-squad.sfc"
          test -s "$rom"
          test "$(stat -c '%s' "$rom")" -gt 0

          # Build products must not mutate tracked upstream source/assets.
          git -C "$root" diff --check
          test -z "$(git -C "$root" diff --name-only)"

          sha256sum "$rom" | tee srs-rom.sha256
          {
            echo "upstream_repo=$SRS_REPO"
            echo "upstream_sha=$SRS_SHA"
            echo "bass_sha=$BASS_SHA"
            echo "untech_editor_sha=$UNTECH_EDITOR_SHA"
            echo "terrific_audio_driver_sha=$TAD_SHA"
            echo "rom_size=$(stat -c '%s' "$rom")"
            echo "rom_sha256=$(sha256sum "$rom" | awk '{print $1}')"
          } | tee srs-provenance.txt

      - name: Upload provenance only
        uses: actions/upload-artifact@v4
        with:
          name: gate-b-srs-source-build-proof
          retention-days: 14
          path: |
            srs-rom.sha256
            srs-provenance.txt


      - name: Create explicit deterministic gameplay benchmark
        shell: bash
        run: |
          set -euo pipefail
          root="$SRS_ROOT"

          python3 - <<'PY'
          from pathlib import Path

          root = Path(__import__('os').environ['SRS_ROOT'])

          main = root / 'game/src/_main.asm'
          text = main.read_text()
          old = """    rep     #$30
          a16()


              if {defined DEBUG_BUILD} {
          """
          new = """    rep     #$30
          a16()

              // SODIUM64 GATE-B BENCHMARK PATCH:
              // Keep normal audio/game-state initialization, then enter the first
              // authored gameplay level without title/menu input latency.
              jsr     GameState.LoadInitialGameState
              LevelNameScreen.ResetLevelNumber()

              lda.w   #Project.RoomList.a1a_entrance
              sta.w   GameState.roomId
              stz.w   GameState.entranceId

              lda.w   #Mode.GAME
              jmp     SwitchMode


              if {defined DEBUG_BUILD} {
          """
          if text.count(old) != 1:
              raise SystemExit(f'_main.asm benchmark anchor count={text.count(old)}')
          main.write_text(text.replace(old, new, 1))

          loop = root / 'game/src/gameloop.inc'
          text = loop.read_text()
          old = """        sep     #$30
              a8()
              i8()
                  lda.w   Controller.Joy1.pressed + 1
          """
          new = """        sep     #$30
              a8()
              i8()
                  // Deterministic representative-route candidate v5.
                  // Right + Run stay held.  Keep v2's normal periodic jumps,
                  // except suppress the absolute gf352 jump so the player drops
                  // from the upper platform onto the authored lower platform.
                  // Then issue one real B edge at gf378 and hold B for 16 frames.
                  // Finally suppress only gf544..559 so the player falls into the
                  // authored right-door opening instead of jumping into its header.
                  // No position, momentum, collision or room state is modified.
                  stz.w   Controller.Joy1.current
                  stz.w   Controller.Joy1.pressed
                  stz.w   Controller.Joy1.pressed + 1
                  lda.b   #JOYH.right | JOYH.y
                  sta.w   Controller.Joy1.current + 1

                  // Baseline periodic v2 pulse: phase 0x20, 16-frame hold.
                  lda.w   frameCounter
                  and.b   #$3f
                  cmp.b   #$20
                  bcc     Sodium64RouteV3_PeriodicDone
                  cmp.b   #$30
                  bcs     Sodium64RouteV3_PeriodicDone
                      lda.b   #JOYH.right | JOYH.y | JOYH.b
                      sta.w   Controller.Joy1.current + 1

                      lda.w   frameCounter
                      and.b   #$3f
                      cmp.b   #$20
                      bne     Sodium64RouteV3_PeriodicDone
                          lda.b   #JOYH.b
                          sta.w   Controller.Joy1.pressed + 1
                  Sodium64RouteV3_PeriodicDone:

                  // Suppress only absolute frameCounter 0x0160..0x016f
                  // (the gf352 periodic jump and its hold).
                  lda.w   frameCounter + 1
                  cmp.b   #$01
                  bne     Sodium64RouteV3_SpecialDone
                      lda.w   frameCounter
                      cmp.b   #$60
                      bcc     Sodium64RouteV3_TargetJump
                      cmp.b   #$70
                      bcs     Sodium64RouteV3_TargetJump
                          lda.b   #JOYH.right | JOYH.y
                          sta.w   Controller.Joy1.current + 1
                          stz.w   Controller.Joy1.pressed + 1

                  Sodium64RouteV3_TargetJump:
                      // Targeted lower-platform jump: gf378..393 (0x017a..0x0189).
                      lda.w   frameCounter
                      cmp.b   #$7a
                      bcc     Sodium64RouteV3_SpecialDone
                      cmp.b   #$8a
                      bcs     Sodium64RouteV3_SpecialDone
                          lda.b   #JOYH.right | JOYH.y | JOYH.b
                          sta.w   Controller.Joy1.current + 1
                          lda.w   frameCounter
                          cmp.b   #$7a
                          bne     Sodium64RouteV3_SpecialDone
                              lda.b   #JOYH.b
                              sta.w   Controller.Joy1.pressed + 1

                  Sodium64RouteV3_SpecialDone:
                  // Suppress only absolute frameCounter 0x0220..0x022f
                  // (the gf544 periodic jump/hold at the right-door approach).
                  lda.w   frameCounter + 1
                  cmp.b   #$02
                  bne     Sodium64RouteV5_DoorDone
                      lda.w   frameCounter
                      cmp.b   #$20
                      bcc     Sodium64RouteV5_DoorDone
                      cmp.b   #$30
                      bcs     Sodium64RouteV5_DoorDone
                          lda.b   #JOYH.right | JOYH.y
                          sta.w   Controller.Joy1.current + 1
                          stz.w   Controller.Joy1.pressed + 1
                  Sodium64RouteV5_DoorDone:
                  lda.w   Controller.Joy1.pressed + 1
          """
          if text.count(old) != 1:
              raise SystemExit(f'gameloop.inc benchmark anchor count={text.count(old)}')
          loop.write_text(text.replace(old, new, 1))
          PY

          git -C "$root" diff --check
          changed="$(git -C "$root" diff --name-only)"
          test "$(printf '%s\n' "$changed" | wc -l)" -eq 2
          printf '%s\n' "$changed" | grep -Fxq 'game/src/_main.asm'
          printf '%s\n' "$changed" | grep -Fxq 'game/src/gameloop.inc'

          git -C "$root" diff -- game/src/_main.asm game/src/gameloop.inc \
            | tee srs-benchmark.patch

          make -C "$root/game" bin/space-rescue-squad.sfc
          rom="$root/game/bin/space-rescue-squad.sfc"
          test -s "$rom"
          echo "2455da2b775a04b0e07775b39327d98b1de6a26f2da50bb1a8080e6e2ffffc46  $rom" | sha256sum --check
          echo "b21d55df2d5fb949646c9a2124d5c062fa5e7f312264dabb2f354fdc67a27935  srs-benchmark.patch" | sha256sum --check

          {
            echo "upstream_sha=$SRS_SHA"
            echo "benchmark=qualified v5 authored route a1a_entrance -> a1b_stairway via deterministic normal controller input"
            echo "modified_files=game/src/_main.asm,game/src/gameloop.inc"
            echo "benchmark_rom_size=$(stat -c '%s' "$rom")"
            echo "benchmark_rom_sha256=$(sha256sum "$rom" | awk '{print $1}')"
            echo "benchmark_patch_sha256=$(sha256sum srs-benchmark.patch | awk '{print $1}')"
            echo "preserved=audio initialization, game state, room loading, entities, collisions, camera, metatile processing, animations, scripts, WaitFrame"
            echo "disabled=nothing"
          } | tee srs-benchmark-provenance.txt

      - name: Resolve SRS guest progression symbols without changing ROM bytes
        shell: bash
        run: |
          set -euo pipefail
          root="$SRS_ROOT"
          main="$root/game/src/_main.asm"
          before_sha="$(sha256sum "$root/game/bin/space-rescue-squad.sfc" | awk '{print $1}')"

          python3 - <<'PY'
          from pathlib import Path
          import os

          p = Path(os.environ["SRS_ROOT"]) / "game/src/_main.asm"
          text = p.read_text()
          probe = r'''
          // SODIUM64 GATE-B COMPILE-TIME SYMBOL PROBE.
          // These print directives emit no guest instructions/data.
          print "SODIUM64_SRS_FRAME_COUNTER_ADDR="
          print_hex(6, frameCounter)
          print "\n"
          print "SODIUM64_SRS_ROOM_ID_ADDR="
          print_hex(6, GameState.roomId)
          print "\n"
          print "SODIUM64_SRS_PLAYER_X_ADDR="
          print_hex(6, Entity.Player.xPos.px)
          print "\n"
          print "SODIUM64_SRS_PLAYER_Y_ADDR="
          print_hex(6, Entity.Player.yPos.px)
          print "\n"
          print "SODIUM64_SRS_CAMERA_X_ADDR="
          print_hex(6, Camera.xPos)
          print "\n"
          print "SODIUM64_SRS_CAMERA_Y_ADDR="
          print_hex(6, Camera.yPos)
          print "\n"
          print "SODIUM64_SRS_ROOM_A1A_ID="
          print_hex(2, Project.RoomList.a1a_entrance)
          print "\n"
          print "SODIUM64_SRS_ROOM_A1B_ID="
          print_hex(2, Project.RoomList.a1b_stairway)
          print "\n"
          print "SODIUM64_SRS_MAP_LEFT="
          print_hex(4, MetaTiles.map.LEFT)
          print "\n"
          print "SODIUM64_SRS_MAP_TOP="
          print_hex(4, MetaTiles.map.TOP)
          print "\n"
          '''
          p.write_text(text + probe)
          PY

          # Rebuild with compile-time prints only and prove the ROM bytes are
          # unchanged from the already-hashed deterministic benchmark.
          touch "$main"
          make -C "$root/game" bin/space-rescue-squad.sfc 2>&1 | tee srs-symbol-probe.log
          after_sha="$(sha256sum "$root/game/bin/space-rescue-squad.sfc" | awk '{print $1}')"
          test "$after_sha" = "$before_sha"
          test "$after_sha" = "2455da2b775a04b0e07775b39327d98b1de6a26f2da50bb1a8080e6e2ffffc46"

          probe() {
            key="$1"
            value="$(sed -n "s/^SODIUM64_SRS_${key}=//p" srs-symbol-probe.log | tail -n1)"
            test -n "$value"
            printf '%s' "$value"
          }

          {
            echo "SRS_GUEST_FRAME_COUNTER=$(probe FRAME_COUNTER_ADDR)"
            echo "SRS_GUEST_ROOM_ID=$(probe ROOM_ID_ADDR)"
            echo "SRS_GUEST_PLAYER_X=$(probe PLAYER_X_ADDR)"
            echo "SRS_GUEST_PLAYER_Y=$(probe PLAYER_Y_ADDR)"
            echo "SRS_GUEST_CAMERA_X=$(probe CAMERA_X_ADDR)"
            echo "SRS_GUEST_CAMERA_Y=$(probe CAMERA_Y_ADDR)"
            echo "SRS_ROOM_A1A_ID=$(probe ROOM_A1A_ID)"
            echo "SRS_ROOM_A1B_ID=$(probe ROOM_A1B_ID)"
            echo "SRS_MAP_LEFT=$(probe MAP_LEFT)"
            echo "SRS_MAP_TOP=$(probe MAP_TOP)"
          } | tee -a "$GITHUB_ENV"

      - name: Setup Node.js for Sodium64 profile build
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Build Sodium64 PROFILE runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install -g libdragon
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          libdragon init
          libdragon make PROFILE=1 -j"$(nproc)" 2>&1 | tee profile-build.log
          test -s sodium64.z64
          test -s build/sodium64.elf

      - name: Install ares lab dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            ccache \
            curl \
            libgtk-3-dev \
            libgl1-mesa-dri \
            libvulkan1 \
            mesa-vulkan-drivers \
            qt6-base-dev \
            unzip \
            xauth \
            xvfb

      - name: Restore ares compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ares-n64-ccache-\${{ runner.os }}-\${{ runner.arch }}-17813a3ccda21ab9bd45f09bfc2f91196dbf50ff-rsp-interpreter-v1

      - name: Build pinned N64-only ares in valid lab mode
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ares-src"
          git clone --filter=blob:none https://github.com/ares-emulator/ares.git "$root"
          git -C "$root" checkout 17813a3ccda21ab9bd45f09bfc2f91196dbf50ff
          cd "$root"

          # Existing LAB LIMITATION: the pinned ares RSP recompiler collapses
          # Sodium64's VRAM semaphore path. Keep R4300 JIT; force only RSP interpreter.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ares/n64/system/system.cpp')
          s = p.read_text()
          old = 'rsp.recompiler.enabled = value.boolean();'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'rsp.recompiler.enabled = false;', 1))
          PY

          ccache --zero-stats
          .github/scripts/build_sdl.sh
          cmake --preset ubuntu-ci -DARES_CORES=n64
          cmake --build build --parallel "$(nproc)"
          ccache --show-stats
          ares_bin=$(find "$root/build" -type f -name ares -perm -111 | head -n1)
          test -n "$ares_bin"
          test -x "$ares_bin"
          echo "ARES_BIN=$ares_bin" >> "$GITHUB_ENV"
          "$ares_bin" --version | tee "$GITHUB_WORKSPACE/ares-version.txt"

      - name: Wrap benchmark locally without publishing ROM bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workloads/ares
          cp sodium64.z64 workloads/ares/sodium64.z64
          cp rom-converter.py workloads/ares/rom-converter.py
          cp "$SRS_ROOT/game/bin/space-rescue-squad.sfc" workloads/ares/profile-srs.smc
          (
            cd workloads/ares
            python3 rom-converter.py </dev/null
          )
          test -s workloads/ares/out/profile-srs.z64

      - name: Locate Sodium64 profiling and frame-budget state
        shell: bash
        run: |
          set -euo pipefail
          elf="build/sodium64.elf"
          symbol() {
            nm -n "$elf" | awk -v name="$1" '$3 == name { print $1; exit }'
          }

          magic=$(symbol profile_magic)
          end=$(symbol profile_sample_buffer_end)
          buffer=$(symbol profile_sample_buffer)
          write_ptr=$(symbol profile_write_ptr)
          sample_count=$(symbol profile_sample_count)
          last_epc=$(symbol profile_last_epc)
          apu_clock=$(symbol apu_clock)
          jit_lookup=$(symbol jit_lookup)
          jit_pointer=$(symbol jit_pointer)
          fps_native=$(symbol fps_native)
          fps_emulate=$(symbol fps_emulate)
          fps_display=$(symbol fps_display)
          frame_count=$(symbol frame_count)
          skipped_set=$(symbol skipped_set)
          precision_set=$(symbol precision_set)
          audio_set=$(symbol audio_set)
          cpu_execute=$(symbol cpu_execute)
          update_fps=$(symbol update_fps)
          check_frame=$(symbol check_frame)
          vi_history_count=$(symbol profile_vi_history_count)
          vi_history=$(symbol profile_vi_history)

          for value in \
            "$magic" "$end" "$buffer" "$write_ptr" "$sample_count" \
            "$last_epc" "$apu_clock" "$jit_lookup" "$jit_pointer" \
            "$fps_native" "$fps_emulate" "$fps_display" "$frame_count" \
            "$skipped_set" "$precision_set" "$audio_set" \
            "$cpu_execute" "$update_fps" "$check_frame" \
            "$vi_history_count" "$vi_history"; do
            test -n "$value"
          done

          size=$((0x$end - 0x$magic))
          jit_lookup_size=$((0x$jit_pointer - 0x$jit_lookup))
          test "$size" -gt 16384
          test "$jit_lookup_size" -eq 262144

          # Read SRS state through the same R4300 virtual addresses used by
          # Sodium64's guest memory accesses.  Do not translate these to the
          # KSEG0 backing-buffer alias: ares's N64 D-cache is virtually indexed,
          # so an alias read can miss a dirty guest line and return stale RDRAM.
          guest_virtual() {
            guest_hex="$1"
            guest=$((0x$guest_hex))
            bank=$(((guest >> 16) & 0xff))
            case "$bank" in
              126|127) ;;
              *) echo "guest address 0x$guest_hex is not WRAM 7E/7F" >&2; return 1 ;;
            esac
            printf '%08x' "$guest"
          }

          srs_frame_counter_virtual=$(guest_virtual "$SRS_GUEST_FRAME_COUNTER")
          srs_room_id_virtual=$(guest_virtual "$SRS_GUEST_ROOM_ID")
          srs_player_x_virtual=$(guest_virtual "$SRS_GUEST_PLAYER_X")
          srs_player_y_virtual=$(guest_virtual "$SRS_GUEST_PLAYER_Y")
          srs_camera_x_virtual=$(guest_virtual "$SRS_GUEST_CAMERA_X")
          srs_camera_y_virtual=$(guest_virtual "$SRS_GUEST_CAMERA_Y")

          # ares GDB treats multi-byte requests as CPU Half/Word reads. These
          # SRS fields may be unaligned or dirty in the virtual D-cache, so
          # observe each byte independently at its exact guest virtual address.
          srs_frame_counter_1=$(printf '%08x' "$((0x$srs_frame_counter_virtual + 1))")
          srs_frame_counter_2=$(printf '%08x' "$((0x$srs_frame_counter_virtual + 2))")
          srs_frame_counter_3=$(printf '%08x' "$((0x$srs_frame_counter_virtual + 3))")
          srs_player_x_hi=$(printf '%08x' "$((0x$srs_player_x_virtual + 1))")
          srs_player_y_hi=$(printf '%08x' "$((0x$srs_player_y_virtual + 1))")
          srs_camera_x_hi=$(printf '%08x' "$((0x$srs_camera_x_virtual + 1))")
          srs_camera_y_hi=$(printf '%08x' "$((0x$srs_camera_y_virtual + 1))")

          buffer_hex=$(printf '%08x' "$((0x$buffer))")
          rom_buffer=$(awk '$1 == "#define" && $2 == "ROM_BUFFER" { print $3; exit }' src/defines.h)
          test -n "$rom_buffer"
          jit_buffer=$((rom_buffer - 0x40000))
          jit_buffer_hex=$(printf '%08x' "$jit_buffer")

          {
            echo "ARES_PROFILE_ADDR=$magic"
            echo "ARES_PROFILE_SIZE=$size"
            echo "ARES_PROFILE_BUFFER_HEX=$buffer_hex"
            echo "ARES_PROFILE_WRITE_PTR_ADDR=$write_ptr"
            echo "ARES_PROFILE_SAMPLE_COUNT_ADDR=$sample_count"
            echo "ARES_PROFILE_LAST_EPC_ADDR=$last_epc"
            echo "ARES_APU_CLOCK_ADDR=$apu_clock"
            echo "ARES_JIT_LOOKUP_ADDR=$jit_lookup"
            echo "ARES_JIT_LOOKUP_SIZE=$jit_lookup_size"
            echo "ARES_JIT_POINTER_ADDR=$jit_pointer"
            echo "ARES_JIT_BUFFER_HEX=$jit_buffer_hex"
            echo "ARES_FPS_NATIVE_ADDR=$fps_native"
            echo "ARES_FPS_EMULATE_ADDR=$fps_emulate"
            echo "ARES_FPS_DISPLAY_ADDR=$fps_display"
            echo "ARES_FRAME_COUNT_ADDR=$frame_count"
            echo "ARES_SKIPPED_SET_ADDR=$skipped_set"
            echo "ARES_PRECISION_SET_ADDR=$precision_set"
            echo "ARES_AUDIO_SET_ADDR=$audio_set"
            echo "ARES_CPU_EXECUTE_ADDR=$cpu_execute"
            echo "ARES_UPDATE_FPS_ADDR=$update_fps"
            echo "ARES_CHECK_FRAME_ADDR=$check_frame"
            echo "ARES_SRS_FRAME_COUNTER_ADDR=$srs_frame_counter_virtual"
            echo "ARES_SRS_FRAME_COUNTER_1_ADDR=$srs_frame_counter_1"
            echo "ARES_SRS_FRAME_COUNTER_2_ADDR=$srs_frame_counter_2"
            echo "ARES_SRS_FRAME_COUNTER_3_ADDR=$srs_frame_counter_3"
            echo "ARES_SRS_ROOM_ID_ADDR=$srs_room_id_virtual"
            echo "ARES_SRS_PLAYER_X_ADDR=$srs_player_x_virtual"
            echo "ARES_SRS_PLAYER_X_HI_ADDR=$srs_player_x_hi"
            echo "ARES_SRS_PLAYER_Y_ADDR=$srs_player_y_virtual"
            echo "ARES_SRS_PLAYER_Y_HI_ADDR=$srs_player_y_hi"
            echo "ARES_SRS_CAMERA_X_ADDR=$srs_camera_x_virtual"
            echo "ARES_SRS_CAMERA_X_HI_ADDR=$srs_camera_x_hi"
            echo "ARES_SRS_CAMERA_Y_ADDR=$srs_camera_y_virtual"
            echo "ARES_SRS_CAMERA_Y_HI_ADDR=$srs_camera_y_hi"
            echo "ARES_VI_HISTORY_COUNT_ADDR=$vi_history_count"
            echo "ARES_VI_HISTORY_ADDR=$vi_history"
            for offset in 0 8 16 24 32 40 48 56; do
              addr=$((0x$vi_history + offset))
              printf 'ARES_VI_HISTORY_%d_ADDR=%08x\n' "$((offset / 8))" "$addr"
            done
          } >> "$GITHUB_ENV"

      - name: Run safe matched SRS guest-time repeats
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p profiles
          rom="workloads/ares/out/profile-srs.z64"

          run_repeat() {
            repeat="$1"
            label="matched-srs-r$repeat"
            port=$((9140 + repeat))
            home="$RUNNER_TEMP/ares-home-$label"
            settings="$RUNNER_TEMP/ares-settings-$label.bml"
            emulator_log="profiles/$label-emulator.log"
            gdb_log="profiles/$label-gdb.log"
            snapshot="profiles/$label.bin"
            report="profiles/$label.txt"
            json="profiles/$label.json"
            state="profiles/$label-state.json"

            rm -rf "$home"
            mkdir -p "$home"

            HOME="$home" SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 \
              xvfb-run -a stdbuf -oL -eL "$ARES_BIN" \
                --no-file-prompt \
                --system "Nintendo 64" \
                --settings-file "$settings" \
                --setting "Developer/DebugServerEnabled=true" \
                --setting "Developer/DebugServerUseIPv4=true" \
                --setting "Developer/DebugServerPort=$port" \
                --setting "Developer/HomebrewMode=true" \
                --setting "Developer/DeterministicEntropy=true" \
                --setting "Developer/ForceInterpreter=false" \
                --setting "Boot/AwaitGDBClient=true" \
                "$rom" \
                > "$emulator_log" 2>&1 &
            ares_pid=$!

            cleanup_run() {
              kill "$ares_pid" 2>/dev/null || true
              wait "$ares_pid" 2>/dev/null || true
            }
            trap cleanup_run EXIT

            if ! python3 scripts/gdb_matched_srs.py \
              --port "$port" \
              --connect-timeout 45 \
              --response-timeout 120 \
              --cpu-execute "0x$ARES_CPU_EXECUTE_ADDR" \
              --update-fps "0x$ARES_UPDATE_FPS_ADDR" \
              --check-frame "0x$ARES_CHECK_FRAME_ADDR" \
              --profile-address "0x$ARES_PROFILE_ADDR" \
              --profile-size "$ARES_PROFILE_SIZE" \
              --profile-buffer "0x$ARES_PROFILE_BUFFER_HEX" \
              --profile-write-ptr "0x$ARES_PROFILE_WRITE_PTR_ADDR" \
              --profile-sample-count "0x$ARES_PROFILE_SAMPLE_COUNT_ADDR" \
              --profile-last-epc "0x$ARES_PROFILE_LAST_EPC_ADDR" \
              --apu-clock "0x$ARES_APU_CLOCK_ADDR" \
              --jit-lookup "0x$ARES_JIT_LOOKUP_ADDR" \
              --jit-lookup-size "$ARES_JIT_LOOKUP_SIZE" \
              --jit-pointer "0x$ARES_JIT_POINTER_ADDR" \
              --jit-buffer "0x$ARES_JIT_BUFFER_HEX" \
              --skipped-set "0x$ARES_SKIPPED_SET_ADDR" \
              --audio-set "0x$ARES_AUDIO_SET_ADDR" \
              --precision-set "0x$ARES_PRECISION_SET_ADDR" \
              --fps-native "0x$ARES_FPS_NATIVE_ADDR" \
              --fps-emulate "0x$ARES_FPS_EMULATE_ADDR" \
              --fps-display "0x$ARES_FPS_DISPLAY_ADDR" \
              --frame-count "0x$ARES_FRAME_COUNT_ADDR" \
              --srs-frame-counter "0x$ARES_SRS_FRAME_COUNTER_ADDR" \
              --srs-frame-counter-1 "0x$ARES_SRS_FRAME_COUNTER_1_ADDR" \
              --srs-frame-counter-2 "0x$ARES_SRS_FRAME_COUNTER_2_ADDR" \
              --srs-frame-counter-3 "0x$ARES_SRS_FRAME_COUNTER_3_ADDR" \
              --srs-room-id "0x$ARES_SRS_ROOM_ID_ADDR" \
              --srs-player-x "0x$ARES_SRS_PLAYER_X_ADDR" \
              --srs-player-x-hi "0x$ARES_SRS_PLAYER_X_HI_ADDR" \
              --srs-player-y "0x$ARES_SRS_PLAYER_Y_ADDR" \
              --srs-player-y-hi "0x$ARES_SRS_PLAYER_Y_HI_ADDR" \
              --srs-camera-x "0x$ARES_SRS_CAMERA_X_ADDR" \
              --srs-camera-x-hi "0x$ARES_SRS_CAMERA_X_HI_ADDR" \
              --srs-camera-y "0x$ARES_SRS_CAMERA_Y_ADDR" \
              --srs-camera-y-hi "0x$ARES_SRS_CAMERA_Y_HI_ADDR" \
              --warmup-windows 2 \
              --measure-windows 5 \
              --post-validation-windows 4 \
              --snapshot "$snapshot" \
              --state-output "$state" \
              > "$gdb_log" 2>&1; then
              cat "$gdb_log"
              tail -200 "$emulator_log" || true
              exit 1
            fi

            cat "$gdb_log"
            cleanup_run
            trap - EXIT

            python3 scripts/profile_report.py \
              "$snapshot" build/sodium64.elf \
              --nm nm --map build/sodium64.map \
              --json-output "$json" | tee "$report"

            samples=$(awk '/total samples:/ { print $3 }' "$report")
            test -n "$samples"
            test "$samples" -ge 800
          }

          for repeat in 1 2 3; do
            echo "=== safe matched SRS repeat $repeat/3 ==="
            run_repeat "$repeat"
          done

      - name: Summarize SRS matched route activity and repeatability
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          runs = [
              json.loads(Path(f"profiles/matched-srs-r{i}-state.json").read_text())
              for i in range(1, 4)
          ]

          for run in runs:
              contract = run["measurement_contract"]
              assert contract["configuration_boundary"] == "first_cpu_execute_before_guest_execution"
              assert contract["window_boundary"] == "update_fps_entry"
              assert contract["vi_per_window"] == 60
              assert contract["warmup_windows"] == 2
              assert contract["measured_windows"] == 5
              assert contract["post_validation_windows"] == 4
              assert run["configured"]["apu_clock"] == 21
              assert run["configured"]["skipped_set"] == 0
              assert run["configured"]["audio_set"] == 4
              assert run["configured"]["precision_set"] == 8
              assert len(run["warmup"]) == 2
              assert len(run["measured"]) == 5
              assert len(run["post_validation"]) == 4
              assert run["summary"]["final_sample_count"] >= 800

          def plausible(st):
              return (
                  st["room_id"] in (int(__import__("os").environ["SRS_ROOM_A1A_ID"], 16),
                                    int(__import__("os").environ["SRS_ROOM_A1B_ID"], 16))
                  and 0x1000 <= st["player_x"] < 0x8000
                  and 0x1000 <= st["player_y"] < 0x8000
                  and 0x1000 <= st["camera_x"] < 0x8000
                  and 0x1000 <= st["camera_y"] < 0x8000
              )

          sequences = []
          frame_vectors = []
          for run in runs:
              rows = run["warmup"] + run["measured"] + run["post_validation"]
              states = [row["guest"] for row in rows]
              assert all(plausible(st) for st in states), states
              sequences.append(states)
              frame_vectors.append([row["completed_frames"] for row in run["measured"]])

          repeatable_state = all(seq == sequences[0] for seq in sequences[1:])
          repeatable_frames = all(v == frame_vectors[0] for v in frame_vectors[1:])

          first = sequences[0]

          def spatial(st):
              return {k: v for k, v in st.items() if k != "frame_counter"}

          unique_states = []
          for st in first:
              spatial_state = spatial(st)
              if not unique_states or spatial_state != unique_states[-1]:
                  unique_states.append(spatial_state)

          player_xs = [st["player_x"] for st in first]
          rooms = [st["room_id"] for st in first]
          activity = {
              "player_x_span": max(player_xs) - min(player_xs),
              "distinct_boundary_states": len(
                  {tuple(sorted(spatial(st).items())) for st in first}
              ),
              "room_transition_observed": len(set(rooms)) > 1,
              "stalled_suffix_windows": 0,
          }
          for n in range(1, len(first) + 1):
              suffix = first[-n:]
              if all(spatial(st) == spatial(suffix[0]) for st in suffix):
                  activity["stalled_suffix_windows"] = n
              else:
                  break

          payload = {
              "measurement": "safe pre-guest full-rate configuration; exact 60-VI boundaries",
              "guest_state_sequences": sequences,
              "measured_frame_vectors": frame_vectors,
              "state_repeatable_across_three_runs": repeatable_state,
              "frame_vector_repeatable_across_three_runs": repeatable_frames,
              "activity": activity,
          }
          Path("profiles/srs-matched-route-summary.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n"
          )

          lines = [
              "# SRS safe matched-route characterization",
              "",
              "Road-valid settings are applied before first guest execution.",
              "Guest state is sampled at two warmup + five measured exact 60-VI boundaries, then four state-only post-validation boundaries after the profile snapshot.",
              "",
          ]
          for i, (seq, frames) in enumerate(zip(sequences, frame_vectors), 1):
              lines.append(f"## Repeat {i}")
              lines.append(f"- measured frame vector: {frames}")
              for j, st in enumerate(seq, 1):
                  lines.append(
                      f"- boundary {j}: gf={st['frame_counter']} room={st['room_id']} "
                      f"player=({st['player_x']},{st['player_y']}) "
                      f"camera=({st['camera_x']},{st['camera_y']})"
                  )
              lines.append("")
          lines += [
              f"- state sequence identical across repeats: **{repeatable_state}**",
              f"- measured frame vector identical across repeats: **{repeatable_frames}**",
              f"- player-x span across seven observed boundaries: **{activity['player_x_span']} px**",
              f"- distinct boundary states: **{activity['distinct_boundary_states']}**",
              f"- room transition observed: **{activity['room_transition_observed']}**",
              f"- identical-state suffix length: **{activity['stalled_suffix_windows']} windows**",
              "",
              "> Discovery evidence only. A stable stall is route evidence to investigate, not a CI failure. "
              "Frame counts are emulator-lab throughput, not real-N64 FPS.",
          ]
          Path("profiles/srs-matched-route-summary.md").write_text("\n".join(lines) + "\n")
          print(Path("profiles/srs-matched-route-summary.md").read_text())
          PY

          python3 scripts/profile_matrix.py \
            profiles/matched-srs-r1.json \
            profiles/matched-srs-r2.json \
            profiles/matched-srs-r3.json \
            --output profiles/srs-matched-profile-repeatability.md

          {
            echo '### Gate-B SRS safe matched-route characterization'
            echo
            cat profiles/srs-matched-route-summary.md
            echo
            cat profiles/srs-matched-profile-repeatability.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload non-ROM audition diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-b-srs-v5-matched
          retention-days: 14
          if-no-files-found: ignore
          path: |
            ares-version.txt
            profile-build.log
            srs-rom.sha256
            srs-provenance.txt
            srs-benchmark.patch
            srs-benchmark-provenance.txt
            srs-symbol-probe.log
            profiles/
