name: Gate C CGRAM DMA8 RSP Consumer Dynamic Proof

on:
  push:
    branches:
      - phase4/gate-c-cgram-rsp-consumer-dynamic-proof
    paths:
      - src/defines.h
      - src/main.S
      - src/ppu.S
      - src/rsp_main.S
      - src/rsp_mode7.S
      - scripts/test_gate_c_cgram_rsp_consumer_contract.py
      - scripts/test_gate_c_cgram_rsp_consumer_impl.py
      - scripts/make_gate_c_cgram_rsp_consumer_dynamic.py
      - scripts/check_gate_c_cgram_rsp_consumer_dynamic.py
      - .github/workflows/gate-c-cgram-rsp-consumer-dynamic.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sodium64-gate-c-cgram-rsp-consumer-dynamic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cgram-rsp-consumer-dynamic:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Install libdragon
        run: npm install -g libdragon

      - name: Checkout
        uses: actions/checkout@v4

      - name: Reprove consumer and self-test dynamic classifier
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_gate_c_cgram_rsp_consumer_impl.py
          python3 scripts/check_gate_c_cgram_rsp_consumer_dynamic.py --self-test
          python3 scripts/make_gate_c_cgram_rsp_consumer_dynamic.py guest-a.smc
          python3 scripts/make_gate_c_cgram_rsp_consumer_dynamic.py guest-b.smc
          cmp guest-a.smc guest-b.smc
          test "$(stat -c %s guest-a.smc)" -eq 32768
          sha256sum guest-a.smc | tee guest.sha256

      - name: Build exact candidate
        shell: bash
        run: |
          set -euo pipefail
          libdragon init
          libdragon make -j$(nproc) 2>&1 | tee build.log
          sha256sum sodium64.z64 build/sodium64.elf build/src/rsp_main.elf build/src/rsp_mode7.elf | tee runtime.sha256

      - name: Wrap deterministic guest
        shell: bash
        run: |
          set -euo pipefail
          mkdir workload
          cp sodium64.z64 rom-converter.py guest-a.smc workload/
          (
            cd workload
            python3 rom-converter.py </dev/null
          )
          test -f workload/out/guest-a.z64
          sha256sum workload/out/guest-a.z64 | tee wrapped.sha256

      - name: Install Mupen64Plus build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential expect git libfreetype6-dev libgl1-mesa-dev \
            libglu1-mesa-dev libpng-dev libsdl2-dev libvulkan-dev pkg-config zlib1g-dev

      - name: Build pinned Mupen64Plus debugger and LLE RSP
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/sodium64-mupen"
          mkdir -p "$root"
          cd "$root"

          git clone https://github.com/mupen64plus/mupen64plus-core.git
          git -C mupen64plus-core checkout b20b27ebf9e5b099a978e86dba609111dc98c837
          git clone https://github.com/mupen64plus/mupen64plus-ui-console.git
          git -C mupen64plus-ui-console checkout c8ac4862a019d7885b24927d9b4db5dd3e42a528
          git clone https://github.com/mupen64plus/mupen64plus-rsp-cxd4.git
          git -C mupen64plus-rsp-cxd4 checkout 00906a92641c540a64e4e7505012157315314810

          export PATH="$root/mupen64plus-core/.github/workflows/scripts:$PATH"
          cd "$root/mupen64plus-core"
          export CONFIG_OVERRIDE="DEBUGGER=1 DEBUGGER_NO_DISASM=1 NEW_DYNAREC=0 NO_ASM=1"
          ci_build.sh x64 gcc

          cd "$root/mupen64plus-ui-console"
          export CONFIG_OVERRIDE=""
          ci_build.sh x64 gcc

          cd "$root/mupen64plus-rsp-cxd4"
          export CONFIG_OVERRIDE='SSE="none"'
          export OPTFLAGS="-O3"
          ci_build.sh x64 gcc

          core_lib=$(find "$root/mupen64plus-core/pkg/usr/local/lib" -maxdepth 1 -type f -name 'libmupen64plus.so*' | head -n1)
          ui_bin="$root/mupen64plus-ui-console/pkg/usr/local/bin/mupen64plus"
          rsp_lib=$(find "$root/mupen64plus-rsp-cxd4/pkg/usr/local/lib/mupen64plus" -type f -name '*cxd4*.so' | head -n1)
          data_dir="$root/mupen64plus-core/pkg/usr/local/share/mupen64plus"
          {
            echo "M64P_CORE=$core_lib"
            echo "M64P_UI=$ui_bin"
            echo "M64P_RSP=$rsp_lib"
            echo "M64P_DATA=$data_dir"
            echo "M64P_LIBDIR=$(dirname "$core_lib")"
          } >> "$GITHUB_ENV"

      - name: Capture first-hand consumer evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence "$RUNNER_TEMP/m64p-config"
          cat > "$RUNNER_TEMP/cgram-consumer.expect" <<'EOF'
          set timeout 80
          log_file evidence/mupen.log
          spawn env LD_LIBRARY_PATH=$env(M64P_LIBDIR) $env(M64P_UI) \
            --corelib $env(M64P_CORE) \
            --datadir $env(M64P_DATA) \
            --configdir $env(RUNNER_TEMP)/m64p-config \
            --debug --emumode 0 --nospeedlimit \
            --gfx dummy --audio dummy --input dummy --rsp $env(M64P_RSP) \
            workload/out/guest-a.z64
          expect "(dbg)"
          for {set n 0} {$n < 4} {incr n} {
            send "run\r"
            if {$n == 0} { after 5000 } else { after 700 }
            send "pause\r"
            expect "(dbg)"

            send "mem /1w A4000EA0\r"
            expect -re {[\r\n]+([0-9a-fA-F]{8})[ \t]*[\r\n]+}
            set fd [open "evidence/snap$n-ea0.txt" w]
            puts $fd $expect_out(1,string)
            close $fd
            expect "(dbg)"

            send "dumpmem 0xA00BF000 256 evidence/snap$n-event-q1.bin\r"
            expect "(dbg)"
            send "dumpmem 0xA00EF000 64 evidence/snap$n-raw-q1.bin\r"
            expect "(dbg)"
          }
          send "quit\r"
          expect eof
          EOF
          expect "$RUNNER_TEMP/cgram-consumer.expect"
          test "$(find evidence -name 'snap*-event-q1.bin' | wc -l)" -eq 4
          test "$(find evidence -name 'snap*-raw-q1.bin' | wc -l)" -eq 4
          test "$(find evidence -name 'snap*-ea0.txt' | wc -l)" -eq 4

      - name: Classify consumer execution
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_gate_c_cgram_rsp_consumer_dynamic.py evidence \
            --guest guest-a.smc --output evidence/result.json
          grep -q 'CGRAM_RSP_DMA8_DYNAMIC_CONSUMER_VALIDATED' evidence/result.json

      - name: Upload dynamic consumer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-cgram-dma8-rsp-consumer-dynamic
          retention-days: 30
          path: |
            evidence/
            guest-a.smc
            guest.sha256
            wrapped.sha256
            runtime.sha256
            build.log
            build/rsp_main.map
            build/rsp_mode7.map
