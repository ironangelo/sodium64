name: Stage 3 Private Laboratory Tools
on:
  push:
    branches: [phase4/gate-c-stage3-iris, phase4/gate-c-smw-exploration]
    paths: [.github/workflows/gate-c-stage3-lab-tools.yml]
permissions:
  contents: read
  actions: read
jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/cache/restore@v4
        id: cached
        with:
          path: ${{ runner.temp }}/ares-src
          key: sodium64-ares-17813a3-n64-rsp-interpreter-v1
          fail-on-cache-miss: true
      - name: Package established laboratory for private local execution
        shell: bash
        run: |
          set -euo pipefail
          sudo cmake --install "$RUNNER_TEMP/ares-src/SDL/build" --prefix=/usr/local
          sudo ldconfig
          for source in /etc/apt/apt-mirrors*.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$source" ]; then sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"; fi
          done
          timeout 180s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 install -y --no-install-recommends libopengl0 xserver-xorg-core xvfb
          ares_bin=$(find "$RUNNER_TEMP/ares-src/build" -type f -name ares -perm -111 | head -n1)
          test -x "$ares_bin"
          mkdir -p lab/bin lab/lib lab/share
          cp "$ares_bin" lab/bin/ares
          strip --strip-debug lab/bin/ares
          cp /usr/bin/Xvfb /usr/bin/xkbcomp lab/bin/
          cp -a "$RUNNER_TEMP/ares-src/ares/n64" lab/n64-source
          cp "$RUNNER_TEMP/ares-src/LICENSE" lab/ARES-LICENSE
          cp -a /usr/share/X11 lab/share/
          export ARES_PACKAGE_BIN="$ares_bin"
          python3 - <<'PY'
          import os,re,subprocess,shutil
          from pathlib import Path
          targets=[Path(os.environ['ARES_PACKAGE_BIN']),Path('/usr/bin/Xvfb'),Path('/usr/bin/xkbcomp')]
          targets+=list(Path('/usr/local/lib').glob('libSDL3.so*'))
          targets+=list(Path('/usr/lib/x86_64-linux-gnu').glob('libOpenGL.so*'))
          for target in targets:
              if not target.is_file():continue
              if target.name.startswith('lib'):
                  shutil.copyfile(target,Path('lab/lib')/target.name)
              result=subprocess.run(['ldd',str(target)],capture_output=True,text=True,check=True)
              print(str(target)+'\n'+result.stdout)
              for path in re.findall(r'=> (/\S+)',result.stdout):
                  p=Path(path)
                  if p.is_file():shutil.copyfile(p,Path('lab/lib')/p.name)
          PY
          "$ares_bin" --version > lab/version.txt
          git -C "$RUNNER_TEMP/ares-src" rev-parse HEAD > lab/source-sha.txt
          tar -czf stage3-lab-tools.tar.gz lab
          sha256sum stage3-lab-tools.tar.gz > SHA256SUMS
          ls -lh stage3-lab-tools.tar.gz
      - name: Package software Vulkan device and its runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 install -y --no-install-recommends mesa-vulkan-drivers
          ls /usr/share/vulkan/icd.d/
          icd_file=$(find /usr/share/vulkan/icd.d -type f -name 'lvp_icd*.json' | head -n1)
          test -n "$icd_file"
          mkdir -p gpu/lib gpu/icd
          cp "$icd_file" gpu/icd/
          cp /usr/lib/x86_64-linux-gnu/libvulkan_lvp.so gpu/lib/
          python3 - <<'PY'
          import re,subprocess,shutil
          from pathlib import Path
          pending=[Path('/usr/lib/x86_64-linux-gnu/libvulkan_lvp.so')]
          seen=set()
          while pending:
              target=pending.pop()
              if str(target) in seen:continue
              seen.add(str(target))
              result=subprocess.run(['ldd',str(target)],capture_output=True,text=True,check=True)
              print(str(target)+'\n'+result.stdout)
              for path in re.findall(r'=> (/\S+)',result.stdout):
                  p=Path(path)
                  if p.is_file():
                      shutil.copyfile(p,Path('gpu/lib')/p.name)
                      pending.append(p)
          PY
          tar -czf stage3-software-vulkan.tar.gz gpu
          sha256sum stage3-software-vulkan.tar.gz
          split -b 20M -d stage3-software-vulkan.tar.gz software-vulkan-part-
      - uses: actions/upload-artifact@v4
        with:
          name: stage3-software-vulkan-part-0
          path: software-vulkan-part-00
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: stage3-software-vulkan-part-1
          path: software-vulkan-part-01
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: stage3-software-vulkan-part-2
          path: software-vulkan-part-02
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: stage3-local-lab-tools
          path: |
            stage3-lab-tools.tar.gz
            SHA256SUMS
          retention-days: 7

