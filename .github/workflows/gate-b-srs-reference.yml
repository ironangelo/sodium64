name: Gate B SRS Representative Direct SNES Route

on:
  push:
    branches:
      - phase3/gate-b-srs-representative
    paths:
      - '.github/workflows/gate-b-srs-reference.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sodium64-gate-b-srs-representative-${{ github.ref }}
  cancel-in-progress: true

jobs:
  direct-snes-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      SRS_REPO: https://github.com/undisbeliever/space-rescue-squad.git
      SRS_SHA: e08333a6cbdf5ac5f9e8deb052fe6a9fd9a54865
      BASS_SHA: 9db6088a378061afc7b82f50997a5b9a1d951175
      UNTECH_EDITOR_SHA: 4c72dc69619c0c246aa7e6325b18b6fb3c219821
      TAD_SHA: 17823e5a55893e8442917abadb4e84feb216e5ad
      ARES_PIN: 17813a3ccda21ab9bd45f09bfc2f91196dbf50ff
      ROUTE_ID: targeted-lower-platform-v3

    steps:
      - name: Checkout Sodium64
        uses: actions/checkout@v4

      - name: Install source and ares dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            cmake \
            git \
            libgl1-mesa-dev \
            libgl1-mesa-dri \
            libgtk-3-dev \
            libmsgsl-dev \
            libsdl2-dev \
            libvulkan1 \
            mesa-vulkan-drivers \
            ninja-build \
            python3 \
            qt6-base-dev \
            xauth \
            xvfb

      - name: Rebuild exact SRS benchmark from public source
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/space-rescue-squad"
          git clone --filter=blob:none "$SRS_REPO" "$root"
          git -C "$root" checkout --detach "$SRS_SHA"
          git -C "$root" submodule update --init --recursive

          test "$(git -C "$root" rev-parse HEAD)" = "$SRS_SHA"
          test "$(git -C "$root/bass-untech" rev-parse HEAD)" = "$BASS_SHA"
          test "$(git -C "$root/untech-editor" rev-parse HEAD)" = "$UNTECH_EDITOR_SHA"
          test "$(git -C "$root/terrific-audio-driver" rev-parse HEAD)" = "$TAD_SHA"

          cmake -S "$root/untech-editor" -B "$root/untech-editor/build" \
            -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$root/untech-editor/build" --parallel "$(nproc)" --target \
            untech-compiler untech-lz4c untech-png2snes untech-png2tileset \
            untech-write-sfc-checksum
          make -j"$(nproc)" -C "$root/terrific-audio-driver/wiz"
          cargo build --quiet --release \
            --manifest-path "$root/terrific-audio-driver/Cargo.toml" \
            --package tad-compiler

          find "$root/game/resources" -type f -name '*.png' -exec touch {} +
          make -C "$root/game" directories
          make -C "$root/game" bin/space-rescue-squad.sfc
          release="$root/game/bin/space-rescue-squad.sfc"
          test -s "$release"
          echo "d5bd7b17aa19a1b370efa38554b6ebfd77c4756e7184e9f2e848e8193bc9bed0  $release" | sha256sum --check

          python3 - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ["RUNNER_TEMP"]) / "space-rescue-squad"

          main = root / "game/src/_main.asm"
          text = main.read_text()
          old = """    rep     #$30
          a16()


              if {defined DEBUG_BUILD} {
          """
          new = """    rep     #$30
          a16()

              // SODIUM64 GATE-B BENCHMARK PATCH:
              // Keep normal audio/game-state initialization, then enter the first
              // authored gameplay level without title/menu input latency.
              jsr     GameState.LoadInitialGameState
              LevelNameScreen.ResetLevelNumber()

              lda.w   #Project.RoomList.a1a_entrance
              sta.w   GameState.roomId
              stz.w   GameState.entranceId

              lda.w   #Mode.GAME
              jmp     SwitchMode


              if {defined DEBUG_BUILD} {
          """
          assert text.count(old) == 1
          main.write_text(text.replace(old, new, 1))

          loop = root / "game/src/gameloop.inc"
          text = loop.read_text()
          old = """        sep     #$30
              a8()
              i8()
                  lda.w   Controller.Joy1.pressed + 1
          """
          new = """        sep     #$30
              a8()
              i8()
                  // Deterministic representative-route candidate v3.
                  // Right + Run stay held.  Keep v2's normal periodic jumps,
                  // except suppress the absolute gf352 jump so the player drops
                  // from the upper platform onto the authored lower platform.
                  // Then issue one real B edge at gf374 and hold B for 16 frames.
                  // No position, momentum, collision or room state is modified.
                  stz.w   Controller.Joy1.current
                  stz.w   Controller.Joy1.pressed
                  stz.w   Controller.Joy1.pressed + 1
                  lda.b   #JOYH.right | JOYH.y
                  sta.w   Controller.Joy1.current + 1

                  // Baseline periodic v2 pulse: phase 0x20, 16-frame hold.
                  lda.w   frameCounter
                  and.b   #$3f
                  cmp.b   #$20
                  bcc     Sodium64RouteV3_PeriodicDone
                  cmp.b   #$30
                  bcs     Sodium64RouteV3_PeriodicDone
                      lda.b   #JOYH.right | JOYH.y | JOYH.b
                      sta.w   Controller.Joy1.current + 1

                      lda.w   frameCounter
                      and.b   #$3f
                      cmp.b   #$20
                      bne     Sodium64RouteV3_PeriodicDone
                          lda.b   #JOYH.b
                          sta.w   Controller.Joy1.pressed + 1
                  Sodium64RouteV3_PeriodicDone:

                  // Suppress only absolute frameCounter 0x0160..0x016f
                  // (the gf352 periodic jump and its hold).
                  lda.w   frameCounter + 1
                  cmp.b   #$01
                  bne     Sodium64RouteV3_SpecialDone
                      lda.w   frameCounter
                      cmp.b   #$60
                      bcc     Sodium64RouteV3_TargetJump
                      cmp.b   #$70
                      bcs     Sodium64RouteV3_TargetJump
                          lda.b   #JOYH.right | JOYH.y
                          sta.w   Controller.Joy1.current + 1
                          stz.w   Controller.Joy1.pressed + 1

                  Sodium64RouteV3_TargetJump:
                      // Targeted lower-platform jump: gf374..389 (0x0176..0x0185).
                      lda.w   frameCounter
                      cmp.b   #$76
                      bcc     Sodium64RouteV3_SpecialDone
                      cmp.b   #$86
                      bcs     Sodium64RouteV3_SpecialDone
                          lda.b   #JOYH.right | JOYH.y | JOYH.b
                          sta.w   Controller.Joy1.current + 1
                          lda.w   frameCounter
                          cmp.b   #$76
                          bne     Sodium64RouteV3_SpecialDone
                              lda.b   #JOYH.b
                              sta.w   Controller.Joy1.pressed + 1

                  Sodium64RouteV3_SpecialDone:
                  lda.w   Controller.Joy1.pressed + 1
          """
          assert text.count(old) == 1
          loop.write_text(text.replace(old, new, 1))
          PY

          git -C "$root" diff -- game/src/_main.asm game/src/gameloop.inc > srs-benchmark.patch
          route_patch_sha="$(sha256sum srs-benchmark.patch | awk '{print $1}')"
          echo "ROUTE_PATCH_SHA256=$route_patch_sha" >> "$GITHUB_ENV"

          make -C "$root/game" bin/space-rescue-squad.sfc
          rom="$root/game/bin/space-rescue-squad.sfc"
          route_rom_sha="$(sha256sum "$rom" | awk '{print $1}')"
          echo "ROUTE_ROM_SHA256=$route_rom_sha" >> "$GITHUB_ENV"
          echo "route_id=$ROUTE_ID patch_sha256=$route_patch_sha rom_sha256=$route_rom_sha"
          echo "SRS_ROOT=$root" >> "$GITHUB_ENV"

      - name: Resolve semantic guest-state symbols without changing ROM bytes
        shell: bash
        run: |
          set -euo pipefail
          root="$SRS_ROOT"
          main="$root/game/src/_main.asm"
          before="$(sha256sum "$root/game/bin/space-rescue-squad.sfc" | awk '{print $1}')"

          cat >> "$main" <<'EOF'
          // SODIUM64 GATE-B COMPILE-TIME SYMBOL PROBE; emits no ROM data.
          print "SODIUM64_SRS_FRAME_COUNTER_ADDR="
          print_hex(6, frameCounter)
          print "\n"
          print "SODIUM64_SRS_ROOM_ID_ADDR="
          print_hex(6, GameState.roomId)
          print "\n"
          print "SODIUM64_SRS_PLAYER_X_ADDR="
          print_hex(6, Entity.Player.xPos.px)
          print "\n"
          print "SODIUM64_SRS_PLAYER_Y_ADDR="
          print_hex(6, Entity.Player.yPos.px)
          print "\n"
          print "SODIUM64_SRS_CAMERA_X_ADDR="
          print_hex(6, Camera.xPos)
          print "\n"
          print "SODIUM64_SRS_CAMERA_Y_ADDR="
          print_hex(6, Camera.yPos)
          print "\n"
          EOF

          touch "$main"
          make -C "$root/game" bin/space-rescue-squad.sfc 2>&1 | tee srs-reference-symbols.log
          after="$(sha256sum "$root/game/bin/space-rescue-squad.sfc" | awk '{print $1}')"
          test "$before" = "$after"
          test "$after" = "$ROUTE_ROM_SHA256"

          probe() {
            sed -n "s/^SODIUM64_SRS_$1=//p" srs-reference-symbols.log | tail -n1
          }
          for key in FRAME_COUNTER_ADDR ROOM_ID_ADDR PLAYER_X_ADDR PLAYER_Y_ADDR CAMERA_X_ADDR CAMERA_Y_ADDR; do
            value="$(probe "$key")"
            test -n "$value"
            echo "SRS_$key=$value" >> "$GITHUB_ENV"
          done

      - name: Build pinned direct-SNES ares with read-only frame tracer
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ares-sfc"
          git clone --filter=blob:none https://github.com/ares-emulator/ares.git "$root"
          git -C "$root" checkout "$ARES_PIN"
          cd "$root"

          python3 - <<'PY'
          from pathlib import Path
          import os

          def guest_to_wram(name):
              value = int(os.environ[name], 16)
              bank = (value >> 16) & 0xff
              addr = value & 0xffff
              if bank == 0x7e:
                  return addr
              if bank == 0x7f:
                  return 0x10000 + addr
              if ((bank & 0x40) == 0) and addr < 0x2000:
                  return addr
              raise SystemExit(f"{name}=0x{value:06x} is not a WRAM address/mirror")

          offsets = {
              "fc": guest_to_wram("SRS_FRAME_COUNTER_ADDR"),
              "room": guest_to_wram("SRS_ROOM_ID_ADDR"),
              "px": guest_to_wram("SRS_PLAYER_X_ADDR"),
              "py": guest_to_wram("SRS_PLAYER_Y_ADDR"),
              "cx": guest_to_wram("SRS_CAMERA_X_ADDR"),
              "cy": guest_to_wram("SRS_CAMERA_Y_ADDR"),
          }

          ppu = Path("ares/sfc/ppu/ppu.cpp")
          s = ppu.read_text()
          anchor = '#include <sfc/sfc.hpp>\n'
          assert s.count(anchor) == 1
          ppu.write_text(s.replace(anchor, anchor + '#include <cstdio>\n#include <cstdlib>\n', 1))

          main = Path("ares/sfc/ppu/main.cpp")
          s = main.read_text()
          anchor = "    screen->frame();\n    scheduler.exit(Event::Frame);"
          assert s.count(anchor) == 1
          trace = f"""    screen->frame();

              static u32 sodium64TraceFrame = 0;
              sodium64TraceFrame++;

              auto s64fc =
                  (u32)cpu.wram[{offsets['fc']}] |
                  ((u32)cpu.wram[{offsets['fc'] + 1}] << 8) |
                  ((u32)cpu.wram[{offsets['fc'] + 2}] << 16) |
                  ((u32)cpu.wram[{offsets['fc'] + 3}] << 24);
              auto s64room = (u32)cpu.wram[{offsets['room']}];
              auto s64px = (u32)cpu.wram[{offsets['px']}] | ((u32)cpu.wram[{offsets['px'] + 1}] << 8);
              auto s64py = (u32)cpu.wram[{offsets['py']}] | ((u32)cpu.wram[{offsets['py'] + 1}] << 8);
              auto s64cx = (u32)cpu.wram[{offsets['cx']}] | ((u32)cpu.wram[{offsets['cx'] + 1}] << 8);
              auto s64cy = (u32)cpu.wram[{offsets['cy']}] | ((u32)cpu.wram[{offsets['cy'] + 1}] << 8);

              std::fprintf(stderr,
                "SODIUM64_SRS_REF host_frame=%u game_frame=%u room=%u player_x=%u player_y=%u camera_x=%u camera_y=%u\\n",
                sodium64TraceFrame, s64fc, s64room, s64px, s64py, s64cx, s64cy);
              std::fflush(stderr);
              if(sodium64TraceFrame >= 600) std::_Exit(0);

              scheduler.exit(Event::Frame);"""
          main.write_text(s.replace(anchor, trace, 1))
          print("reference WRAM offsets", offsets)
          PY

          ccache --zero-stats
          .github/scripts/build_sdl.sh
          cmake --preset ubuntu-ci -DARES_CORES=sfc
          cmake --build build --parallel "$(nproc)"
          ccache --show-stats

          ares_bin=$(find "$root/build" -type f -name ares -perm -111 | head -n1)
          test -n "$ares_bin"
          test -x "$ares_bin"
          echo "ARES_SFC_BIN=$ares_bin" >> "$GITHUB_ENV"
          "$ares_bin" --version | tee "$GITHUB_WORKSPACE/ares-sfc-version.txt"

      - name: Capture direct-SNES semantic trace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reference
          rom="$SRS_ROOT/game/bin/space-rescue-squad.sfc"
          log="reference/srs-direct-snes.log"
          home="$RUNNER_TEMP/ares-sfc-home"
          settings="$RUNNER_TEMP/ares-sfc-settings.bml"
          mkdir -p "$home"

          HOME="$home" SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 \
            timeout --signal=TERM --kill-after=10s 300s \
            xvfb-run -a stdbuf -oL -eL "$ARES_SFC_BIN" \
              --no-file-prompt \
              --system "Super Famicom" \
              --settings-file "$settings" \
              --setting "Video/PixelAccuracy=true" \
              --setting "Developer/DeterministicEntropy=true" \
              "$rom" 2>&1 | tee "$log"

          grep '^SODIUM64_SRS_REF ' "$log" > reference/srs-direct-snes-trace.txt
          test "$(wc -l < reference/srs-direct-snes-trace.txt)" -eq 600

          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          rx = re.compile(
              r"^SODIUM64_SRS_REF host_frame=(\d+) game_frame=(\d+) room=(\d+) "
              r"player_x=(\d+) player_y=(\d+) camera_x=(\d+) camera_y=(\d+)$"
          )
          rows = []
          for line in Path("reference/srs-direct-snes-trace.txt").read_text().splitlines():
              m = rx.match(line)
              if not m:
                  raise SystemExit(f"bad trace line: {line}")
              host, game, room, px, py, cx, cy = map(int, m.groups())
              rows.append({
                  "host_frame": host,
                  "game_frame": game,
                  "room_id": room,
                  "player_x": px,
                  "player_y": py,
                  "camera_x": cx,
                  "camera_y": cy,
              })

          assert len(rows) == 600
          assert [r["host_frame"] for r in rows] == list(range(1, 601))
          payload = {
              "reference": "ares direct Super Famicom core",
              "ares_pin": "17813a3ccda21ab9bd45f09bfc2f91196dbf50ff",
              "benchmark_rom_sha256": os.environ["ROUTE_ROM_SHA256"],
              "route_id": os.environ["ROUTE_ID"],
              "route_patch_sha256": os.environ["ROUTE_PATCH_SHA256"],
              "deterministic_entropy": True,
              "trace_frames": len(rows),
              "rows": rows,
          }
          Path("reference/srs-direct-snes.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n"
          )

          meaningful = [
              r for r in rows
              if r["game_frame"] < 10000
              and 0 < r["room_id"] < 32
              and 0x1000 <= r["player_x"] < 0x8000
          ]
          print(f"trace rows={len(rows)} plausible-gameplay rows={len(meaningful)}")
          if meaningful:
              print("first plausible", meaningful[0])
              print("last plausible", meaningful[-1])
              print("max plausible player_x", max(r["player_x"] for r in meaningful))
              print("visited room ids", sorted(set(r["room_id"] for r in meaningful)))
          PY

          {
            echo "upstream_sha=$SRS_SHA"
            echo "route_id=$ROUTE_ID"
            echo "benchmark_rom_sha256=$ROUTE_ROM_SHA256"
            echo "benchmark_patch_sha256=$ROUTE_PATCH_SHA256"
            echo "ares_pin=$ARES_PIN"
            echo "reference_core=direct Super Famicom"
            echo "trace_contract=read-only WRAM observation after each rendered SNES frame; 600 frames"
          } > reference/reference-provenance.txt

      - name: Upload non-ROM direct-reference evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate-b-srs-representative-direct-snes-reference
          retention-days: 14
          path: |
            ares-sfc-version.txt
            srs-reference-symbols.log
            reference/
