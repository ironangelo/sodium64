name: Gate C E4d Real-N64 Hardware Package

on:
  push:
    branches:
      - phase4/gate-c-h-comp-e4d-hardware-verify
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sodium64-gate-c-e4d-hardware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Install libdragon
        run: npm install -g libdragon

      - name: Checkout Sodium64
        uses: actions/checkout@v4

      - name: Validate deterministic guest and decoder
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile             scripts/make_gate_c_h_comp_e1_z_tag.py             scripts/e4d_hw_verify_report.py
          mkdir -p diagnostic
          python3 scripts/make_gate_c_h_comp_e1_z_tag.py diagnostic/e4d-a.smc
          python3 scripts/make_gate_c_h_comp_e1_z_tag.py diagnostic/e4d-b.smc
          cmp diagnostic/e4d-a.smc diagnostic/e4d-b.smc
          test "$(stat -c %s diagnostic/e4d-a.smc)" -eq 32768
          sha256sum diagnostic/e4d-a.smc | tee diagnostic/guest.sha256

          python3 - <<'PY'
          import struct
          from pathlib import Path

          words = [0] * 32
          words[0] = 0x53363445
          words[1] = 1
          words[2] = 0x45344431
          words[3] = 1
          words[4] = 0x1F
          words[5] = 7
          words[6] = 8
          words[7] = 1
          words[8] = 1
          words[9] = 0x81
          words[10] = 0xA00F2300
          words[11] = 0
          words[12] = 0
          words[13] = 2048
          words[14] = 1024
          words[15] = 1024
          words[16] = 0
          words[17] = 0xFFFFFFFF
          words[19] = 0xFFFFFFFF
          words[21] = 1
          words[22] = 0x81
          words[23] = 7
          words[24] = 4096
          words[25] = 2624
          words[26] = 1
          words[29] = 0x80
          words[30] = 0x294B
          words[31] = 0x454E4421
          checksum = 0
          for i, word in enumerate(words):
              if i != 28:
                  checksum ^= word
          words[28] = checksum
          blob = struct.pack(">32I", *words) + bytes(0x8000 - 0x80)
          Path("diagnostic/synthetic-pass.sav").write_bytes(blob)
          PY
          python3 scripts/e4d_hw_verify_report.py diagnostic/synthetic-pass.sav             | tee diagnostic/decoder-selftest.txt

      - name: Build exact hardware verifier
        shell: bash
        run: |
          set -euo pipefail
          libdragon init
          libdragon make E4D_HW_VERIFY=1 -j"$(nproc)" 2>&1 | tee hardware-build.log
          test -s sodium64.z64
          test -s build/sodium64.elf
          nm -n build/sodium64.elf | grep -E ' e4d_hw_verify_hook$'
          nm -n build/sodium64.elf | grep -E ' wram$'
          python3 scripts/build_metrics.py             --rom sodium64.z64             --elf build/sodium64.elf             --build-dir build             --output hardware-build-metrics.txt
          sha256sum sodium64.z64 build/sodium64.elf             | tee hardware-build.sha256
          grep -E '(^|[[:space:]])(text|\.text)' build/rsp_main.map || true

      - name: Wrap exact E4d synthetic guest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wrap package
          cp sodium64.z64 wrap/sodium64.z64
          cp rom-converter.py wrap/rom-converter.py
          cp diagnostic/e4d-a.smc wrap/e4d-resident-correctness.smc
          (
            cd wrap
            python3 rom-converter.py </dev/null
          )
          test -s wrap/out/e4d-resident-correctness.z64

          dd if=wrap/out/e4d-resident-correctness.z64             of=package/embedded.smc bs=1 skip=$((0x104000)) count=$((32 * 1024)) status=none
          cmp diagnostic/e4d-a.smc package/embedded.smc
          rm package/embedded.smc

          cp wrap/out/e4d-resident-correctness.z64 package/e4d-resident-correctness.z64
          cp build/sodium64.elf package/sodium64-e4d-hardware.elf
          cp build/sodium64.map package/sodium64-e4d-hardware.map
          cp build/rsp_main.map package/rsp_main.map
          cp scripts/e4d_hw_verify_report.py package/e4d_hw_verify_report.py
          cp diagnostic/guest.sha256 package/guest.sha256
          cp hardware-build.log package/hardware-build.log
          cp hardware-build-metrics.txt package/hardware-build-metrics.txt
          cp hardware-build.sha256 package/hardware-build.sha256
          sha256sum package/e4d-resident-correctness.z64             package/sodium64-e4d-hardware.elf             package/rsp_main.map             package/e4d_hw_verify_report.py             | tee package/package.sha256

          cat > package/README.txt <<'EOF'
          Sodium64 E4d real-N64 correctness milestone

          Run e4d-resident-correctness.z64 on real N64 and wait until the screen
          freezes solid GREEN (PASS) or RED (FAIL). Only then leave the ROM/reset
          as required by the flashcart and extract its SRAM save.

          The SRAM record at offset 0 is S64E version 1, test E4D1.
          Decode with:
              python3 e4d_hw_verify_report.py <save-file>

          This build measures correctness only. Do not use its runtime duration
          as compositor performance/cadence evidence.
          EOF

      - name: Upload real-N64 package
        uses: actions/upload-artifact@v4
        with:
          name: sodium64-e4d-real-n64-correctness
          retention-days: 30
          path: package/


  emulator-verifier-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: package
    steps:
      - name: Download exact hardware package
        uses: actions/download-artifact@v4
        with:
          name: sodium64-e4d-real-n64-correctness
          path: package

      - name: Install pinned Mupen64Plus dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            expect \
            git \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libpng-dev \
            libsdl2-dev \
            libvulkan-dev \
            pkg-config \
            python3 \
            zlib1g-dev

      - name: Build pinned Mupen64Plus debugger and LLE RSP
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/sodium64-mupen"
          mkdir -p "$root"
          cd "$root"

          git clone https://github.com/mupen64plus/mupen64plus-core.git
          git -C mupen64plus-core checkout b20b27ebf9e5b099a978e86dba609111dc98c837
          git clone https://github.com/mupen64plus/mupen64plus-ui-console.git
          git -C mupen64plus-ui-console checkout c8ac4862a019d7885b24927d9b4db5dd3e42a528
          git clone https://github.com/mupen64plus/mupen64plus-rsp-cxd4.git
          git -C mupen64plus-rsp-cxd4 checkout 00906a92641c540a64e4e7505012157315314810

          export PATH="$root/mupen64plus-core/.github/workflows/scripts:$PATH"

          cd "$root/mupen64plus-core"
          export CONFIG_OVERRIDE="DEBUGGER=1 DEBUGGER_NO_DISASM=1 NEW_DYNAREC=0 NO_ASM=1"
          ci_build.sh x64 gcc

          cd "$root/mupen64plus-ui-console"
          export CONFIG_OVERRIDE=""
          ci_build.sh x64 gcc

          cd "$root/mupen64plus-rsp-cxd4"
          export CONFIG_OVERRIDE='SSE="none"'
          export OPTFLAGS="-O3"
          ci_build.sh x64 gcc

          core_lib=$(find "$root/mupen64plus-core/pkg/usr/local/lib" -maxdepth 1 -type f -name 'libmupen64plus.so*' | head -n1)
          ui_bin="$root/mupen64plus-ui-console/pkg/usr/local/bin/mupen64plus"
          rsp_lib=$(find "$root/mupen64plus-rsp-cxd4/pkg/usr/local/lib/mupen64plus" -type f -name '*cxd4*.so' | head -n1)
          data_dir="$root/mupen64plus-core/pkg/usr/local/share/mupen64plus"

          test -f "$core_lib"
          test -x "$ui_bin"
          test -f "$rsp_lib"
          test -d "$data_dir"

          {
            echo "M64P_CORE=$core_lib"
            echo "M64P_UI=$ui_bin"
            echo "M64P_RSP=$rsp_lib"
            echo "M64P_DATA=$data_dir"
            echo "M64P_LIBDIR=$(dirname "$core_lib")"
          } >> "$GITHUB_ENV"

      - name: Locate exact verifier state
        shell: bash
        run: |
          set -euo pipefail
          elf=package/sodium64-e4d-hardware.elf
          sram=$(nm -n "$elf" | awk '$3 == "sram" { print $1; exit }')
          hook=$(nm -n "$elf" | awk '$3 == "e4d_hw_verify_hook" { print $1; exit }')
          state=$(nm -n "$elf" | awk '$3 == "e4d_hw_state" { print $1; exit }')
          wram=$(nm -n "$elf" | awk '$3 == "wram" { print $1; exit }')
          framebuffer=$(nm -n "$elf" | awk '$3 == "framebuffer" { print $1; exit }')
          test -n "$sram"
          test -n "$hook"
          test -n "$state"
          test -n "$wram"
          test -n "$framebuffer"
          {
            echo "SRAM_ADDR=$sram"
            echo "VERIFY_HOOK=$hook"
            echo "E4D_STATE_ADDR=$state"
            echo "WRAM_ADDR=$wram"
            echo "FRAMEBUFFER_PTR_ADDR=$framebuffer"
          } >> "$GITHUB_ENV"
          echo "SRAM=0x$sram verifier=0x$hook state=0x$state WRAM=0x$wram framebuffer_ptr=0x$framebuffer"

      - name: Run exact hardware ROM and dump S64E
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m64p-config-e4d" smoke
          export S64E_DUMP="$GITHUB_WORKSPACE/smoke/e4d-s64e.bin"
          cat > "$RUNNER_TEMP/e4d.expect" <<'EOF'
          set timeout 45
          log_file smoke/e4d-mupen.log
          spawn env LD_LIBRARY_PATH=$env(M64P_LIBDIR) $env(M64P_UI) \
            --corelib $env(M64P_CORE) \
            --datadir $env(M64P_DATA) \
            --configdir $env(RUNNER_TEMP)/m64p-config-e4d \
            --debug --emumode 0 --nospeedlimit \
            --gfx dummy --audio dummy --input dummy --rsp $env(M64P_RSP) \
            package/e4d-resident-correctness.z64
          expect "(dbg)"
          send "run\r"
          after 20000
          send "pause\r"
          expect "(dbg)"
          send "pc\r"
          expect "(dbg)"
          send "dumpmem $env(SRAM_ADDR) 128 $env(S64E_DUMP)\r"
          expect "(dbg)"
          send "dumpmem $env(E4D_STATE_ADDR) 16 $env(GITHUB_WORKSPACE)/smoke/e4d-state.bin\r"
          expect "(dbg)"
          send "dumpmem $env(WRAM_ADDR) 16 $env(GITHUB_WORKSPACE)/smoke/e4d-wram.bin\r"
          expect "(dbg)"
          send "dumpmem $env(FRAMEBUFFER_PTR_ADDR) 4 $env(GITHUB_WORKSPACE)/smoke/framebuffer-ptr.bin\r"
          expect "(dbg)"
          send "quit\r"
          expect eof
          EOF
          expect "$RUNNER_TEMP/e4d.expect"
          test -s smoke/e4d-s64e.bin
          test "$(stat -c %s smoke/e4d-s64e.bin)" -eq 128
          test "$(stat -c %s smoke/e4d-state.bin)" -eq 16
          test "$(stat -c %s smoke/e4d-wram.bin)" -eq 16
          test "$(stat -c %s smoke/framebuffer-ptr.bin)" -eq 4

      - name: Decode verifier record
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee smoke/e4d-state-report.txt
          from pathlib import Path
          import struct

          def normalize_debugger_dump(blob):
              assert len(blob) % 4 == 0
              return b"".join(blob[i:i+4][::-1] for i in range(0, len(blob), 4))

          def words(path):
              blob = normalize_debugger_dump(Path(path).read_bytes())
              return [f"0x{value:08X}" for value in struct.unpack(f">{len(blob)//4}I", blob)]

          state = normalize_debugger_dump(Path("smoke/e4d-state.bin").read_bytes())
          wram = normalize_debugger_dump(Path("smoke/e4d-wram.bin").read_bytes())
          fb = normalize_debugger_dump(Path("smoke/framebuffer-ptr.bin").read_bytes())
          print("state words:", [f"0x{value:08X}" for value in struct.unpack(">4I", state)])
          print("WRAM first16 canonical:", wram.hex())
          print("guest_counter:", wram[0])
          print("framebuffer ptr:", [f"0x{struct.unpack('>I', fb)[0]:08X}"])
          PY
          python3 package/e4d_hw_verify_report.py smoke/e4d-s64e.bin \
            | tee smoke/e4d-s64e-report.txt
          grep -F "result:            PASS" smoke/e4d-s64e-report.txt
          grep -F "active pixels:     4096/4096 correct" smoke/e4d-s64e-report.txt
          grep -F "border pixels:     2624/2624 correct" smoke/e4d-s64e-report.txt

      - name: Upload verifier smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sodium64-e4d-verifier-mupen-smoke
          retention-days: 30
          if-no-files-found: ignore
          path: smoke/
