name: Gate C H-COMP E4b Mupen Angrylion Crosscheck

on:
  push:
    branches:
      - phase4/gate-c-h-comp-e4b-mupen-angrylion-crosscheck
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sodium64-gate-c-h-comp-e4b-mupen-angrylion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Install libdragon
        run: npm install -g libdragon

      - name: Checkout Sodium64
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify runtime is byte-identical to original-Main diagnostic parent
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff 7609019cc26411a3ff179d7edad3110b1f9200b2 -- src/)"
          git diff --stat 7609019cc26411a3ff179d7edad3110b1f9200b2
          python3 -m py_compile             scripts/make_gate_c_h_comp_e1_z_tag.py             scripts/gate_c_h_comp_mupen_crosscheck.py

      - name: Generate deterministic E4b guest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic workload
          python3 scripts/make_gate_c_h_comp_e1_z_tag.py diagnostic/e1c-a.smc
          python3 scripts/make_gate_c_h_comp_e1_z_tag.py diagnostic/e1c-b.smc
          cmp diagnostic/e1c-a.smc diagnostic/e1c-b.smc
          test "$(stat -c %s diagnostic/e1c-a.smc)" -eq 32768
          sha256sum diagnostic/e1c-a.smc | tee diagnostic/guest.sha256

      - name: Build exact original-Main diagnostic runtime
        shell: bash
        run: |
          set -euo pipefail
          libdragon init
          libdragon make -j"$(nproc)" 2>&1 | tee sodium64-build.log
          test -s sodium64.z64
          test -s build/sodium64.elf
          sha256sum sodium64.z64 build/sodium64.elf | tee build-sha256.txt

      - name: Wrap exact deterministic guest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wrap
          cp diagnostic/e1c-a.smc workload/e1c.smc
          cp sodium64.z64 wrap/sodium64.z64
          cp rom-converter.py wrap/rom-converter.py
          cp workload/e1c.smc wrap/e1c.smc
          (cd wrap && python3 rom-converter.py </dev/null)
          test -s wrap/out/e1c.z64
          dd if=wrap/out/e1c.z64 of=workload/embedded.smc             bs=1 skip=$((0x104000)) count=$((32 * 1024)) status=none
          cmp workload/e1c.smc workload/embedded.smc
          sha256sum workload/e1c.smc wrap/out/e1c.z64 | tee workload/hashes.sha256
          rm workload/embedded.smc

      - name: Locate clean-epoch capture state
        shell: bash
        run: |
          set -euo pipefail
          elf=build/sodium64.elf
          symbol() { nm -n "$elf" | awk -v name="$1" '$3 == name { print $1; exit }'; }
          wram=$(symbol wram)
          rsp_wait=$(symbol rsp_wait)
          test -n "$wram"
          test -n "$rsp_wait"
          capture_ready=$(printf '%08x' "$((16#$rsp_wait + 0x14))")
          capture_ready_hex=$(printf '%08X' "$((16#$rsp_wait + 0x14))")
          {
            echo "GUEST_COUNTER_ADDR=0x$wram"
            echo "CAPTURE_READY_ADDR=0x$capture_ready"
            echo "CAPTURE_READY_HEX=$capture_ready_hex"
          } | tee -a "$GITHUB_ENV"
          printf 'wram=0x%s rsp_wait=0x%s capture_ready=0x%s\n'             "$wram" "$rsp_wait" "$capture_ready"

      - name: Generate paused-debugger seed and capture streams
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p captures
          python3 scripts/gate_c_h_comp_mupen_crosscheck.py commands             --guest-counter-address "$GUEST_COUNTER_ADDR"             --seed-output captures/seed.commands             --post-output captures/post.commands             | tee captures/command-plan.json
          sha256sum captures/seed.commands captures/post.commands             | tee captures/command-streams.sha256

      - name: Install pinned Mupen and Angrylion build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential             cmake             expect             freeglut3-dev             git             libfreetype6-dev             libgl1-mesa-dev             libgl1-mesa-dri             libglu1-mesa-dev             libpng-dev             libsdl2-dev             libvulkan-dev             libx11-dev             libxrandr-dev             pkg-config             xauth             xvfb             zlib1g-dev

      - name: Build pinned Mupen64Plus debugger and cxd4 LLE RSP
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/sodium64-mupen"
          mkdir -p "$root"
          cd "$root"

          git clone https://github.com/mupen64plus/mupen64plus-core.git
          git -C mupen64plus-core checkout b20b27ebf9e5b099a978e86dba609111dc98c837
          git clone https://github.com/mupen64plus/mupen64plus-ui-console.git
          git -C mupen64plus-ui-console checkout c8ac4862a019d7885b24927d9b4db5dd3e42a528
          git clone https://github.com/mupen64plus/mupen64plus-rsp-cxd4.git
          git -C mupen64plus-rsp-cxd4 checkout 00906a92641c540a64e4e7505012157315314810

          export PATH="$root/mupen64plus-core/.github/workflows/scripts:$PATH"

          cd "$root/mupen64plus-core"
          export CONFIG_OVERRIDE="DEBUGGER=1 DEBUGGER_NO_DISASM=1 NEW_DYNAREC=0 NO_ASM=1"
          ci_build.sh x64 gcc

          cd "$root/mupen64plus-ui-console"
          export CONFIG_OVERRIDE=""
          ci_build.sh x64 gcc

          cd "$root/mupen64plus-rsp-cxd4"
          export CONFIG_OVERRIDE='SSE="none"'
          export OPTFLAGS="-O3"
          ci_build.sh x64 gcc

          core_lib=$(find "$root/mupen64plus-core/pkg/usr/local/lib" -maxdepth 1 -type f -name 'libmupen64plus.so*' | head -n1)
          ui_bin="$root/mupen64plus-ui-console/pkg/usr/local/bin/mupen64plus"
          rsp_lib=$(find "$root/mupen64plus-rsp-cxd4/pkg/usr/local/lib/mupen64plus" -type f -name '*cxd4*.so' | head -n1)
          data_dir="$root/mupen64plus-core/pkg/usr/local/share/mupen64plus"

          test -f "$core_lib"
          test -x "$ui_bin"
          test -f "$rsp_lib"
          test -d "$data_dir"

          {
            echo "M64P_CORE=$core_lib"
            echo "M64P_UI=$ui_bin"
            echo "M64P_RSP=$rsp_lib"
            echo "M64P_DATA=$data_dir"
            echo "M64P_LIBDIR=$(dirname "$core_lib")"
          } >> "$GITHUB_ENV"

      - name: Build pinned Angrylion software RDP
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/angrylion-rdp-plus"
          git clone https://github.com/ata4/angrylion-rdp-plus.git "$root"
          git -C "$root" checkout 9c8b9ed3e7d7f00dff8bc872ccdd3fba1a3673fc
          cmake -S "$root" -B "$root/build"             -DBUILD_MUPEN64PLUS=ON             -DBUILD_PROJECT64=OFF             -DCMAKE_BUILD_TYPE=Release
          cmake --build "$root/build" --parallel "$(nproc)"
          gfx_lib=$(find "$root/build" -type f -name 'mupen64plus-video-angrylion-plus.so' | head -n1)
          test -f "$gfx_lib"
          echo "M64P_GFX=$gfx_lib" >> "$GITHUB_ENV"
          {
            echo "mupen-core b20b27ebf9e5b099a978e86dba609111dc98c837"
            echo "mupen-ui c8ac4862a019d7885b24927d9b4db5dd3e42a528"
            echo "cxd4 00906a92641c540a64e4e7505012157315314810"
            echo "angrylion-rdp-plus 9c8b9ed3e7d7f00dff8bc872ccdd3fba1a3673fc"
          } | tee captures/lab-pins.txt

      - name: Run exact one-frame clean-epoch crosscheck
        shell: bash
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/m64p-hcomp-config"
          mkdir -p "$config"
          cat > "$RUNNER_TEMP/mupen-hcomp.expect" <<'EOF'
          set timeout 300
          log_file -noappend "$env(GITHUB_WORKSPACE)/captures/mupen-angrylion.log"
          spawn env LD_LIBRARY_PATH=$env(M64P_LIBDIR) LIBGL_ALWAYS_SOFTWARE=1             $env(M64P_UI)               --corelib $env(M64P_CORE)               --datadir $env(M64P_DATA)               --configdir $env(M64P_CONFIG)               --debug --emumode 0 --nospeedlimit --noosd --windowed               --resolution 320x240               --gfx $env(M64P_GFX)               --audio dummy               --input dummy               --rsp $env(M64P_RSP)               --set {Video-AngrylionPlus[Parallel]=False}               --set {Video-AngrylionPlus[NumWorkers]=1}               --set {Video-AngrylionPlus[BusyLoop]=False}               --set {Video-AngrylionPlus[DpCompat]=2}               --set {Video-AngrylionPlus[ViVsync]=False}               $env(M64P_ROM)

          expect "(dbg) "
          send "bp add $env(CAPTURE_READY_ADDR) 1 8\r"
          expect "(dbg) "
          send "run\r"
          expect "PC at 0x$env(CAPTURE_READY_HEX)."
          expect "(dbg) "

          set seedf [open "$env(GITHUB_WORKSPACE)/captures/seed.commands" r]
          set seed [read $seedf]
          close $seedf
          set seed [string map {"\n" "\r"} $seed]
          set send_slow {4096 0.005}
          send -s -- $seed
          expect "PC: $env(CAPTURE_READY_HEX)"
          expect "(dbg) "

          send "bp rm $env(CAPTURE_READY_ADDR)\r"
          expect "(dbg) "
          send "step\r"
          expect "(dbg) "
          send "bp add $env(CAPTURE_READY_ADDR) 1 8\r"
          expect "(dbg) "
          send "run\r"
          expect "PC at 0x$env(CAPTURE_READY_HEX)."
          expect "(dbg) "

          set postf [open "$env(GITHUB_WORKSPACE)/captures/post.commands" r]
          set post [read $postf]
          close $postf
          set post [string map {"\n" "\r"} $post]
          send -s -- $post
          expect "PC: $env(CAPTURE_READY_HEX)"
          expect "(dbg) "
          send "quit\r"
          expect eof
          EOF

          export M64P_CONFIG="$config"
          export M64P_ROM="$GITHUB_WORKSPACE/wrap/out/e1c.z64"
          (
            cd captures
            timeout 330 xvfb-run -a expect "$RUNNER_TEMP/mupen-hcomp.expect"
          )

      - name: Classify Mupen Angrylion crosscheck
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/gate_c_h_comp_mupen_crosscheck.py classify             --guest-counter-address "$GUEST_COUNTER_ADDR"             --input-dir captures             --output captures/result.json             | tee captures/classify.log

      - name: Upload Mupen Angrylion crosscheck evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-h-comp-e4b-mupen-angrylion-evidence
          retention-days: 30
          if-no-files-found: ignore
          path: |
            captures/
            diagnostic/guest.sha256
            workload/hashes.sha256
            workload/e1c.smc
            sodium64-build.log
            build-sha256.txt
            build/rsp_main.map
