name: Gate C H-COMP Raw Palette Pointer Publication Proof

on:
  push:
    branches:
      - 'phase4/gate-c-h-comp-post-pr15-raw-palette-publish-proof'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sodium64-gate-c-hcomp-raw-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Install libdragon
        run: npm install -g libdragon

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build exact candidate
        shell: bash
        run: |
          set -euo pipefail
          libdragon init
          libdragon make -j$(nproc) 2>&1 | tee build.log
          sha256sum sodium64.z64 build/sodium64.elf | tee runtime.sha256

      - name: Generate and wrap original smoke guest
        shell: bash
        run: |
          set -euo pipefail
          mkdir workload
          cp sodium64.z64 rom-converter.py workload/
          python3 scripts/make_smoke_snes.py workload/smoke.smc
          (
            cd workload
            python3 rom-converter.py </dev/null
          )
          test -f workload/out/smoke.z64
          sha256sum workload/smoke.smc workload/out/smoke.z64 | tee guest.sha256

      - name: Install Mupen64Plus build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential expect git libfreetype6-dev libgl1-mesa-dev             libglu1-mesa-dev libpng-dev libsdl2-dev libvulkan-dev pkg-config zlib1g-dev

      - name: Build pinned Mupen64Plus debugger and LLE RSP
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/sodium64-mupen"
          mkdir -p "$root"
          cd "$root"
          git clone https://github.com/mupen64plus/mupen64plus-core.git
          git -C mupen64plus-core checkout b20b27ebf9e5b099a978e86dba609111dc98c837
          git clone https://github.com/mupen64plus/mupen64plus-ui-console.git
          git -C mupen64plus-ui-console checkout c8ac4862a019d7885b24927d9b4db5dd3e42a528
          git clone https://github.com/mupen64plus/mupen64plus-rsp-cxd4.git
          git -C mupen64plus-rsp-cxd4 checkout 00906a92641c540a64e4e7505012157315314810
          export PATH="$root/mupen64plus-core/.github/workflows/scripts:$PATH"
          cd "$root/mupen64plus-core"
          export CONFIG_OVERRIDE="DEBUGGER=1 DEBUGGER_NO_DISASM=1 NEW_DYNAREC=0 NO_ASM=1"
          ci_build.sh x64 gcc
          cd "$root/mupen64plus-ui-console"
          export CONFIG_OVERRIDE=""
          ci_build.sh x64 gcc
          cd "$root/mupen64plus-rsp-cxd4"
          export CONFIG_OVERRIDE='SSE="none"'
          export OPTFLAGS="-O3"
          ci_build.sh x64 gcc
          core_lib=$(find "$root/mupen64plus-core/pkg/usr/local/lib" -maxdepth 1 -type f -name 'libmupen64plus.so*' | head -n1)
          ui_bin="$root/mupen64plus-ui-console/pkg/usr/local/bin/mupen64plus"
          rsp_lib=$(find "$root/mupen64plus-rsp-cxd4/pkg/usr/local/lib/mupen64plus" -type f -name '*cxd4*.so' | head -n1)
          data_dir="$root/mupen64plus-core/pkg/usr/local/share/mupen64plus"
          {
            echo "M64P_CORE=$core_lib"
            echo "M64P_UI=$ui_bin"
            echo "M64P_RSP=$rsp_lib"
            echo "M64P_DATA=$data_dir"
            echo "M64P_LIBDIR=$(dirname "$core_lib")"
          } >> "$GITHUB_ENV"

      - name: Dump post-init DMEM publication block
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m64p-config"
          cat > "$RUNNER_TEMP/publish.expect" <<'EOF'
          set timeout 60
          log_file publish-emulator.log
          spawn env LD_LIBRARY_PATH=$env(M64P_LIBDIR) $env(M64P_UI)             --corelib $env(M64P_CORE)             --datadir $env(M64P_DATA)             --configdir $env(RUNNER_TEMP)/m64p-config             --debug --emumode 0 --nospeedlimit             --gfx dummy --audio dummy --input dummy --rsp $env(M64P_RSP)             workload/out/smoke.z64
          expect "(dbg)"
          send "run\r"
          after 2000
          send "pause\r"
          expect "(dbg)"
          send "dumpmem 0xA4000E90 16 dmem-publish.bin\r"
          expect "(dbg)"
          send "quit\r"
          expect eof
          EOF
          expect "$RUNNER_TEMP/publish.expect"
          test "$(stat -c %s dmem-publish.bin)" -eq 16

      - name: Classify publication
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_gate_c_h_comp_raw_palette_publish.py dmem-publish.bin --output result.json | tee result.txt
          grep -q '"classification": "RAW_PALETTE_PTRS_PUBLISHED"' result.json
          grep -q '"passed": true' result.json

      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-h-comp-raw-palette-publication-evidence
          retention-days: 30
          path: |
            dmem-publish.bin
            result.json
            result.txt
            runtime.sha256
            guest.sha256
            publish-emulator.log
            build.log
            build/rsp_main.map
            build/rsp_mode7.map
