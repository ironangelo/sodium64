name: Gate C H-COMP CGRAM Arithmetic Contract Clean

on:
  push:
    branches:
      - phase4/gate-c-hcomp-cgram-arith-contract-clean
    paths:
      - scripts/test_gate_c_hcomp_cgram_arith_contract_clean.py
      - .github/workflows/gate-c-hcomp-cgram-arith-contract-clean.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sodium64-gate-c-hcomp-cgram-arith-contract-clean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-arithmetic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Install libdragon
        run: npm install -g libdragon

      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile and prove clean bridge contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/test_gate_c_hcomp_cgram_arith_contract_clean.py
          python3 scripts/test_gate_c_hcomp_cgram_arith_contract_clean.py | tee hcomp-cgram-arith-contract.txt
          grep -q '^HCOMP_CGRAM_ARITH_CLEAN_L0_VALIDATED$' hcomp-cgram-arith-contract.txt

      - name: Build unchanged current-master runtime
        shell: bash
        run: |
          set -euo pipefail
          libdragon init
          libdragon make -j"$(nproc)" 2>&1 | tee hcomp-cgram-arith-clean-build.log
          python3 scripts/check_rsp_branch_delay_slots.py build/src/rsp_main.elf build/src/rsp_mode7.elf | tee hcomp-cgram-arith-delay-slots.txt
          grep -E '^[[:space:]]*4096[[:space:]]+4096[[:space:]]+0[[:space:]]+8192[[:space:]]+build/src/rsp_main[.]elf$' hcomp-cgram-arith-clean-build.log | tee hcomp-cgram-arith-rsp-main-size.txt
          grep -E '^[[:space:]]*4096[[:space:]]+4096[[:space:]]+0[[:space:]]+8192[[:space:]]+build/src/rsp_mode7[.]elf$' hcomp-cgram-arith-clean-build.log | tee hcomp-cgram-arith-rsp-mode7-size.txt
          sha256sum sodium64.z64 build/sodium64.elf | tee hcomp-cgram-arith-clean-runtime.sha256
          grep -q '^f67033c44581679cacaf4d49c3ce9b4f7db9358ee1f7e4844bc1ec98d12fb393  sodium64.z64$' hcomp-cgram-arith-clean-runtime.sha256

      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-hcomp-cgram-arith-contract-clean
          retention-days: 30
          path: |
            hcomp-cgram-arith-contract.txt
            hcomp-cgram-arith-clean-build.log
            hcomp-cgram-arith-delay-slots.txt
            hcomp-cgram-arith-rsp-main-size.txt
            hcomp-cgram-arith-rsp-mode7-size.txt
            hcomp-cgram-arith-clean-runtime.sha256
            build/rsp_main.map
            build/rsp_mode7.map
