name: Gate C CGRAM H-COMP Bridge Contract

on:
  push:
    branches:
      - phase4/gate-c-cgram-hcomp-bridge-contract
    paths:
      - scripts/test_gate_c_cgram_hcomp_bridge_contract.py
      - .github/workflows/gate-c-cgram-hcomp-bridge-contract.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sodium64-gate-c-cgram-hcomp-bridge-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Install libdragon
        run: npm install -g libdragon

      - name: Checkout
        uses: actions/checkout@v4

      - name: Reprove DMA8 consumer and H-COMP bridge contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_gate_c_cgram_rsp_consumer_impl.py
          python3 scripts/test_gate_c_cgram_hcomp_bridge_contract.py

      - name: Prove zero runtime delta from validated consumer
        shell: bash
        run: |
          set -euo pipefail
          libdragon init
          libdragon make -j"$(nproc)" 2>&1 | tee bridge-contract-build.log
          sha256sum sodium64.z64 build/sodium64.elf | tee bridge-contract-runtime.sha256
          grep -q '^2d38cc4b257d2fa59de52ff99afa57403a9afab978d0c1c8528d2106d2537385  sodium64.z64$' bridge-contract-runtime.sha256
          grep -q '^06989e56faaf07916695bb36bf507f64c474bb35e9aef42dc6bc3d26604e2504  build/sodium64.elf$' bridge-contract-runtime.sha256

      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-cgram-hcomp-bridge-contract
          retention-days: 30
          path: |
            bridge-contract-build.log
            bridge-contract-runtime.sha256
            build/rsp_main.map
            build/rsp_mode7.map
