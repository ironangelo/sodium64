name: Gate C Mode7 Fault Overlay

on:
  push:
    branches:
      - phase4/gate-c-rsp-mode7-fault-proof
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sodium64-gate-c-mode7-fault-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout Sodium64
        uses: actions/checkout@v4

      - name: Validate Mode7 switch generator
        run: python3 scripts/test_gate_c_mode7_switch.py -v

      - name: Generate deterministic original SNES diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostic
          python3 scripts/make_gate_c_mode7_switch.py diagnostic/gate-c-mode7-switch.smc \
            | tee diagnostic/generator.log
          sha256sum diagnostic/gate-c-mode7-switch.smc | tee diagnostic/sha256.txt

          cat > diagnostic/MANIFEST.txt <<EOF
          purpose=Gate C real regular-Mode7 fault-overlay whole-frame proof
          diagnostic_source_sha=$GITHUB_SHA
          control_bgmode=0x01
          treatment_bgmode=0x07
          phase_frames=60
          oracle=guest progression + BGMODE state + RSP completed-fault bits
          pixel_semantics=not_authoritative
          midframe_switching=not_tested
          EOF

      - name: Upload original diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-mode7-fault-diagnostic
          retention-days: 30
          path: |
            diagnostic/gate-c-mode7-switch.smc
            diagnostic/MANIFEST.txt
            diagnostic/generator.log
            diagnostic/sha256.txt

  sodium64-n64-semantic:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs:
      - diagnostic-build

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Install libdragon
        run: npm install -g libdragon

      - name: Checkout Sodium64
        uses: actions/checkout@v4

      - name: Run Mode7 fault-overlay host tests
        run: python3 scripts/test_gate_c_mode7_switch.py -v

      - name: Build exact Sodium64 candidate
        shell: bash
        run: |
          set -euo pipefail
          libdragon init
          libdragon make -j"$(nproc)" 2>&1 | tee sodium64-build.log
          test -s sodium64.z64
          test -s build/sodium64.elf

      - name: Generate and wrap exact original diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workload
          python3 scripts/make_gate_c_mode7_switch.py workload/gate-c-mode7-switch.smc \
            | tee workload/generator.log

          mkdir -p wrap
          cp sodium64.z64 wrap/sodium64.z64
          cp rom-converter.py wrap/rom-converter.py
          cp workload/gate-c-mode7-switch.smc wrap/gate-c-mode7-switch.smc
          (
            cd wrap
            python3 rom-converter.py </dev/null
          )
          test -s wrap/out/gate-c-mode7-switch.z64

          dd if=wrap/out/gate-c-mode7-switch.z64 of=workload/embedded.smc \
            bs=1 skip=$((0x104000)) count=$((32 * 1024)) status=none
          cmp workload/gate-c-mode7-switch.smc workload/embedded.smc
          rm workload/embedded.smc

      - name: Locate Sodium64 diagnostic state
        shell: bash
        run: |
          set -euo pipefail
          elf=build/sodium64.elf
          symbol() {
            nm -n "$elf" | awk -v name="$1" '$3 == name { print $1; exit }'
          }

          wram=$(symbol wram)
          framebuffer=$(symbol framebuffer)
          bg_mode=$(symbol bg_mode)
          rsp_slot_proof=$(symbol rsp_slot_proof)

          for value in "$wram" "$framebuffer" "$bg_mode" "$rsp_slot_proof"; do
            test -n "$value"
          done

          phase=$(printf '%08x' "$((0x$wram + 1))")
          {
            echo "PHASE_ADDR=0x$phase"
            echo "FRAMEBUFFER_ADDR=0x$framebuffer"
            echo "BG_MODE_ADDR=0x$bg_mode"
            echo "RSP_SLOT_PROOF_ADDR=0x$rsp_slot_proof"
          } | tee -a "$GITHUB_ENV"

      - name: Install pinned ares dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache \
            cmake \
            git \
            libgtk-3-dev \
            libgl1-mesa-dri \
            libsdl2-dev \
            libvulkan1 \
            mesa-vulkan-drivers \
            ninja-build \
            qt6-base-dev \
            unzip \
            xauth \
            xvfb

      - name: Build pinned N64-only ares in valid lab mode
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ares-src"
          git clone --filter=blob:none https://github.com/ares-emulator/ares.git "$root"
          git -C "$root" checkout 17813a3ccda21ab9bd45f09bfc2f91196dbf50ff
          cd "$root"

          python3 - <<'PY'
          from pathlib import Path
          p = Path('ares/n64/system/system.cpp')
          s = p.read_text()
          old = 'rsp.recompiler.enabled = value.boolean();'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'rsp.recompiler.enabled = false;', 1))
          PY

          .github/scripts/build_sdl.sh
          cmake --preset ubuntu-ci -DARES_CORES=n64
          cmake --build build --parallel "$(nproc)"
          ares_bin=$(find "$root/build" -type f -name ares -perm -111 | head -n1)
          test -n "$ares_bin"
          test -x "$ares_bin"
          echo "ARES_BIN=$ares_bin" >> "$GITHUB_ENV"
          "$ares_bin" --version | tee "$GITHUB_WORKSPACE/ares-version.txt"

      - name: Capture Mode1 Mode7 return sequence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p captures
          home="$RUNNER_TEMP/ares-home-gate-c-mode7"
          settings="$RUNNER_TEMP/ares-gate-c-mode7-settings.bml"
          mkdir -p "$home"

          HOME="$home" SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 \
            xvfb-run -a stdbuf -oL -eL "$ARES_BIN" \
              --no-file-prompt \
              --system "Nintendo 64" \
              --settings-file "$settings" \
              --setting "Developer/DebugServerEnabled=true" \
              --setting "Developer/DebugServerUseIPv4=true" \
              --setting "Developer/DebugServerPort=9140" \
              --setting "Developer/HomebrewMode=true" \
              --setting "Developer/DeterministicEntropy=true" \
              --setting "Developer/ForceInterpreter=false" \
              --setting "Boot/AwaitGDBClient=true" \
              wrap/out/gate-c-mode7-switch.z64 \
              > captures/ares-n64.log 2>&1 &
          ares_pid=$!

          cleanup() {
            kill "$ares_pid" 2>/dev/null || true
            wait "$ares_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          python3 scripts/gate_c_obj_window_capture_n64.py \
            --port 9140 \
            --phase-address "$PHASE_ADDR" \
            --framebuffer-address "$FRAMEBUFFER_ADDR" \
            --control-target 0x01 \
            --treatment-target 0x07 \
            --capture-return-control \
            --allow-blank \
            --observe "bg_mode:$BG_MODE_ADDR:1" \
            --observe "rsp_slot_proof:$RSP_SLOT_PROOF_ADDR:1" \
            --output-dir captures

          python3 - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path('captures/state.json').read_text())
          control = state['control']
          treatment = state['treatment']
          returned = state['return_control']

          assert control['phase'] == 0x01 and control['bg_mode'] == 0x01, state
          assert treatment['phase'] == 0x07 and treatment['bg_mode'] == 0x07, state
          assert returned['phase'] == 0x01 and returned['bg_mode'] == 0x01, state

          # Boot starts with the regular renderer. Mode7 must fault-load during
          # treatment; returning to Mode1 must then fault-load regular again.
          assert (treatment['rsp_slot_proof'] & 0x02) == 0x02, state
          assert (treatment['rsp_slot_proof'] & 0xFC) == 0, state
          assert returned['rsp_slot_proof'] == 0x03, state

          print(
              'Gate-C Mode7 fault overlay PASS: '
              f"control_proof=0x{control['rsp_slot_proof']:02X} "
              f"treatment_proof=0x{treatment['rsp_slot_proof']:02X} "
              f"return_proof=0x{returned['rsp_slot_proof']:02X}"
          )
          PY

      - name: Upload Mode7 fault-overlay evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-mode7-fault-sodium64-evidence
          retention-days: 30
          path: |
            captures/
            ares-version.txt
            sodium64-build.log
            workload/generator.log
