name: Gate C H-COMP E4d Vector Full Width

on:
  push:
    branches:
      - phase4/gate-c-h-comp-e4d-vector-full-width
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sodium64-gate-c-h-comp-e4d-vector-full-width-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Install libdragon
        run: npm install -g libdragon

      - name: Checkout Sodium64
        uses: actions/checkout@v4

      - name: Validate deterministic E4d full-width guest
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/make_gate_c_h_comp_e1_z_tag.py \
            scripts/gate_c_h_comp_e1_z_tag_capture_n64.py
          mkdir -p diagnostic
          python3 scripts/make_gate_c_h_comp_e1_z_tag.py diagnostic/e1c-a.smc
          python3 scripts/make_gate_c_h_comp_e1_z_tag.py diagnostic/e1c-b.smc
          cmp diagnostic/e1c-a.smc diagnostic/e1c-b.smc
          test "$(stat -c %s diagnostic/e1c-a.smc)" -eq 32768
          sha256sum diagnostic/e1c-a.smc | tee diagnostic/guest.sha256

      - name: Build E4d full-width runtime with frozen guest
        shell: bash
        run: |
          set -euo pipefail
          libdragon init
          libdragon make -j"$(nproc)" 2>&1 | tee sodium64-build.log
          test -s sodium64.z64
          test -s build/sodium64.elf
          sha256sum sodium64.z64 build/sodium64.elf | tee build-sha256.txt
          grep -E '(^|[[:space:]])(text|\.text)' build/rsp_main.map || true

      - name: Wrap exact E4d full-width guest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wrap workload
          cp diagnostic/e1c-a.smc workload/e1c.smc
          cp sodium64.z64 wrap/sodium64.z64
          cp rom-converter.py wrap/rom-converter.py
          cp workload/e1c.smc wrap/e1c.smc
          (cd wrap && python3 rom-converter.py </dev/null)
          test -s wrap/out/e1c.z64
          dd if=wrap/out/e1c.z64 of=workload/embedded.smc \
            bs=1 skip=$((0x104000)) count=$((32 * 1024)) status=none
          cmp workload/e1c.smc workload/embedded.smc
          sha256sum workload/e1c.smc wrap/out/e1c.z64 | tee workload/hashes.sha256
          rm workload/embedded.smc

      - name: Locate frozen E4b capture state
        shell: bash
        run: |
          set -euo pipefail
          elf=build/sodium64.elf
          symbol() { nm -n "$elf" | awk -v name="$1" '$3 == name { print $1; exit }'; }
          wram=$(symbol wram)
          framebuffer=$(symbol framebuffer)
          rsp_wait=$(symbol rsp_wait)
          test -n "$wram"
          test -n "$framebuffer"
          test -n "$rsp_wait"
          # rsp_wait starts with a pseudo-op "lw absolute" that expands to
          # lui+lw, so +0x10 is the branch delay slot. +0x14 is the first PC
          # reachable only after the HALT-observed branch falls through.
          capture_ready=$(printf '%08x' "$((16#$rsp_wait + 0x14))")
          {
            echo "GUEST_COUNTER_ADDR=0x$wram"
            echo "FRAMEBUFFER_ADDR=0x$framebuffer"
            echo "CAPTURE_READY_ADDR=0x$capture_ready"
          } | tee -a "$GITHUB_ENV"
          printf 'wram=0x%s framebuffer=0x%s rsp_wait=0x%s capture_ready=0x%s\n' \
            "$wram" "$framebuffer" "$rsp_wait" "$capture_ready"

      - name: Install pinned ares dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache cmake git libgtk-3-dev libgl1-mesa-dri libsdl2-dev \
            libvulkan1 mesa-vulkan-drivers ninja-build qt6-base-dev unzip xauth xvfb

      - name: Build pinned N64-only ares in established valid lab mode
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/ares-src"
          git clone --filter=blob:none https://github.com/ares-emulator/ares.git "$root"
          git -C "$root" checkout 17813a3ccda21ab9bd45f09bfc2f91196dbf50ff
          cd "$root"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ares/n64/system/system.cpp')
          s = p.read_text()
          old = 'rsp.recompiler.enabled = value.boolean();'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'rsp.recompiler.enabled = false;', 1))
          PY
          .github/scripts/build_sdl.sh
          cmake --preset ubuntu-ci -DARES_CORES=n64
          cmake --build build --parallel "$(nproc)"
          ares_bin=$(find "$root/build" -type f -name ares -perm -111 | head -n1)
          test -x "$ares_bin"
          echo "ARES_BIN=$ares_bin" >> "$GITHUB_ENV"
          "$ares_bin" --version | tee "$GITHUB_WORKSPACE/ares-version.txt"

      - name: Run stale narrow E4b oracle on E4d full width
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p captures
          home="$RUNNER_TEMP/ares-home-e1c"
          settings="$RUNNER_TEMP/ares-e1c-settings.bml"
          mkdir -p "$home"

          HOME="$home" SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 \
            xvfb-run -a stdbuf -oL -eL "$ARES_BIN" \
              --no-file-prompt \
              --system "Nintendo 64" \
              --settings-file "$settings" \
              --setting "Developer/DebugServerEnabled=true" \
              --setting "Developer/DebugServerUseIPv4=true" \
              --setting "Developer/DebugServerPort=9149" \
              --setting "Developer/HomebrewMode=true" \
              --setting "Developer/DeterministicEntropy=true" \
              --setting "Developer/ForceInterpreter=false" \
              --setting "Boot/AwaitGDBClient=true" \
              wrap/out/e1c.z64 \
              > captures/ares-n64.log 2>&1 &
          pid=$!
          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          python3 scripts/gate_c_h_comp_e1_z_tag_capture_n64.py \
            --port 9149 \
            --guest-counter-address "$GUEST_COUNTER_ADDR" \
            --framebuffer-address "$FRAMEBUFFER_ADDR" \
            --capture-ready-address "$CAPTURE_READY_ADDR" \
            --output-dir captures | tee captures/capture.log

      - name: Upload E4d guest-baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-h-comp-e4d-full-width-evidence
          retention-days: 30
          path: |
            captures/
            diagnostic/guest.sha256
            workload/hashes.sha256
            workload/e1c.smc
            ares-version.txt
            sodium64-build.log
            build-sha256.txt
            build/rsp_main.map
