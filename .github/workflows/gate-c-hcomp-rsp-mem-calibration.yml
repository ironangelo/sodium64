name: Gate C H-COMP RSP Mem Calibration

on:
  push:
    branches:
      - phase4/gate-c-hcomp-third-overlay-mem-calibration
    paths:
      - scripts/check_gate_c_hcomp_rsp_mem_calibration.py
      - .github/workflows/gate-c-hcomp-rsp-mem-calibration.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sodium64-gate-c-hcomp-rsp-mem-calibration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calibrate-rsp-mem:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: latest

      - name: Install libdragon
        run: npm install -g libdragon

      - name: Checkout
        uses: actions/checkout@v4

      - name: Reprove unchanged runtime and calibration checker
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_gate_c_hcomp_third_overlay_exec.py
          python3 scripts/test_gate_c_hcomp_third_overlay_boot.py
          python3 scripts/check_gate_c_hcomp_rsp_mem_calibration.py --self-test
          python3 scripts/make_gate_c_hcomp_third_overlay_boot.py guest-a.smc
          python3 scripts/make_gate_c_hcomp_third_overlay_boot.py guest-b.smc
          cmp guest-a.smc guest-b.smc
          sha256sum guest-a.smc | tee guest.sha256

      - name: Build exact unchanged candidate and expected anchors
        shell: bash
        run: |
          set -euo pipefail
          libdragon init
          libdragon make -j"$(nproc)" 2>&1 | tee build.log
          readelf -sW build/src/rsp_main.elf > rsp-main.syms
          readelf -sW build/src/rsp_mode7.elf > rsp-mode7.syms
          readelf -sW build/src/rsp_hcomp.elf > rsp-hcomp.syms
          python3 scripts/test_gate_c_hcomp_third_overlay_exec.py             --maps build/rsp_main.map build/rsp_mode7.map build/rsp_hcomp.map             --symbols rsp-main.syms rsp-mode7.syms rsp-hcomp.syms

          mode7=$(nm -n build/sodium64.elf | awk '$3 == "rsp_mode7_text_start" { print $1; exit }')
          main=$(nm -n build/sodium64.elf | awk '$3 == "rsp_main_text_start" { print $1; exit }')
          hcomp=$(nm -n build/sodium64.elf | awk '$3 == "rsp_hcomp_text_start" { print $1; exit }')
          wram=$(nm -n build/sodium64.elf | awk '$3 == "wram" { print $1; exit }')
          test -n "$mode7" && test -n "$main" && test -n "$hcomp" && test -n "$wram"
          python3 - "$mode7" "$main" "$hcomp" <<'PY'
          import json,sys
          mode7,main,hcomp=(int(x,16) for x in sys.argv[1:4])
          out={
            "mode7_ptr":f"0x{mode7+0x3A8:08X}",
            "main_ptr":f"0x{main+0x3A8:08X}",
            "hcomp_ptr":f"0x{hcomp+0x3A8:08X}",
            "raw_q1_ptr":"0xA00EF000",
            "raw_q2_ptr":"0xA00EF800",
            "vec_f70":"0x00020000",
          }
          open("expected.json","w").write(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          PY
          echo "GUEST_STATE_ADDR=0x$wram" >> "$GITHUB_ENV"
          sha256sum sodium64.z64 build/sodium64.elf             build/src/rsp_main.elf build/src/rsp_mode7.elf build/src/rsp_hcomp.elf             | tee runtime.sha256

      - name: Wrap deterministic boot-first guest
        shell: bash
        run: |
          set -euo pipefail
          mkdir workload
          cp sodium64.z64 rom-converter.py guest-a.smc workload/
          (
            cd workload
            python3 rom-converter.py </dev/null
          )
          test -f workload/out/guest-a.z64
          sha256sum workload/out/guest-a.z64 | tee wrapped.sha256

      - name: Install Mupen64Plus build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential expect git libfreetype6-dev libgl1-mesa-dev             libglu1-mesa-dev libpng-dev libsdl2-dev libvulkan-dev pkg-config zlib1g-dev

      - name: Build pinned Mupen64Plus debugger and LLE RSP
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/sodium64-mupen"
          mkdir -p "$root"
          cd "$root"

          git clone https://github.com/mupen64plus/mupen64plus-core.git
          git -C mupen64plus-core checkout b20b27ebf9e5b099a978e86dba609111dc98c837
          git clone https://github.com/mupen64plus/mupen64plus-ui-console.git
          git -C mupen64plus-ui-console checkout c8ac4862a019d7885b24927d9b4db5dd3e42a528
          git clone https://github.com/mupen64plus/mupen64plus-rsp-cxd4.git
          git -C mupen64plus-rsp-cxd4 checkout 00906a92641c540a64e4e7505012157315314810

          export PATH="$root/mupen64plus-core/.github/workflows/scripts:$PATH"
          cd "$root/mupen64plus-core"
          export CONFIG_OVERRIDE="DEBUGGER=1 DEBUGGER_NO_DISASM=1 NEW_DYNAREC=0 NO_ASM=1"
          ci_build.sh x64 gcc

          cd "$root/mupen64plus-ui-console"
          export CONFIG_OVERRIDE=""
          ci_build.sh x64 gcc

          cd "$root/mupen64plus-rsp-cxd4"
          export CONFIG_OVERRIDE='SSE="none"'
          export OPTFLAGS="-O3"
          ci_build.sh x64 gcc

          core_lib=$(find "$root/mupen64plus-core/pkg/usr/local/lib" -maxdepth 1 -type f -name 'libmupen64plus.so*' | head -n1)
          ui_bin="$root/mupen64plus-ui-console/pkg/usr/local/bin/mupen64plus"
          rsp_lib=$(find "$root/mupen64plus-rsp-cxd4/pkg/usr/local/lib/mupen64plus" -type f -name '*cxd4*.so' | head -n1)
          data_dir="$root/mupen64plus-core/pkg/usr/local/share/mupen64plus"
          {
            echo "M64P_CORE=$core_lib"
            echo "M64P_UI=$ui_bin"
            echo "M64P_RSP=$rsp_lib"
            echo "M64P_DATA=$data_dir"
            echo "M64P_LIBDIR=$(dirname "$core_lib")"
          } >> "$GITHUB_ENV"

      - name: Capture known RSP anchors and RDRAM control
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence "$RUNNER_TEMP/m64p-config"
          cp expected.json evidence/
          cat > "$RUNNER_TEMP/calibrate.expect" <<'EOF'
          set timeout 90
          log_file evidence/mupen.log
          spawn env LD_LIBRARY_PATH=$env(M64P_LIBDIR) $env(M64P_UI)             --corelib $env(M64P_CORE)             --datadir $env(M64P_DATA)             --configdir $env(RUNNER_TEMP)/m64p-config             --debug --emumode 0 --nospeedlimit             --gfx dummy --audio dummy --input dummy --rsp $env(M64P_RSP)             workload/out/guest-a.z64
          expect "(dbg)"
          send "run\r"
          after 5000
          send "pause\r"
          expect "(dbg)"

          foreach {addr file} {
            A4000E8C e8c-word.txt
            A4000E90 e90-word.txt
            A4000E94 e94-word.txt
            A4000E98 e98-word.txt
            A4000E9C e9c-word.txt
            A4000F70 f70-word.txt
            A4000F10 f10-word.txt
          } {
            send "mem /1w $addr\r"
            expect -re {[\r\n]+([0-9a-fA-F]{8})[ \t]*[\r\n]+}
            set fd [open "evidence/$file" w]
            puts $fd $expect_out(1,string)
            close $fd
            expect "(dbg)"
          }

          send "mem /1w $env(GUEST_STATE_ADDR)\r"
          expect -re {[\r\n]+([0-9a-fA-F]{8})[ \t]*[\r\n]+}
          set fd [open "evidence/wram-word.txt" w]
          puts $fd $expect_out(1,string)
          close $fd
          expect "(dbg)"

          send "dumpmem $env(GUEST_STATE_ADDR) 8 evidence/guest-state.bin\r"
          expect "(dbg)"
          send "pc\r"
          expect "(dbg)"
          send "quit\r"
          expect eof
          EOF
          expect "$RUNNER_TEMP/calibrate.expect"
          test "$(stat -c %s evidence/guest-state.bin)" -eq 8

      - name: Classify debugger address-space behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_gate_c_hcomp_rsp_mem_calibration.py evidence             --output evidence/result.json

      - name: Upload calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-c-hcomp-rsp-mem-calibration
          retention-days: 30
          path: |
            evidence/
            guest-a.smc
            guest.sha256
            wrapped.sha256
            runtime.sha256
            build.log
            build/rsp_main.map
            build/rsp_mode7.map
            build/rsp_hcomp.map
